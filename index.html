  $$('[data-move]', x => { BUI.move = x.dataset.move; BUI.targets = []; ctx.redraw(); });
  $$('[data-tgt]', x => {
    const mv = getMove(BUI.move), id = x.dataset.tgt;
    if (SPREAD_TARGETS.includes(mv?.target)) BUI.targets = BUI.targets.includes(id) ? BUI.targets.filter(y => y !== id) : [...BUI.targets, id];
    else BUI.targets = [id];
    ctx.redraw();
  });
  $$('[data-switch]', x => {
    const nb = clone(b), out = nb.units[b.turn.id], inc = nb.units[x.dataset.switch];
    inc.out = true; inc.pos = out.pos; inc.meter = 0;
    out.out = false; out.pos = null; out.stages = Object.fromEntries(STAGE_KEYS.map(k => [k, 0])); if (out.status === 'tox') out.tox = 1;
    blog(nb, `${sideName(nb, out)} switched ${out.name} for ${inc.name}.`);

    if (a === 'stay') { const nb = clone(b); nb.turn.step = 'act'; return save(nb); }
    if (a === 'rollmove') {
      const tier = speedTier(currentSpeed(turnU));
      const r = await rollDice({ title: `${turnU.name}: move roll`, dice: [tier.die], mode: isDM && turnU.side === 'w' ? mode : mode });
      if (!r) return;
      const nb = clone(b); if (nb.turn?.id !== turnU.id || nb.turn.roll) return; nb.turn.roll = r.total; blog(nb, `${turnU.name} rolled ${r.total} to move.`); return save(nb);
    }
    if (a === 'thaw' || a === 'para') {

      if (!r) return;

      if (a === 'thaw') { if (r.total <= 20) { u.status = null; nb.turn.step = 'move'; blog(nb, `${u.name} thawed out! (rolled ${r.total})`); } else { blog(nb, `${u.name} is frozen solid. (rolled ${r.total})`); return save(finishTurnSafe(nb)); } }
      else { if (r.total <= 25) { blog(nb, `${u.name} is paralyzed and can't move! (rolled ${r.total})`); return save(finishTurnSafe(nb)); } nb.turn.step = 'move'; blog(nb, `${u.name} pushes through the paralysis. (rolled ${r.total})`); }

const finishTurnSafe = nb => { finishTurn(nb); return nb; };
function reachableInBattle(b, mis, u, steps) {   // pass through other Pokémon, not blocked hexes; can't stop on a Pokémon
  const cells = new Set(mis.cells), bl = new Set(mis.blocked || []), occ = occupied(b);
  const seen = new Set([u.pos]); let frontier = [u.pos];
  for (let s = 0; s < steps; s++) {
    const next = [];
    for (const k of frontier) { const [q, r] = k.split(',').map(Number);
      for (const [dq, dr] of NEIGHBORS) { const n = (q + dq) + ',' + (r + dr); if (!seen.has(n) && cells.has(n) && !bl.has(n)) { seen.add(n); next.push(n); } } }
    frontier = next;
  }
  return new Set([...seen].filter(k => k !== u.pos && !occ.has(k)));
}

// Using a move: accuracy roll, damage roll, effects — then the turn passes on.
async function useMove(ctx, actorId, moveName, targetIds) {
  const { c, mis, cid, misNum } = ctx, mode = c.settings?.dice || 'physical';
  const b = clone(mis.battle), u = b.units[actorId], mv = getMove(moveName);
  if (!u || !mv) return;
  const fx = mv.fx, notAuto = !fx || fx.auto === 'no';
  const dealsDamage = mv.category !== 'Status' && (mv.power || fx?.fixed);
  if (notAuto && !dealsDamage) {
    blog(b, `${u.name} used ${mv.name}! (Not automated${fx?.why ? ': ' + fx.why : ''} — resolve it by hand.)`);
    b.last = { who: u.name, move: mv.name, lines: [] }; BUI = {};
    return DB.update(MISSION(cid, misNum), { battle: finishTurnSafe(b) }).catch(saveErr);
  }
  if (notAuto && !confirm(`${mv.name} isn't automated (${fx?.why || 'custom rule'}).\n\nRoll accuracy and damage with its listed power, then apply the rest by hand?`)) return;
  const roll = async (title, dice) => { const r = await rollDice({ title, dice, mode }); if (!r) throw new Error('cancelled'); return r; };
  const lines = [];
  try {
    blog(b, `${u.name} used ${mv.name}!`);
    const selfMv = isSelfMove(mv);
    const targets = selfMv ? [u] : targetIds.map(id => b.units[id]).filter(t => t && onField(b, t));
    const spread = !selfMv && targets.length > 1;
    let anyHit = false, dealtTotal = 0;
    for (const t of targets) {
      if (!selfMv) {
        const thr = hitThreshold(mv, u, t);
        if (thr !== null && thr < 100) {
          const r = await roll(`${mv.name} → ${t.name}: hits on 1–${thr}`, [100]);
          if (r.total > thr) { blog(b, `${mv.name} missed ${t.name}. (rolled ${r.total}, needed ${thr} or less)`); continue; }
        }
      }
      anyHit = true;
      if (dealsDamage) {
        let dmg = 0, eff = effOf(mv.type, t.types), crit = false;
        if (fx?.fixed) { dmg = eff === 0 ? 0 : (fx.fixed === 'level' ? u.level : fx.fixed); lines.push(`${mv.name}: fixed damage ${dmg}`); }
        else {
          const hits = parseHits(mv.hits); let n = 1;
          if (Array.isArray(hits)) { const r = await roll(`${mv.name}: number of hits (D20: 1–7 = 2, 8–14 = 3, 15–17 = 4, 18–20 = 5)`, [20]); n = multiHitFromD20(r.total); }
          else n = hits || 1;
          const r = await roll(`${mv.name} → ${t.name}: damage roll`, [6, 12, 20]);
          const cs = Math.min(3, (u.stages.crit || 0) + (fx?.crit === 'always' ? 3 : (fx?.crit || 0)));
          crit = critFromD20(cs, r.values[2]);
          const res = calcDamage({ att: u, def: t, move: mv, roll: r.total, crit, spread });
          dmg = res.damage * n; eff = res.eff;
          lines.push(`→ ${t.name}:`, ...res.lines, ...(n > 1 ? [`${n} hits × ${res.damage} = ${dmg}`] : []));
        }
        const dealt = Math.min(t.hp, dmg); t.hp -= dealt; dealtTotal += dealt;
        blog(b, `${t.name} took ${dealt} damage${crit ? ' — critical hit!' : ''}${eff === 0 ? ' — it had no effect' : eff > 1 ? ' — super effective!' : eff < 1 ? ' — not very effective' : ''}.`);
        if (t.status === 'frz' && mv.type === 'Fire' && t.hp > 0) { t.status = null; blog(b, `${t.name} thawed out!`); }
        if (t.hp === 0 && !t.fainted) faint(b, t, u);
      }
      if (!notAuto && !t.fainted && t.id !== u.id && (fx.status || fx.target)) {
        let ok = true;
        if (fx.chance && fx.chance < 100) { const r = await roll(`${mv.name}: effect chance on ${t.name} (1–${fx.chance})`, [100]); ok = r.total <= fx.chance; if (!ok) blog(b, `No added effect. (rolled ${r.total})`); }
        if (ok && fx.status) {
          if (!canGetStatus(t, fx.status, mv)) blog(b, `${t.name} wasn't affected by ${STATUS_NAME[fx.status].toLowerCase()}.`);
          else {
            t.status = fx.status;
            if (fx.status === 'slp') { const r = await roll(`${t.name} falls asleep: D6 for turns (1–2 = 1, 3–4 = 2, 5–6 = 3)`, [6]); t.slp = sleepTurnsFromD6(r.total); }
            if (fx.status === 'tox') t.tox = 1;
            blog(b, `${t.name} is now ${STATUS_NAME[fx.status].toLowerCase()}${fx.status === 'slp' ? ` (${t.slp} turn${t.slp > 1 ? 's' : ''})` : ''}.`);
          }
        }
        if (ok && fx.target) blog(b, `${t.name}: ${applyStages(t, fx.target)}.`);
      }
    }
    if (!notAuto && anyHit && !u.fainted) {
      if (fx.user) { let ok = true; if (fx.userChance && fx.userChance < 100) { const r = await roll(`${mv.name}: chance for ${u.name}'s stat change (1–${fx.userChance})`, [100]); ok = r.total <= fx.userChance; } if (ok) blog(b, `${u.name}: ${applyStages(u, fx.user)}.`); }
      if (fx.drain && dealtTotal) { const h = Math.min(u.maxHp - u.hp, Math.max(1, Math.floor(dealtTotal * fx.drain / 100))); u.hp += h; blog(b, `${u.name} drained ${h} HP.`); }
      if (fx.heal) { const h = Math.min(u.maxHp - u.hp, Math.max(1, Math.floor(u.maxHp * fx.heal / 100))); u.hp += h; blog(b, `${u.name} recovered ${h} HP.`); }
      if (fx.recoil && dealtTotal) { const r = Math.min(u.hp, Math.max(1, Math.floor(dealtTotal * fx.recoil / 100))); u.hp -= r; blog(b, `${u.name} took ${r} recoil damage.`); if (u.hp === 0) faint(b, u, null); }
    }
    if (fx?.auto === 'partial') blog(b, `Not automated: ${fx.why} — apply by hand if it happens.`);
    if (notAuto) blog(b, `Rest of ${mv.name} isn't automated (${fx?.why || 'custom rule'}) — apply by hand.`);
  } catch (e) { if (e.message === 'cancelled') return toast('Move cancelled — nothing was saved'); throw e; }
  b.last = { who: u.name, move: mv.name, lines };
  BUI = {};
  await DB.update(MISSION(cid, misNum), { battle: finishTurnSafe(b) }).catch(saveErr);
}

// DM: edit any Pokémon by hand (HP, status, stat stages, faint, move on the map)
function editUnitModal(ctx, id) {
  const { mis, cid, misNum } = ctx, b0 = mis.battle, u0 = b0.units[id];
  let st = { hp: u0.hp, status: u0.status, slp: u0.slp || 1, stages: { ...u0.stages } };
  openModal((card, close, redraw) => {
    card.innerHTML = `<div class="row">${monImg(u0.name, u0.shiny, 'spr sm')}<h2 style="margin:0">${esc(u0.name)}</h2></div>
      <label class="field"><span>HP (max ${u0.maxHp})</span><input type="number" id="eHp" min="0" max="${u0.maxHp}" value="${st.hp}"></label>
      <div><div class="muted" style="margin-bottom:6px">Status</div><div class="seg">${[['', 'None'], ...Object.entries(STATUS_SHORT)].map(([k, l]) => `<button aria-pressed="${(st.status || '') === k}" data-st="${k}">${l}</button>`).join('')}</div>
        ${st.status === 'slp' ? `<label class="field" style="margin-top:8px"><span>Sleep turns left</span><input type="number" id="eSlp" min="1" max="3" value="${st.slp}"></label>` : ''}</div>
      <div class="stagegrid">${STAGE_KEYS.map(k => `<div><span>${STAGE_LABEL[k]}</span><button class="icon-btn" data-sd="${k}" data-v="-1">−</button><b>${st.stages[k] > 0 ? '+' : ''}${st.stages[k]}</b><button class="icon-btn" data-sd="${k}" data-v="1">+</button></div>`).join('')}</div>
      <div class="row">${u0.out && !u0.fainted && !b0.noMap ? '<button class="btn small" data-mv>Move on map</button>' : ''}${!u0.fainted ? '<button class="btn small" data-faint>Faint now</button>' : ''}
        <div class="spacer"></div><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`;
    card.querySelectorAll('[data-st]').forEach(x => x.onclick = () => { st.hp = +card.querySelector('#eHp').value; st.status = x.dataset.st || null; redraw(); });
    card.querySelectorAll('[data-sd]').forEach(x => x.onclick = () => { st.hp = +card.querySelector('#eHp').value; const k = x.dataset.sd; st.stages[k] = Math.max(-6, Math.min(k === 'crit' ? 3 : 6, st.stages[k] + +x.dataset.v)); redraw(); });
    card.querySelector('[data-x]').onclick = close;
    card.querySelector('[data-mv]')?.addEventListener('click', () => { BUI.dmMove = id; close(); ctx.redraw(); });
    card.querySelector('[data-faint]')?.addEventListener('click', () => {
      const nb = clone(ctx.mis.battle); faint(nb, nb.units[id], null); close();
      DB.update(MISSION(cid, misNum), { battle: nb.turn?.id === id ? finishTurnSafe(nb) : nb }).catch(saveErr);
    });
    card.querySelector('[data-ok]').onclick = () => {
      const nb = clone(ctx.mis.battle), u = nb.units[id];
      u.hp = Math.max(0, Math.min(u.maxHp, parseInt(card.querySelector('#eHp').value) || 0));
      u.status = st.status; u.slp = st.status === 'slp' ? Math.max(1, parseInt(card.querySelector('#eSlp')?.value) || 1) : 0; if (st.status === 'tox' && !u.tox) u.tox = 1;
      u.stages = st.stages; blog(nb, `DM adjusted ${u.name}.`);
      if (u.hp === 0 && !u.fainted) faint(nb, u, null);
      close(); DB.update(MISSION(cid, misNum), { battle: nb }).catch(saveErr);
    };
  });
}

// ---- Finishing a mission: level up, EVs, evolution, re-roll tokens, new catches ----
async function finishMission(ctx) {
  const { c, mis, cid, misNum, teams } = ctx, b = mis.battle, N = misNum, L = N + 1;
  if (!confirm(`Finish Mission ${N}? Everyone's Pokémon go to level ${L}, catches join their teams, and players get their re-rolls and EVs.`)) return;
  const kosBy = {}; for (const k of b.kos || []) kosBy[k.by] = (kosBy[k.by] || 0) + 1;
  try {
    for (const p of c.players || []) {
      const team = (teams[p.id] || []).map(m => {
        if (m.step !== 'done') return m;
        const n = { ...m };
        if ((n.level || 1) < L) {
          const evNow = STAT_KEYS.reduce((a, k) => a + (n.evs?.[k] || 0), 0) + (n.evPending || 0);
          n.evPending = (n.evPending || 0) + Math.max(0, Math.min(10 * (L - n.level), 510 - evNow));
          n.level = L;
          const sp = formAtLevel(n.final, L);
          if (sp && sp !== n.species) { n.evolvedFrom = n.species; n.species = sp; n.ability = abilityBySlot(sp, n.abilitySlot) || n.ability; } else delete n.evolvedFrom;
        }
        const k = kosBy['p_' + m.uid] || 0;
        n.rerolls = k ? { mission: N, left: k } : null; n.reroll = null;
        return n;
      });
      for (const ct of (b.catches || []).filter(x => x.pid === p.id)) {
        const key = `${N}:${ct.final}`; if (team.some(m => m.catchKey === key)) continue;
        team.push({ uid: 'm' + Date.now().toString(36) + randInt(1e6).toString(36), final: ct.final, finalName: getLine(ct.final)?.name || ct.species, species: formAtLevel(ct.final, L) || ct.species,
          pickType: null, level: L, shiny: false, evs: Object.fromEntries(STAT_KEYS.map(k => [k, 0])), evPending: Math.min(510, 10 * L),
          ivs: null, ivRolls: null, nature: null, natureRolls: null, ability: null, abilitySlot: null, abilityRolls: null, moves: [], step: 'ivs', setupMode: 'catch', catchKey: key });
      }
      await DB.set(PLAYER(cid, p.id), { team });
    }
    const caught = (b.catches || []).map(x => x.final);
    await DB.update(CAMP(cid), { takenFinals: [...new Set([...(c.takenFinals || []), ...caught])] });
    await DB.update(MISSION(cid, N), { phase: 'after' });
    toast(`Mission ${N} complete!`);
  } catch (e) { saveErr(e); }
}
const abilityBySlot = (species, slot) => { const p = getPokemon(species); if (!p) return null; return slot === 'H' ? (p.hidden || p.abilities?.[0]) : slot === '2' ? (p.abilities?.[1] || p.abilities?.[0]) : p.abilities?.[0]; };

// ---- Player: after the mission (re-rolls, EVs, moves, catches) ----
function afterMissionPlayer(el, ctx) {
  const { cid, misNum, pid, team, c } = ctx;
  const N = misNum, mode = c.settings?.dice || 'physical';
  const saveMon = async (uid, patch) => {   // always merge into the latest saved team, not this screen's copy
    try { const d = await once(PLAYER(cid, pid)); await DB.set(PLAYER(cid, pid), { team: (d?.team || team).map(m => m.uid === uid ? { ...m, ...patch } : m) }); }
    catch (e) { saveErr(e); }
  };
  const newCatches = team.filter(m => m.setupMode === 'catch' && m.step !== 'done');
  el.innerHTML = `<div class="card stack"><h2 style="margin:0">After Mission ${N}</h2>
    ${newCatches.length ? `<div class="stack" style="--gap:6px"><b>New catches — set them up:</b>${newCatches.map(m => `<div class="row">${monImg(m.species, m.shiny, 'spr sm')}<b>${esc(m.species)}</b><div class="spacer"></div><button class="btn primary small" onclick="go('#/c/${cid}/p/${pid}/setup/${m.uid}')">Set up · ${STEP_NAMES[m.step] || ''}</button></div>`).join('')}</div>` : ''}
    ${team.filter(m => m.step === 'done').map(m => `<div class="moncard">${monImg(m.species, m.shiny)}<div class="stack" style="flex:1;--gap:6px">
      <div><b>${esc(m.species)}</b> <span class="muted">Lv ${m.level}</span>${m.evolvedFrom ? ` <span class="pill up">Evolved from ${esc(m.evolvedFrom)}!</span>` : ''}</div>
      <div class="row" style="gap:8px">
        ${m.rerolls?.mission === N && (m.rerolls.left > 0 || m.reroll) ? `<button class="btn small primary" data-rr="${m.uid}">🎲 Re-roll${m.reroll ? ' (result waiting)' : ` (${m.rerolls.left} left)`}</button>` : ''}
        ${m.evPending ? `<button class="btn small primary" data-ev="${m.uid}">Place ${m.evPending} EVs</button>` : ''}
        <button class="btn small" data-mvs="${m.uid}">Moves</button></div></div></div>`).join('')}
    <div class="muted" style="font-size:.9rem">The DM starts the next mission when everyone's ready.</div></div>`;
  el.querySelectorAll('[data-rr]').forEach(x => x.onclick = () => rerollModal(team.find(m => m.uid === x.dataset.rr), saveMon, mode, N));
  el.querySelectorAll('[data-ev]').forEach(x => x.onclick = () => evModal(team.find(m => m.uid === x.dataset.ev), saveMon));
  el.querySelectorAll('[data-mvs]').forEach(x => x.onclick = () => movesModal(team.find(m => m.uid === x.dataset.mvs), saveMon));
}
// One re-roll per KO: pick IV, Nature, Ability or Shiny; roll; then keep it or throw it away.
function rerollModal(m, saveMon, mode, N) {
  openModal((card, close) => {
    const rr = m.reroll, p = getPokemon(m.species);
    if (!rr) {
      card.innerHTML = `<h2 style="margin:0">Re-roll for ${esc(m.species)}</h2><div class="muted">${m.rerolls.left} left (one per KO). Pick what to roll for. You can keep the result or discard it.</div>
        <div class="optgrid">${[['iv', 'IV', 'D6+D12+D20 → put it on any stat'], ['nature', 'Nature', 'D100'], ['ability', 'Ability', 'D100'], ['shiny', 'Shiny', 'D6+D12+D20 total of 3']].map(([k, l, d]) => `<button class="opt" data-cat="${k}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
        <div class="row"><div class="spacer"></div><button class="btn ghost" data-x>Close</button></div>`;
      card.querySelector('[data-x]').onclick = close;
      card.querySelectorAll('[data-cat]').forEach(x => x.onclick = async () => {
        const cat = x.dataset.cat, dice = cat === 'nature' || cat === 'ability' ? [100] : [6, 12, 20];
        const r = await rollDice({ title: `${m.species}: ${cat === 'iv' ? 'IV' : cat} re-roll`, dice, mode });
        if (!r) return;
        m = { ...m, reroll: { cat, total: r.total }, rerolls: { ...m.rerolls, left: m.rerolls.left - 1 } };
        await saveMon(m.uid, { reroll: m.reroll, rerolls: m.rerolls }); close(); rerollModal(m, saveMon, mode, N);
      });
      return;
    }
    const clear = async patch => { await saveMon(m.uid, { ...patch, reroll: null }); close(); };
    let body = '', choices = '';
    if (rr.cat === 'iv') {
      const iv = Math.min(31, rr.total);
      body = `Rolled <b>${rr.total}</b> → IV <b>${iv}</b>. Put it on a stat, or discard it.`;
      choices = `<div class="optgrid">${STAT_KEYS.map(k => `<button class="opt" data-iv="${k}"><b>${STAT_LABEL[k]}</b><small>now ${m.ivs[k]}${iv > m.ivs[k] ? ' ▲' : iv < m.ivs[k] ? ' ▼' : ''}</small></button>`).join('')}</div>`;
    } else if (rr.cat === 'nature') { const n = natureFromD100(rr.total); body = `Rolled <b>${rr.total}</b> → <b>${n}</b> (${natureTag(n)}). Current: ${esc(m.nature)} (${natureTag(m.nature)}).`; choices = `<button class="btn primary" data-keep>Switch to ${n}</button>`; }
    else if (rr.cat === 'ability') { const a = abilityFromD100(p, rr.total); body = `Rolled <b>${rr.total}</b> → <b>${esc(a.name)}</b>${a.slot === 'H' ? ' (hidden)' : ''}. Current: ${esc(m.ability)}.<div class="muted" style="font-size:.9rem">${esc(getAbility(a.name)?.effect || '')}</div>`; choices = `<button class="btn primary" data-keep>Switch to ${esc(a.name)}</button>`; }
    else { const hit = rr.total === 3; body = hit ? `Rolled <b>3</b> — <b>it's shiny!</b> ★` : `Rolled <b>${rr.total}</b>. Not shiny (needs a total of 3).`; choices = hit ? `<button class="btn primary" data-keep>Make it shiny ★</button>` : ''; }
    card.innerHTML = `<h2 style="margin:0">${esc(m.species)}: re-roll result</h2><div>${body}</div>${choices}<div class="row"><div class="spacer"></div><button class="btn ghost" data-discard>${rr.cat === 'shiny' && rr.total !== 3 ? 'OK' : 'Discard'}</button></div>`;
    card.querySelectorAll('[data-iv]').forEach(x => x.onclick = () => clear({ ivs: { ...m.ivs, [x.dataset.iv]: Math.min(31, rr.total) } }));
    card.querySelector('[data-keep]')?.addEventListener('click', () => {
      if (rr.cat === 'nature') clear({ nature: natureFromD100(rr.total) });
      else if (rr.cat === 'ability') { const a = abilityFromD100(p, rr.total); clear({ ability: a.name, abilitySlot: a.slot }); }
      else clear({ shiny: true });
    });
    card.querySelector('[data-discard]').onclick = () => clear({});
  });
}
// Place this level's EVs: any split, at most 252 per stat and 510 in total.
function evModal(m, saveMon) {
  const add = Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
  const p = getPokemon(m.species);
  openModal((card, close, redraw) => {
    const used = STAT_KEYS.reduce((a, k) => a + add[k], 0), left = m.evPending - used;
    const total = k => (m.evs?.[k] || 0) + add[k];
    card.innerHTML = `<h2 style="margin:0">Place EVs: ${esc(m.species)}</h2><div class="muted"><b>${left}</b> of ${m.evPending} left. Max 252 per stat, 510 total.</div>
      <table class="stats"><thead><tr><th></th><th>EVs</th><th>Add</th><th></th><th>Stat (Lv ${m.level})</th></tr></thead><tbody>${STAT_KEYS.map(k => `<tr><th>${STAT_LABEL[k]}</th><td>${total(k)}</td>
        <td><button class="icon-btn" data-d="${k}" data-v="-10">−</button> <b>${add[k]}</b> <button class="icon-btn" data-d="${k}" data-v="10">+</button></td>
        <td><button class="btn small ghost" data-d="${k}" data-v="1">+1</button></td><td>${calcStat(k, p.stats[k], m.ivs[k], total(k), m.level, m.nature)}</td></tr>`).join('')}</tbody></table>
      <div class="row"><button class="btn ghost" data-x>Cancel</button><div class="spacer"></div><button class="btn primary" data-ok ${used ? '' : 'disabled'}>Save</button></div>`;
    card.querySelectorAll('[data-d]').forEach(x => x.onclick = () => {
      const k = x.dataset.d, v = +x.dataset.v;
      const room = Math.min(left, 252 - total(k)), next = v > 0 ? add[k] + Math.min(v, room) : Math.max(0, add[k] + v);
      add[k] = next; redraw();
    });
    card.querySelector('[data-x]').onclick = close;
    card.querySelector('[data-ok]').onclick = () => { saveMon(m.uid, { evs: Object.fromEntries(STAT_KEYS.map(k => [k, total(k)])), evPending: left }); close(); };
  });
}
function movesModal(m, saveMon) {
  const all = knowableMoves(m.species, m.level);
  let pick = [...(m.moves || [])];
  openModal((card, close, redraw) => {
    card.innerHTML = `<h2 style="margin:0">${esc(m.species)}'s moves</h2><div class="muted">Any 4 of the level-up moves it knows at level ${m.level}.</div>
      <div class="stack" style="max-height:55vh;overflow:auto">${all.map(mv => `<button class="opt wide ${pick.includes(mv) ? 'on' : ''}" data-m="${esc(mv)}">${moveCardHTML(mv)}</button>`).join('')}</div>
      <div class="row"><span class="muted">${pick.length}/4</span><div class="spacer"></div><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok ${pick.length ? '' : 'disabled'}>Save</button></div>`;
    card.querySelectorAll('[data-m]').forEach(x => x.onclick = () => { const mv = x.dataset.m; if (pick.includes(mv)) pick = pick.filter(y => y !== mv); else if (pick.length < 4) pick.push(mv); else return toast('4 moves max'); redraw(); });
    card.querySelector('[data-x]').onclick = close;
    card.querySelector('[data-ok]').onclick = () => { saveMon(m.uid, { moves: pick }); close(); };
  });
}

// ---- Router: the part of the address after # decides the screen ----
function route() {
  unwatch?.(); unwatch = null; BUI = {};
  window.scrollTo(0, 0);
  const h = location.hash || '#/';
  let m;
  if (h === '#/' || h === '#') return screenHome();
  if (h === '#/new') return screenNew();
  if ((m = h.match(/^#\/c\/([^/]+)$/))) return screenWho(m[1], false);
  if ((m = h.match(/^#\/c\/([^/]+)\/who$/))) { localStorage.removeItem(myIdKey(m[1])); return screenWho(m[1], true); }
  if ((m = h.match(/^#\/c\/([^/]+)\/dm$/))) return screenDM(m[1]);
  if ((m = h.match(/^#\/c\/([^/]+)\/dm\/map$/))) return screenMapSetup(m[1]);
  if ((m = h.match(/^#\/c\/([^/]+)\/p\/([^/]+)$/))) return screenPlayer(m[1], m[2]);
  if ((m = h.match(/^#\/c\/([^/]+)\/p\/([^/]+)\/setup\/([^/]+)$/))) return screenSetup(m[1], m[2], m[3]);
  screenHome();
}

// ---- Settings (saved on this device only) ----
const THEMES = [['auto', 'Match device'], ['light', 'Light'], ['dark', 'Dark']];
const SIZES = [['15', 'Small'], ['17', 'Medium'], ['19', 'Large'], ['22', 'Extra large']];
function applyPrefs() {
  const t = localStorage.getItem('pt-theme') || 'auto', s = localStorage.getItem('pt-size') || '17';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.documentElement.style.setProperty('--text', s + 'px');
  const segs = [['themeSeg', THEMES, t, 'pt-theme'], ['sizeSeg', SIZES, s, 'pt-size']];
  for (const [id, opts, cur, key] of segs) {
    const el = document.getElementById(id);
    el.innerHTML = opts.map(([v, l]) => `<button aria-pressed="${v === cur}" data-v="${v}">${l}</button>`).join('');
    el.querySelectorAll('button').forEach(b => b.onclick = () => { localStorage.setItem(key, b.dataset.v); applyPrefs(); });
  }
}
window.openSettings = () => document.getElementById('settings').classList.add('open');
window.closeSettings = () => document.getElementById('settings').classList.remove('open');

// ═══ 6. HEX GRID ═══════════════════════════════════════════════════════
// Hexes use "axial" coordinates (q, r) and are saved as text keys like "3,-1".
const hk = ([q, r]) => q + ',' + r;
const hexDist = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r));
const offsetToAxial = (col, row) => [col - (row - (row & 1)) / 2, row];
function hexShape(shape, p) {
  const out = [];
  if (shape === 'rectangle' || shape === 'corridor' || shape === 'custom') {
    for (let row = 0; row < p.h; row++) for (let col = 0; col < p.w; col++) out.push(offsetToAxial(col, row));
  } else if (shape === 'hexagon' || shape === 'ring') {
    const R = p.r, hole = shape === 'ring' ? Math.min(p.hole, R) : 0;
    for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) { const d = hexDist(q, r); if (d <= R && d >= hole) out.push([q, r]); }
  } else if (shape === 'diamond') {
    for (let r = 0; r < p.h; r++) for (let q = 0; q < p.w; q++) out.push([q, r]);
  } else if (shape === 'cross') {
    const n = 2 * p.arm + p.aw;
    for (let row = 0; row < n; row++) for (let col = 0; col < n; col++)
      if ((col >= p.arm && col < p.arm + p.aw) || (row >= p.arm && row < p.arm + p.aw)) out.push(offsetToAxial(col, row));
  }
  return out;
}
// Draws a map into an <svg>. o = { cells, ghosts, blocked, starts, symbols{typeId:key},
// tokens{playerId:key}, players, colorOf, selected, mine, reach (Set of hexes to light up), wilds, units[{key,img,ring,hp,mine}] }. onTap(key) runs when a hex is tapped.
function renderBoard(svg, o, onTap) {
  const S = 10, W = Math.sqrt(3) * S;
  const xy = key => { const [q, r] = key.split(',').map(Number); return [W * (q + r / 2), 1.5 * S * r]; };
  const corner = (s, i) => { const a = Math.PI / 180 * (60 * i - 30); return [s * Math.cos(a), s * Math.sin(a)]; };
  const poly = (x, y, s) => [0, 1, 2, 3, 4, 5].map(i => corner(s, i)).map(([a, b]) => (x + a).toFixed(2) + ',' + (y + b).toFixed(2)).join(' ');
  const all = [...(o.cells || []), ...(o.ghosts || [])];
  if (!all.length) { svg.innerHTML = ''; return; }
  const pts = all.map(xy), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs) - W, minY = Math.min(...ys) - S * 1.3;
  const vw = Math.max(...xs) - minX + W, vh = Math.max(...ys) - minY + S * 1.3;
  svg.setAttribute('viewBox', `${minX} ${minY} ${vw} ${vh}`);
  svg.style.aspectRatio = `${vw} / ${vh}`;   // the box takes the map's own proportions (no empty bands)
  const blocked = new Set(o.blocked || []), starts = new Set(o.starts || []), wilds = new Set(o.wilds || []);
  let h = `<defs><clipPath id="tclip"><circle cx="22" cy="22" r="21"/></clipPath></defs>`;
  for (const k of o.ghosts || []) { const [x, y] = xy(k); h += `<g data-k="${k}"><polygon class="cell ghost" points="${poly(x, y, S * .96)}"/></g>`; }
  for (const k of o.cells || []) { const [x, y] = xy(k); h += `<g data-k="${k}"><polygon class="cell${blocked.has(k) ? ' blocked' : o.reach?.has(k) ? ' reach' : starts.has(k) ? ' start' : wilds.has(k) ? ' wild' : ''}" points="${poly(x, y, S * .96)}"/></g>`; }
  for (const [t, k] of Object.entries(o.symbols || {})) {   // type icons: the left (symbol) part of PokeAPI's label art, clipped round
    const [x, y] = xy(k), d = S * 1.35;
    h += `<svg class="sym" x="${x - d / 2}" y="${y - d / 2}" width="${d}" height="${d}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" class="symbg"/><image href="${typeIconUrl(t)}" width="200" height="44" clip-path="url(#tclip)"/></svg>`;
  }
  const inits = initialsOf(o.players || []);
  for (const [pid, k] of Object.entries(o.tokens || {})) {
    if (!k || !(o.players || []).some(p => p.id === pid)) continue;
    const [x, y] = xy(k), two = inits[pid].length > 1;
    h += `<g class="tok${pid === o.mine ? ' mine' : ''}"><polygon points="${poly(x, y, S * .9)}" fill="${o.colorOf(pid)}"/><text x="${x}" y="${y + .3}" style="font-size:${two ? 6.5 : 9}px">${esc(inits[pid])}</text></g>`;
  }
  for (const u of o.units || []) {   // battle tokens: the Pokémon's picture, a ring in its trainer's color, and an HP bar
    if (!u.key || u.key === 'table') continue;
    const [x, y] = xy(u.key), w = S * 1.5;
    h += `<g class="unit${u.mine ? ' mine' : ''}"><polygon points="${poly(x, y, S * .9)}" class="ubg" style="stroke:${u.ring}"/>${u.img ? `<image href="${u.img}" x="${x - w / 2}" y="${y - w / 2 - 1}" width="${w}" height="${w}"/>` : ''}
      <rect x="${x - 6}" y="${y + 5.6}" width="12" height="1.8" rx=".9" class="hpbg"/><rect x="${x - 6}" y="${y + 5.6}" width="${(12 * Math.max(0, u.hp)).toFixed(2)}" height="1.8" rx=".9" fill="${u.hp > .5 ? 'var(--ok)' : u.hp > .2 ? '#e0a400' : 'var(--bad)'}"/></g>`;
  }
  if (o.selected) { const [x, y] = xy(o.selected); h += `<polygon class="sel" points="${poly(x, y, S * 1.02)}"/>`; }
  svg.innerHTML = h;
  svg.onclick = onTap ? e => { const g = e.target.closest('[data-k]'); if (g) onTap(g.dataset.k); } : null;
  svg.classList.toggle('tappable', !!onTap);
}

// ═══ 7. START-UP ═══════════════════════════════════════════════════════
applyPrefs();

    return;
  }
  route();
})();
