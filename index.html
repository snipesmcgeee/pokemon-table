    app.innerHTML = `
      <div class="row" style="margin-bottom:6px"><div class="muted">${esc(c.name)} · DM ${esc(c.dm?.name)}</div><div class="spacer"></div>
        <button class="btn small ghost" onclick="go('#/c/${cid}/who')">Switch person</button></div>
      <div class="stack">
        <div class="card">
          <div class="mission-head">
            <div><div class="muted" style="font-weight:600">Mission</div><div class="mission-num">${m}</div></div>
            <div class="spacer"></div>
            <button class="btn" id="prev" ${m <= 0 ? 'disabled' : ''}>◀ Previous</button>
            <button class="btn primary" id="next" ${m >= 100 ? 'disabled' : ''}>Next mission ▶</button>
          </div>
        </div>
        <details class="card" id="storyBox" ${(storyOpen ?? mis?.phase !== 'battle') ? 'open' : ''}><summary><h2 style="display:inline">Story</h2></summary><div class="story" style="margin-top:12px">${storyHTML(m)}</div></details>
        <div id="mapArea"></div>
        <div id="starterArea"></div>
        <div class="grid">
          <div class="card"><h2>Players</h2>${(c.players || []).map(p => `<div class="row" style="margin-bottom:6px"><span class="sw" style="background:${colorOf(c, p.id)}">${esc(inits[p.id])}</span>${esc(p.name)} <span class="muted">· ${(teams[p.id] || []).length} Pokémon</span></div>`).join('')}</div>
          <div class="card stack"><h2 style="margin:0">Settings</h2>
            <div><div class="muted" style="margin-bottom:6px">Map</div>${seg(Object.entries(MAPMODES), c.settings?.mapMode, 'map')}</div>
            <div><div class="muted" style="margin-bottom:6px">Dice</div>${seg(Object.entries(DICE), c.settings?.dice, 'dice')}</div>
            <div><div class="muted" style="margin-bottom:6px">Wild turns</div>${seg(Object.entries(WILD_AI), c.settings?.wildAI || 'off', 'wai')}<div class="muted" style="font-size:.8rem;margin-top:4px">Suggest: the app proposes each wild turn and you tap Accept. On: the app plays them.</div></div></div>
          <div class="card"><h2>By hand for now</h2><div class="muted">Abilities, and moves tagged "Not automated", are applied by the DM (tap a Pokémon in battle to edit it).</div></div>
        </div>
        <div class="row"><div class="spacer"></div>
          <button class="btn small" id="arch">${c.archived ? 'Restore campaign' : 'Archive campaign'}</button></div>
      </div>`;
    const setM = n => DB.update(CAMP(cid), { mission: n }).catch(saveErr);
    document.getElementById('prev').onclick = () => setM(m - 1);
    document.getElementById('next').onclick = () => {   // warn if anyone still has things to do (nothing is lost: it all carries over)
      const open = (c.players || []).map(p => [p.name, todoFor(teams[p.id] || [])]).filter(([, t]) => t.length);
      const midBattle = mis?.phase === 'battle' && !mis.battle?.over;
      if ((open.length || midBattle) && !confirm(`${midBattle ? `Mission ${m}'s battle isn't finished.\n\n` : ''}${open.length ? `Not everyone is done:\n${open.map(([n, t]) => `• ${n}: ${t.join(', ')}`).join('\n')}\n\nRe-rolls, EVs and catch setups carry over, so nothing is lost.\n\n` : ''}Go to Mission ${m + 1} anyway?`)) return;
      setM(m + 1);
    };
    document.getElementById('storyBox').ontoggle = e => { storyOpen = e.target.open; };
    app.querySelectorAll('[data-map]').forEach(b => b.onclick = () => DB.update(CAMP(cid), { 'settings.mapMode': b.dataset.map }).catch(saveErr));
    app.querySelectorAll('[data-dice]').forEach(b => b.onclick = () => DB.update(CAMP(cid), { 'settings.dice': b.dataset.dice }).catch(saveErr));
    app.querySelectorAll('[data-wai]').forEach(b => b.onclick = () => DB.update(CAMP(cid), { 'settings.wildAI': b.dataset.wai }).catch(saveErr));
    document.getElementById('arch').onclick = async () => {
      if (!c.archived && !confirm(`Archive "${c.name}"? It will be hidden from the campaign list (you can restore it).`)) return;
      await DB.update(CAMP(cid), { archived: !c.archived }).catch(saveErr); toast(c.archived ? 'Restored' : 'Archived');
    };
    drawMapArea(); drawStarters();
  };
  const campUnwatch = DB.watchDoc(CAMP(cid), camp => {
    c = camp;
    if (c && (c.mission ?? 0) !== misNum) {        // mission changed: follow the new mission's map
      misUnwatch?.(); misNum = c.mission ?? 0; mis = undefined; sel = null;
      misUnwatch = DB.watchDoc(MISSION(cid, misNum), d => { mis = d; drawMapArea(); drawStarters(); });
    }
    draw();
  });
  unwatch = stopAll;
}

// ---- Map setup: pick from the library, edit a copy, or build a new one ----
function screenMapSetup(cid) {
  let c = null, view = 'library', ed = null, libUnwatch = null;
  unwatch = () => libUnwatch?.();
  const m = () => c.mission ?? 0;
  const freshEditor = (src) => {
    const shape = src?.shape || 'rectangle';
    const params = {};
    for (const [k, s] of Object.entries(SHAPES)) params[k] = Object.fromEntries(s.fields.map(f => [f[0], f[2]]));
    if (src?.params) params[shape] = { ...params[shape], ...src.params };
    ed = {
      fromId: src?.id || null, fromName: src?.name || '', name: src?.name || `Mission ${m()} map`, shape, params,
      cells: new Set(src?.cells || hexShape(shape, params[shape]).map(hk)),
      blocked: new Set(src?.blocked || []), starts: new Set(src?.starts || []), wilds: new Set(src?.wilds || []),
      symbols: { ...(src?.symbols || {}) }, useSymbols: src ? Object.keys(src.symbols || {}).length > 0 : m() === 0,
      tool: 'block', pick: null, dirty: !src
    };
    if (!src && ed.useSymbols) scatter();
  };
  const scatter = () => {
    const free = [...ed.cells].filter(k => !ed.blocked.has(k) && !ed.starts.has(k) && !ed.wilds.has(k));
    for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
    ed.symbols = {};
    TYPES.forEach((_, i) => { if (free[i]) ed.symbols[i + 1] = free[i]; });
    if (free.length < TYPES.length) toast(`Only room for ${free.length} of 18 type symbols`);
  };
  const symAt = key => Object.entries(ed.symbols).find(([, k]) => k === key)?.[0];
  const draw = () => {
    if (!c) { app.innerHTML = `<div class="card empty">Campaign not found. <a href="#/">Back</a></div>`; return; }
    app.innerHTML = `
      <div class="row" style="margin-bottom:6px"><div class="muted">${esc(c.name)} · Mission ${m()}</div><div class="spacer"></div>
        <button class="btn small ghost" onclick="go('#/c/${cid}/dm')">Back to DM screen</button></div>
      <h1>Map for Mission ${m()}</h1>
      <div class="seg" style="margin:14px 0 18px" id="viewSeg">
        <button aria-pressed="${view === 'library'}" data-v="library">Saved maps</button>
        <button aria-pressed="${view === 'editor'}" data-v="editor">${ed ? (ed.fromId ? 'Editing: ' + esc(ed.fromName) : 'New map') : '＋ New map'}</button>
      </div>
      <div id="body"></div>`;
    app.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { view = b.dataset.v; if (view === 'editor' && !ed) freshEditor(null); draw(); });
    view === 'library' ? drawLibrary() : drawEditor();
  };
  const drawLibrary = () => {
    const body = document.getElementById('body');
    body.innerHTML = `<div class="muted">Loading…</div>`;
    libUnwatch?.();
    libUnwatch = DB.watchCol('maps', maps => {
      if (view !== 'library' || !document.getElementById('body')) return;
      maps.sort((a, b) => millis(b.createdAt) - millis(a.createdAt));
      body.innerHTML = maps.length ? `<div class="muted" style="margin-bottom:12px">Maps saved from any campaign. Tap one to use or edit it — the mission gets its own copy.</div><div class="grid" id="lib">${maps.map(mp => `
        <div class="card camp" data-id="${mp.id}">
          <svg class="board mini" data-prev="${mp.id}"></svg>
          <div class="row" style="margin-top:10px"><h3 style="margin:0">${esc(mp.name)}</h3><div class="spacer"></div>
            <button class="icon-btn" title="Delete from library" data-del="${mp.id}">🗑</button></div>
          <div class="muted" style="font-size:.9rem">${SHAPES[mp.shape]?.label || ''} · ${(mp.cells || []).length} hexes${(mp.wilds || []).length ? ' · wild zones' : ''}${Object.keys(mp.symbols || {}).length ? ' · type symbols' : ''}</div>
          ${mp.lastUsed ? `<div class="muted" style="font-size:.85rem">Last used: ${esc(mp.lastUsed)}</div>` : ''}
        </div>`).join('')}</div>`
        : `<div class="card empty">No saved maps yet. Tap <b>＋ New map</b> to build the first one.</div>`;
      maps.forEach(mp => { const s = body.querySelector(`[data-prev="${mp.id}"]`); s && renderBoard(s, { cells: mp.cells || [], blocked: mp.blocked, starts: mp.starts, wilds: mp.wilds, symbols: mp.symbols }); });
      body.querySelectorAll('[data-id]').forEach(card => card.onclick = e => {
        const mp = maps.find(x => x.id === card.dataset.id);
        if (e.target.closest('[data-del]')) {
          if (confirm(`Delete "${mp.name}" from the library? Missions already using it keep their copy.`)) DB.remove('maps/' + mp.id).catch(saveErr);
          return;
        }
        libUnwatch?.(); libUnwatch = null;
        freshEditor(mp); view = 'editor'; draw();
      });
    });
  };
  const drawEditor = () => {
    libUnwatch?.(); libUnwatch = null;
    const body = document.getElementById('body');
    const sh = SHAPES[ed.shape], p = ed.params[ed.shape];
    const tools = [['block', 'Blocked'], ['start', 'Start zone'], ['wild', 'Wild zone'], ['hex', 'Add / remove hex'], ...(ed.useSymbols ? [['symbol', 'Move type symbol']] : [])];
    const hints = { block: 'Tap hexes to block or unblock them.', start: 'Tap hexes to mark where players start.', wild: 'Tap hexes to mark where wild Pokémon start (they fill these first; the DM can still place anywhere).', hex: 'Tap a hex to remove it; tap a dashed hex to add it back.', symbol: ed.pick ? 'Now tap an empty hex to move it there.' : 'Tap a type symbol, then tap where it should go.' };
    body.innerHTML = `<div class="stack">
      <div class="card stack">
        <div class="row"><h2 style="margin:0">Shape &amp; size</h2><div class="spacer"></div><span class="muted">${ed.cells.size} hexes</span></div>
        <div class="seg" id="shapeSeg">${Object.entries(SHAPES).map(([k, s]) => `<button aria-pressed="${k === ed.shape}" data-v="${k}">${s.label}</button>`).join('')}</div>
        <div class="two">${sh.fields.map(([k, l]) => `<label class="field"><span>${l}</span><input type="number" min="1" max="40" data-k="${k}" value="${p[k]}"></label>`).join('')}</div>
        <div class="muted" style="font-size:.9rem">Changing the shape or size starts the hexes over.</div>
      </div>
      <div class="card stack">
        <div class="seg" id="toolSeg">${tools.map(([k, l]) => `<button aria-pressed="${k === ed.tool}" data-v="${k}">${l}</button>`).join('')}</div>
        <div class="muted">${hints[ed.tool]}</div>
        <svg class="board" id="edBoard"></svg>
        <div class="row">
          <label class="row" style="cursor:pointer"><input type="checkbox" id="useSym" ${ed.useSymbols ? 'checked' : ''}> Type symbols (starter chase)</label>
          <div class="spacer"></div>
          ${ed.useSymbols ? `<button class="btn small" id="rescatter">🎲 Scatter again</button>` : ''}
        </div>
        <div class="legend muted"><span><i class="lg start"></i>Start zone</span><span><i class="lg wild"></i>Wild zone</span><span><i class="lg blocked"></i>Blocked</span><span><i class="lg ghost"></i>Removed</span></div>
      </div>
      <div class="card stack">
        <label class="field"><span>Map name</span><input type="text" id="mapName" maxlength="40" value="${esc(ed.name)}"></label>
        <div class="row"><button class="btn ghost" onclick="go('#/c/${cid}/dm')">Cancel</button><div class="spacer"></div>
          ${ed.fromId && ed.dirty ? `<button class="btn" id="saveNew">Save as new map &amp; use</button><button class="btn primary" id="saveUpd">Update “${esc(ed.fromName)}” &amp; use</button>`
            : ed.fromId ? `<button class="btn primary" id="useAsIs">Use for Mission ${m()}</button>`
            : `<button class="btn primary" id="saveNew">Save to library &amp; use</button>`}
        </div>
      </div></div>`;
    const changed = () => {   // first edit of a saved map: redraw so the "update / save as new" buttons appear
      ed.dirty = true; drawEditor();
      const i = document.getElementById('mapName'); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
    };
    const ghosts = hexShape(ed.shape, p).map(hk).filter(k => !ed.cells.has(k));
    renderBoard(document.getElementById('edBoard'), {
      cells: [...ed.cells], ghosts, blocked: [...ed.blocked], starts: [...ed.starts], wilds: [...ed.wilds],
      symbols: ed.useSymbols ? ed.symbols : {}, selected: ed.pick ? ed.symbols[ed.pick] : null
    }, key => {
      const sym = symAt(key);
      if (ed.tool === 'hex') {
        if (ed.cells.has(key)) {
          ed.cells.delete(key); ed.blocked.delete(key); ed.starts.delete(key); ed.wilds.delete(key);
          if (sym) {   // the symbol hops to a random open hex so all 18 types stay on the map
            const taken = new Set(Object.values(ed.symbols));
            const open = [...ed.cells].filter(k => !ed.blocked.has(k) && !ed.starts.has(k) && !ed.wilds.has(k) && !taken.has(k));
            if (open.length) ed.symbols[sym] = open[Math.floor(Math.random() * open.length)]; else delete ed.symbols[sym];
          }
        }
        else ed.cells.add(key);
      } else if (ed.tool === 'block' || ed.tool === 'start' || ed.tool === 'wild') {
        if (!ed.cells.has(key)) return;
        if (sym && ed.useSymbols) return toast('Move the type symbol off this hex first');
        const zones = { block: ed.blocked, start: ed.starts, wild: ed.wilds }, set = zones[ed.tool];
        if (set.has(key)) set.delete(key); else { Object.values(zones).forEach(z => z.delete(key)); set.add(key); }   // a hex is one kind of zone at a time
      } else if (ed.tool === 'symbol') {
        if (sym) { ed.pick = ed.pick === sym ? null : sym; }
        else if (ed.pick) {
          if (!ed.cells.has(key) || ed.blocked.has(key) || ed.starts.has(key) || ed.wilds.has(key)) return toast('Pick an open hex');
          ed.symbols[ed.pick] = key; ed.pick = null;
        } else return;
      }
      ed.dirty = true; drawEditor();
    });
    body.querySelectorAll('#shapeSeg button').forEach(b => b.onclick = () => { ed.shape = b.dataset.v; resetHexes(); });
    body.querySelectorAll('[data-k]').forEach(inp => inp.onchange = () => { const v = Math.max(1, Math.min(40, parseInt(inp.value) || 1)); if (v === p[inp.dataset.k]) return; p[inp.dataset.k] = v; resetHexes(); });
    body.querySelectorAll('#toolSeg button').forEach(b => b.onclick = () => { ed.tool = b.dataset.v; ed.pick = null; drawEditor(); });
    document.getElementById('useSym').onchange = e => { ed.useSymbols = e.target.checked; if (ed.useSymbols && !Object.keys(ed.symbols).length) scatter(); if (!ed.useSymbols && ed.tool === 'symbol') ed.tool = 'block'; ed.dirty = true; drawEditor(); };
    document.getElementById('rescatter')?.addEventListener('click', () => { scatter(); ed.dirty = true; drawEditor(); });
    document.getElementById('mapName').oninput = e => { ed.name = e.target.value; if (ed.fromId && !ed.dirty) changed(); };
    document.getElementById('saveNew')?.addEventListener('click', () => save('new'));
    document.getElementById('saveUpd')?.addEventListener('click', () => save('update'));
    document.getElementById('useAsIs')?.addEventListener('click', () => save('asis'));
  };
  const resetHexes = () => {
    ed.cells = new Set(hexShape(ed.shape, ed.params[ed.shape]).map(hk));
    ed.blocked.clear(); ed.starts.clear(); ed.wilds.clear(); ed.pick = null; ed.dirty = true;
    if (ed.useSymbols) scatter();
    drawEditor();
  };
  const save = async how => {
    const name = ed.name.trim();
    if (!name) return toast('Give the map a name');
    if (!ed.cells.size) return toast('The map has no hexes');
    const usedTag = `${c.name} · Mission ${m()}`;
    const map = {
      name, shape: ed.shape, params: ed.params[ed.shape], cells: [...ed.cells], blocked: [...ed.blocked],
      starts: [...ed.starts], wilds: [...ed.wilds], symbols: ed.useSymbols ? ed.symbols : {}, lastUsed: usedTag
    };
    app.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      let id = ed.fromId;
      if (how === 'new') id = await DB.add('maps', map);
      else if (how === 'update') await DB.update('maps/' + id, map);
      else await DB.update('maps/' + id, { lastUsed: usedTag });
      // Players start on the start-zone hexes (top to bottom, left to right) if there are enough.
      const order = [...ed.starts].map(k => k.split(',').map(Number)).sort((a, b) => a[1] - b[1] || (a[0] + a[1] / 2) - (b[0] + b[1] / 2)).map(([q, r]) => q + ',' + r);
      const tokens = {};
      (c.players || []).forEach((pl, i) => { if (order[i]) tokens[pl.id] = order[i]; });
      const prev = await once(MISSION(cid, m()));
      if (prev) await DB.update(MISSION(cid, m()), { mapId: id, ...map, tokens, found: {}, foundAt: {} });   // keep the mission's setup
      else await DB.set(MISSION(cid, m()), { mapId: id, ...map, tokens, found: {} });
      toast('Map ready for Mission ' + m());
      go(`#/c/${cid}/dm`);
    } catch (e) { saveErr(e); app.querySelectorAll('button').forEach(b => b.disabled = false); }
  };
  once(CAMP(cid)).then(async camp => {
    c = camp;
    const ms = c && await once(MISSION(cid, c.mission ?? 0));
    if (ms?.phase === 'battle') { app.innerHTML = `<div class="card empty">This mission's battle is under way. End the battle before changing its map. <a href="#/c/${cid}/dm">Back</a></div>`; return; }
    draw();
  });
}

// ---- Player home (phone) ----
function screenPlayer(cid, pid) {
  let c = null, mis, misNum = null, misUnwatch = null, team = [], picking = false;
  const teamUnwatch = DB.watchDoc(PLAYER(cid, pid), d => {
    team = d?.team || [];
    // Every Pokémon has 10 EVs per level (max 510). Top up any that are short (fixes teams made before this rule was wired in).
    const fixed = team.map(m => { const have = STAT_KEYS.reduce((a, k) => a + (m.evs?.[k] || 0), 0) + (m.evPending || 0), want = Math.min(510, 10 * (m.level || 1)); return have < want ? { ...m, evPending: (m.evPending || 0) + want - have } : m; });
    if (fixed.some((m, i) => m !== team[i])) { DB.set(PLAYER(cid, pid), { team: fixed }).catch(saveErr); return; }
    if (c) draw();
  });
  const saveMon = async (uid, patch) => {
    try { const d = await once(PLAYER(cid, pid)); await DB.set(PLAYER(cid, pid), { team: (d?.team || team).map(m => m.uid === uid ? { ...m, ...patch } : m) }); } catch (e) { saveErr(e); }
  };
  const draftCard = () => {   // Mission 0 starter picks, in claim order
    const d = mis?.draft; if (!d) return '';
    const cur = d.active ? d.order[d.turn] : null;
    let h = `<div class="card stack"><h2 style="margin:0">Starter picks</h2>${pickOrderHTML(c, d)}`;
    if (cur && cur.pid === pid) {
      const list = starterChoices(c, cur.tid);
      h += `<div class="yourturn"><div><b>Your pick!</b> Choose a ${TYPES[cur.tid - 1]} starter. It starts at level 1 and is always shiny.</div></div>
        <div class="pickgrid">${list.map(s => `<button class="pickcard" data-final="${s.final}">${monImg(s.startsAs, true)}<b>${esc(s.startsAs)}</b><small>→ ${esc(s.pick)}</small><small class="bst">Final BST <b>${getPokemon(s.pick)?.total ?? '?'}</b></small>
          <span class="types">${(getPokemon(s.startsAs)?.types || []).map(t => `<i class="tchip">${t}</i>`).join('')}</span></button>`).join('')}</div>`;
    } else if (cur) h += `<div class="muted">Waiting for <b>${esc(nameOf(c, cur.pid))}</b> to pick a ${TYPES[cur.tid - 1]} starter.</div>`;
    return h + '</div>';
  };
  const teamCard = () => {
    const draftOn = !!mis?.draft?.active;
    if (!team.length) return `<div class="card"><h2>Your team (0)</h2><div class="muted">${mis?.draft ? 'Your starters will appear here as you pick them.' : 'Claim two types in the chase; then you pick a starter from each.'}</div></div>`;
    const canEdit = !draftOn && mis?.phase !== 'battle' && mis?.phase !== 'after', canBox = !draftOn && mis?.phase !== 'battle';
    const boxed = byTotal(team.filter(m => m.boxed && m.step === 'done')), shown = team.filter(m => !m.boxed);
    return `<div class="card stack"><h2 style="margin:0">Your team (${shown.length})</h2><div class="muted" style="font-size:.85rem">Sorted by total stats.</div>${[...byTotal(shown.filter(m => m.step === 'done')), ...shown.filter(m => m.step !== 'done')].map(m => {
      const p = getPokemon(m.species);
      return `<div class="moncard">${monImg(m.species, m.shiny)}<div class="stack" style="flex:1;min-width:0">
        <div><b style="font-size:1.1rem">${esc(m.species)}</b> ${m.shiny ? '<span class="pill">★ Shiny</span>' : ''}<div class="muted" style="font-size:.9rem">Lv ${m.level} · ${(p?.types || []).join(' / ')} · becomes ${esc(m.finalName)}</div></div>
        ${m.step === 'done' ? `<div style="font-size:.92rem"><div>${esc(m.nature)} (${natureTag(m.nature)}) · ${esc(m.ability)}${m.abilitySlot === 'H' ? ' <span class="pill">Hidden</span>' : ''}</div>
            <div class="statline">${statLine(m)}</div>
            <div class="muted">IVs ${STAT_KEYS.map(k => m.ivs[k]).join(' / ')}${m.evs && STAT_KEYS.some(k => m.evs[k]) ? ` · EVs ${STAT_KEYS.map(k => m.evs[k]).join(' / ')}` : ''}</div><div>${m.moves.map(esc).join(' · ')}</div>
            ${newMovesNote(m)}${planSummary(m)}
            ${canEdit ? `<div class="row" style="gap:8px;margin-top:6px">${m.rerolls?.left > 0 || m.reroll ? `<button class="btn small primary" data-trr="${m.uid}">🎲 Re-roll${m.reroll ? ' (result waiting)' : ` (${m.rerolls.left} left)`}</button>` : ''}${m.evPending ? `<button class="btn small primary" data-tev="${m.uid}">Place ${m.evPending} EVs</button>` : ''}<button class="btn small" data-tmv="${m.uid}">Moves${m.newMoves ? ' <span class="newdot"></span>' : ''}</button><button class="btn small" data-tpl="${m.uid}">Plan</button>${canBox ? `<button class="btn small ghost" data-tbox="${m.uid}">📦 Box</button>` : ''}</div>` : ''}</div>`
          : draftOn ? `<div class="muted">Setup opens once everyone has picked.</div>`
          : `<div><button class="btn primary small" onclick="go('#/c/${cid}/p/${pid}/setup/${m.uid}')">Set up · ${STEP_NAMES[m.step]}</button></div>`}
      </div></div>`;
    }).join('')}${boxSection(boxed, canBox)}</div>`;
  };
  const draw = () => {
    if (!c) { app.innerHTML = `<div class="card empty">Campaign not found. <a href="#/">Back</a></div>`; return; }
    const me = (c.players || []).find(p => p.id === pid);
    if (!me) { go(`#/c/${cid}/who`); return; }
    const mine = colorOf(c, pid);
    const takenColors = (c.players || []).filter(p => p.id !== pid).map(p => colorOf(c, p.id));
    const m0 = (c.mission ?? 0) === 0;
    const showMap = m0 && c.settings?.mapMode === 'app';   // Mission 0's chase map (Missions 1+ use the battle screen)
    const myFound = mis ? foundBy(mis, pid) : [];
    const chasing = !!mis?.chase?.active, myTurn = chasing && mis.chase.order[mis.chase.turn] === pid;
    app.innerHTML = `
      <div class="row" style="margin-bottom:6px"><div class="muted">${esc(c.name)}</div><div class="spacer"></div>
        <button class="btn small ghost" onclick="go('#/c/${cid}/who')">Not ${esc(me.name)}?</button></div>
      <div class="row"><span class="sw big" style="background:${mine}">${esc(initialsOf(c.players)[pid])}</span><h1 style="margin:0">Hi, ${esc(me.name)}</h1></div>
      <div class="stack" style="margin-top:14px">
        <div class="card row"><div><div class="muted" style="font-weight:600">Current mission</div><div class="mission-num">${c.mission ?? 0}</div></div></div>
        ${showMap ? `<div class="card stack">${!mis ? `<div class="muted">${mis === undefined ? 'Loading map…' : 'Waiting for the DM to set up the map.'}</div>` : `
          <div class="row"><h2 style="margin:0">Map</h2><div class="spacer"></div>${mis.chase?.active ? '' : '<span class="muted" style="font-size:.9rem">Tap a hex to move</span>'}</div>
          ${chaseBar(c, mis, pid)}
          ${myTurn ? `<div class="yourturn">${mis.chase.roll
              ? `<div><b>You rolled ${mis.chase.roll}.</b> Tap a lit hex to move there.</div><button class="btn" id="stay">Stay here</button>`
              : `<div><b>Your turn!</b> Roll to move.</div><button class="btn primary" id="rollMove">🎲 Roll D4</button>`}</div>` : ''}
          <svg class="board" id="board"></svg>
          ${myFound.length ? `<div class="row">${myFound.map(t => `${typeBadge(t)}<b>${TYPES[t - 1]}</b>`).join(' ')}<span class="muted">reached</span></div>` : ''}`}
        </div>` : ''}
        ${m0 ? '' : '<div id="missionArea"></div>'}
        ${draftCard()}
        ${teamCard()}
        <div class="card stack"><h2 style="margin:0">Your color</h2>
          <div class="row">${PALETTE.map(col => `<button class="swatch ${col === mine ? 'on' : ''}" style="background:${col}" data-col="${col}" ${takenColors.includes(col) ? 'disabled title="Taken"' : ''}></button>`).join('')}</div></div>
      </div>`;
    app.querySelectorAll('[data-final]').forEach(b => b.onclick = async () => {
      const d = mis.draft, cur = d?.active && d.order[d.turn];
      const s = cur && cur.pid === pid && starterChoices(c, cur.tid).find(x => x.final === +b.dataset.final);
      if (!s || picking) return;
      if (!confirm(`Pick ${s.startsAs}? It becomes ${s.pick} at the end of its line.`)) return;
      picking = true;
      const mon = { uid: 'm' + Date.now().toString(36) + randInt(1e6).toString(36), final: s.final, finalName: s.pick, species: s.startsAs, pickType: s.type,
        level: 1, shiny: true, evs: Object.fromEntries(STAT_KEYS.map(k => [k, 0])), evPending: 10, ivs: null, ivRolls: null,
        nature: null, natureRolls: null, ability: null, abilitySlot: null, abilityRolls: null, moves: [], step: 'ivs' };
      try {   // only the current picker can write here, so these steps can't collide
        await DB.set(PLAYER(cid, pid), { team: [...team, mon] });
        await DB.update(CAMP(cid), { takenFinals: [...(c.takenFinals || []), s.final] });
        await DB.update(MISSION(cid, misNum), { 'draft.picks': [...(d.picks || []), { pid, tid: cur.tid, final: s.final, uid: mon.uid, species: s.startsAs }],
          'draft.turn': d.turn + 1, 'draft.active': d.turn + 1 < d.order.length });
        toast(`${s.startsAs} joined your team!`);
      } catch (e) { saveErr(e); }
      picking = false;
    });
    app.querySelectorAll('[data-tev]').forEach(x => x.onclick = () => evModal(team.find(m => m.uid === x.dataset.tev), saveMon));
    app.querySelectorAll('[data-tbox]').forEach(x => x.onclick = () => saveMon(x.dataset.tbox, { boxed: true }));
    app.querySelectorAll('[data-unbox]').forEach(x => x.onclick = () => saveMon(x.dataset.unbox, { boxed: false }));
    app.querySelectorAll('[data-trr]').forEach(x => x.onclick = () => rerollModal(team.find(m => m.uid === x.dataset.trr), saveMon, c.settings?.dice || 'physical', misNum));
    app.querySelectorAll('[data-tmv]').forEach(x => x.onclick = () => movesModal(team.find(m => m.uid === x.dataset.tmv), saveMon));
    app.querySelectorAll('[data-tpl]').forEach(x => x.onclick = () => planModal(team.find(m => m.uid === x.dataset.tpl), saveMon));
    app.querySelectorAll('[data-col]').forEach(b => b.onclick = () => DB.update(CAMP(cid), { ['colors.' + pid]: b.dataset.col }).catch(saveErr));
    const area = document.getElementById('missionArea');
    if (area) {
      const ctx = { c, mis, cid, misNum, pid, team, viewer: pid, redraw: draw };
      if (mis === undefined) area.innerHTML = '';
      else if (!mis || (c.settings?.mapMode === 'app' && !mis.cells?.length)) area.innerHTML = `<div class="card muted">Waiting for the DM to set up Mission ${c.mission}.</div>`;
      else if ((mis.phase || 'setup') === 'setup') missionSetupPlayer(area, ctx);
      else if (mis.phase === 'battle') battleView(area, ctx);
      else afterMissionPlayer(area, ctx);
    }
    if (showMap && mis) {
      const reach = myTurn && mis.chase.roll ? reachable(mis, pid, mis.chase.roll) : null;
      renderBoard(document.getElementById('board'), boardOpts(c, mis, { mine: pid, reach }), key => {
        if (mis.tokens?.[pid] === key) return;
        if (chasing) {   // during the chase you move only on your turn, within your roll
          if (!myTurn) return toast(`Wait for your turn`);
          if (!mis.chase.roll) return toast('Roll first');
          if (!reach.has(key)) return toast(`Out of reach — up to ${mis.chase.roll} hex${mis.chase.roll > 1 ? 'es' : ''}`);
          const { patch, claimed } = chaseMove(c, mis, pid, key);
          return DB.update(MISSION(cid, misNum), patch).then(() => claimed && toast(`You reached ${TYPES[claimed - 1]}!`)).catch(saveErr);
        }
        if (!canStand(mis, key, pid)) return toast('You can’t move there');
        const { patch, claimed } = movePatch(mis, pid, key);
        DB.update(MISSION(cid, misNum), patch).then(() => claimed && toast(`You reached ${TYPES[claimed - 1]}!`)).catch(saveErr);
      });
      document.getElementById('rollMove')?.addEventListener('click', async () => {
        const res = await rollDice({ title: 'Move roll', dice: [4], mode: c.settings?.dice || 'physical' });
        if (!res || !(mis.chase?.active && mis.chase.order[mis.chase.turn] === pid && !mis.chase.roll)) return;
        DB.update(MISSION(cid, misNum), { 'chase.roll': res.total, 'chase.last': `${nameOf(c, pid)} rolled ${res.total}.` }).catch(saveErr);
      });
      document.getElementById('stay')?.addEventListener('click', () =>
        DB.update(MISSION(cid, misNum), { ...advanceTurn(c, mis, mis.found || {}), 'chase.last': `${nameOf(c, pid)} stayed put.` }).catch(saveErr));
    }
  };
  const campUnwatch = DB.watchDoc(CAMP(cid), camp => {
    c = camp;
    if (c && (c.mission ?? 0) !== misNum) {
      misUnwatch?.(); misNum = c.mission ?? 0; mis = undefined;
      misUnwatch = DB.watchDoc(MISSION(cid, misNum), d => { mis = d; draw(); });
    }
    draw();
  });
  unwatch = () => { campUnwatch?.(); misUnwatch?.(); teamUnwatch?.(); };
}

// ---- Starter setup (phone): IVs → nature → ability → moves ----
// Every roll is saved the moment it's made, so reloading the page can't re-roll it.
function screenSetup(cid, pid, uid) {
  let c = null, team = null, natPick = null, abPick = null, movePick = null, busy = false;
  const mon = () => team?.find(m => m.uid === uid);
  const save = async patch => {   // replace this Pokémon in the team with its updated version
    busy = true;
    try { await DB.set(PLAYER(cid, pid), { team: team.map(m => m.uid === uid ? { ...m, ...patch } : m) }); }
    catch (e) { saveErr(e); }
    busy = false;
  };
  const statTable = (m, nature) => {
    const base = getPokemon(m.species)?.stats || {}, fin = getPokemon(m.finalName)?.stats || base, n = natureInfo(nature || 'Hardy');
    return `<table class="stats"><thead><tr><th></th><th>Base</th><th>IV</th><th>Lv ${m.level}</th><th title="${esc(m.finalName)}">Final base</th><th>Lv 100*</th></tr></thead><tbody>
      ${STAT_KEYS.map(k => { const iv = m.ivs?.[k] ?? 0, cls = n.up === k ? 'up' : n.down === k ? 'down' : '';
        return `<tr class="${cls}"><th>${STAT_LABEL[k]}${cls === 'up' ? ' ▲' : cls === 'down' ? ' ▼' : ''}</th><td>${base[k]}</td><td>${m.ivs ? iv : '–'}</td>
          <td><b>${m.ivs ? calcStat(k, base[k], iv, m.evs?.[k] || 0, m.level, nature) : '–'}</b></td><td>${fin[k]}</td><td><b>${m.ivs ? calcStat(k, fin[k], iv, 0, 100, nature) : '–'}</b></td></tr>`; }).join('')}
      </tbody></table><div class="muted" style="font-size:.8rem">*Lv 100 projection: ${esc(m.finalName)} with these IVs and no EVs, to show the nature's effect.</div>`;
  };
  const draw = () => {
    const m = mon();
    if (!c || !team) return;
    if (!m) { app.innerHTML = `<div class="card empty">Pokémon not found. <a href="#/c/${cid}/p/${pid}">Back</a></div>`; return; }
    if (m.step === 'done') { go(`#/c/${cid}/p/${pid}`); return; }
    const p = getPokemon(m.species), mode = c.settings?.dice || 'physical';
    const isCatch = m.setupMode === 'catch';   // new catches: one roll each (no 3× advantage), plus a shiny roll
    const steps = isCatch ? ['ivs', 'nature', 'ability', 'shiny', 'moves'] : ['ivs', 'nature', 'ability', 'moves'];
    const tries = isCatch ? 1 : 3;
    let body = '';
    if (m.step === 'ivs') {
      if (m.ivs) body = `<div class="card stack"><h2 style="margin:0">IVs</h2>
          ${m.ivRolls ? `<table class="stats"><thead><tr><th></th><th>${isCatch ? 'Roll' : 'Three rolls'} (D6+D12+D20)</th><th>IV</th></tr></thead><tbody>${STAT_KEYS.map(k => `<tr><th>${STAT_LABEL[k]}</th><td>${m.ivRolls[k].map(v => v === Math.max(...m.ivRolls[k]) ? `<b>${v}</b>` : v).join(' · ')}</td><td><b>${m.ivs[k]}</b></td></tr>`).join('')}</tbody></table>`
            : `<div>${STAT_KEYS.map(k => `${STAT_LABEL[k]} <b>${m.ivs[k]}</b>`).join(' · ')}</div>`}
          <div class="muted">${isCatch ? 'One roll per stat' : 'Best of three for each stat'}, capped at 31.</div>
          <div class="row"><div class="spacer"></div><button class="btn primary" id="toNature">Next: nature ▶</button></div></div>`;
      else if (mode !== 'physical') body = `<div class="card stack"><h2 style="margin:0">IVs</h2>
          <div class="muted">${isCatch ? 'Each stat rolls D6+D12+D20 once' : 'Each stat rolls D6+D12+D20 three times and keeps the best (3× advantage)'}, capped at 31.</div>
          <table class="stats"><tbody>${STAT_KEYS.map(k => `<tr><th>${STAT_LABEL[k]}</th><td data-ivr="${k}">–</td></tr>`).join('')}</tbody></table>
          <div class="row"><div class="spacer"></div><button class="btn primary" id="rollIVs">🎲 Roll all IVs</button></div></div>`;
      else body = `<div class="card stack"><h2 style="margin:0">IVs</h2>
          <div class="muted">${isCatch ? 'Roll D6+D12+D20 once for each stat and enter the <b>total</b>' : 'Roll D6+D12+D20 three times for each stat and enter the <b>best total</b>'} (3 to 38). Anything over 31 counts as 31.</div>
          <div class="two">${STAT_KEYS.map(k => `<label class="field"><span>${STAT_LABEL[k]}</span><input type="number" inputmode="numeric" min="3" max="38" data-iv="${k}"></label>`).join('')}</div>
          <div class="row"><div class="spacer"></div><button class="btn primary" id="saveIVs">Save IVs</button></div></div>`;
    } else if (m.step === 'nature') {
      const opts = (m.natureRolls || []).map(n => ({ roll: n, name: natureFromD100(n) }));
      natPick = natPick ?? opts[0]?.name;
      body = `<div class="card stack"><h2 style="margin:0">Nature</h2>
        ${!opts.length ? `<div class="muted">${isCatch ? 'Roll a D100 once for its nature.' : 'Roll a D100 three times, then keep the nature you like best.'}</div>
            <div class="row"><div class="spacer"></div><button class="btn primary" id="rollNat">🎲 Roll nature${isCatch ? '' : ' ×3'}</button></div>`
          : `<div class="muted">Tap a nature to preview it in the table, then keep one.</div>
            <div class="optgrid">${opts.map((o, i) => `<button class="opt ${o.name === natPick ? 'on' : ''}" data-nat="${o.name}"><small>Roll ${o.roll}</small><b>${o.name}</b><span>${natureTag(o.name)}</span></button>`).join('')}</div>`}
        ${statTable(m, opts.length ? natPick : null)}
        ${opts.length ? `<div class="row"><div class="spacer"></div><button class="btn primary" id="keepNat">Keep ${esc(natPick)} ▶</button></div>` : ''}</div>`;
    } else if (m.step === 'ability') {
      const opts = (m.abilityRolls || []).map(n => ({ roll: n, ...abilityFromD100(p, n) }));
      abPick = abPick ?? opts[0]?.name;
      body = `<div class="card stack"><h2 style="margin:0">Ability</h2>
        <div class="muted">${esc(m.species)} can have ${[...(p.abilities || []), p.hidden ? p.hidden + ' (hidden)' : null].filter(Boolean).map(esc).join(', ')}. D100: 91–100 is the hidden ability.</div>
        ${!opts.length ? `<div class="row"><div class="spacer"></div><button class="btn primary" id="rollAb">🎲 Roll ability${isCatch ? '' : ' ×3'}</button></div>`
          : `<div class="stack">${opts.map(o => `<button class="opt wide ${o.name === abPick ? 'on' : ''}" data-ab="${esc(o.name)}" data-slot="${o.slot}"><small>Roll ${o.roll}${o.slot === 'H' ? ' · Hidden' : ''}</small><b>${esc(o.name)}</b><span class="muted">${esc(getAbility(o.name)?.effect || '')}</span></button>`).join('')}</div>
            <div class="row"><div class="spacer"></div><button class="btn primary" id="keepAb">Keep ${esc(abPick)} ▶</button></div>`}</div>`;
    } else if (m.step === 'shiny') {
      body = `<div class="card stack"><h2 style="margin:0">Shiny roll</h2>
        <div class="muted">Roll D6+D12+D20. A total of exactly 3 (all ones) makes it shiny — 1 in 1,440.</div>
        ${m.shinyRoll == null ? `<div class="row"><div class="spacer"></div><button class="btn primary" id="rollShiny">🎲 Roll for shiny</button></div>`
          : `<div style="font-size:1.2rem">Rolled <b>${m.shinyRoll}</b> — ${m.shinyRoll === 3 ? '<b>it\'s shiny! ★</b>' : 'not shiny.'}</div><div class="row"><div class="spacer"></div><button class="btn primary" id="toMoves">Next: moves ▶</button></div>`}</div>`;
    } else if (m.step === 'moves') {
      const list = knowableMoves(m.species, m.level);
      movePick = movePick ?? list.slice(0, 4);
      body = `<div class="card stack"><h2 style="margin:0">Moves</h2>
        <div class="muted">Pick up to 4 from the level-up moves ${esc(m.species)} knows at level ${m.level}. You can swap them between missions.</div>
        <div class="stack">${list.map(mv => { const d = getMove(mv) || {};
          return `<button class="opt wide ${movePick.includes(mv) ? 'on' : ''}" data-mv="${esc(mv)}"><small>${d.type || ''} · ${d.category || ''}${d.power ? ' · Power ' + d.power : ''}${d.accuracy ? ' · Acc ' + d.accuracy : d.alwaysHits ? ' · Always hits' : ''}</small><b>${esc(mv)}</b><span class="muted">${esc(d.effect || '')}</span></button>`; }).join('')}</div>
        <div class="row"><span class="muted">${movePick.length} / 4 chosen</span><div class="spacer"></div><button class="btn primary" id="keepMoves" ${movePick.length ? '' : 'disabled'}>Finish setup ✓</button></div></div>`;
    }
    app.innerHTML = `
      <div class="row" style="margin-bottom:6px"><button class="btn small ghost" onclick="go('#/c/${cid}/p/${pid}')">◀ Back</button><div class="spacer"></div><span class="muted">${DICE[mode]}</span></div>
      <div class="moncard">${monImg(m.species, m.shiny, 'spr big')}<div><h1 style="margin:0">${esc(m.species)}</h1>
        <div class="muted">Lv ${m.level} · ${(p?.types || []).join(' / ')}${m.shiny ? ' · ★ Shiny' : ''} · becomes ${esc(m.finalName)}</div></div></div>
      ${isCatch ? '<div class="banner ok" style="margin-top:10px">New catch! Single rolls for IVs, nature and ability, then a shiny roll.</div>' : ''}
      <div class="steps">${steps.map((st, i) => `<span class="${st === m.step ? 'on' : steps.indexOf(m.step) > i ? 'done' : ''}">${i + 1}. ${STEP_NAMES[st].replace(/^(Roll|Choose) /, '').replace(' roll', '')}</span>`).join('')}</div>
      <div class="stack" style="margin-top:14px">${body}</div>`;
    const $ = id => document.getElementById(id);
    $('rollIVs')?.addEventListener('click', () => {
      if (busy) return; $('rollIVs').disabled = true;
      const rolls = Object.fromEntries(STAT_KEYS.map(k => [k, Array.from({ length: tries }, () => 3 + randInt(6) + randInt(12) + randInt(20))]));
      let n = 0; const spin = setInterval(() => {      // a short tumble, then the real numbers
        STAT_KEYS.forEach(k => { const el = app.querySelector(`[data-ivr="${k}"]`); if (el) el.textContent = [0, 1, 2].map(() => 3 + randInt(6) + randInt(12) + randInt(20)).join(' · '); });
        if (++n >= 10) { clearInterval(spin); save({ ivRolls: rolls, ivs: Object.fromEntries(STAT_KEYS.map(k => [k, Math.min(31, Math.max(...rolls[k]))])) }); }
      }, 60);
    });
    $('saveIVs')?.addEventListener('click', () => {
      const ivs = {};
      for (const k of STAT_KEYS) { const v = parseInt(app.querySelector(`[data-iv="${k}"]`).value); if (!(v >= 3 && v <= 38)) return toast(`Enter ${STAT_LABEL[k]} (3 to 38)`); ivs[k] = Math.min(31, v); }
      save({ ivs, ivRolls: null });
    });
    $('toNature')?.addEventListener('click', () => save({ step: 'nature' }));
    $('rollNat')?.addEventListener('click', async () => {
      const r = await rollDice({ title: 'Nature roll' + (isCatch ? '' : 's'), dice: Array(tries).fill(100), mode, showTotal: false });
      if (r && !mon().natureRolls) { natPick = null; save({ natureRolls: r.values }); }
    });
    app.querySelectorAll('[data-nat]').forEach(b => b.onclick = () => { natPick = b.dataset.nat; draw(); });
    $('keepNat')?.addEventListener('click', () => save({ nature: natPick, step: 'ability' }));
    $('rollAb')?.addEventListener('click', async () => {
      const r = await rollDice({ title: 'Ability roll' + (isCatch ? '' : 's'), dice: Array(tries).fill(100), mode, showTotal: false });
      if (r && !mon().abilityRolls) { abPick = null; save({ abilityRolls: r.values }); }
    });
    app.querySelectorAll('[data-ab]').forEach(b => b.onclick = () => { abPick = b.dataset.ab; draw(); });
    $('keepAb')?.addEventListener('click', () => { const o = app.querySelector(`[data-ab="${CSS.escape(abPick)}"]`); save({ ability: abPick, abilitySlot: o?.dataset.slot || '1', step: isCatch ? 'shiny' : 'moves' }); });
    $('rollShiny')?.addEventListener('click', async () => {
      const r = await rollDice({ title: 'Shiny roll (total of 3 = shiny)', dice: [6, 12, 20], mode });
      if (r && mon().shinyRoll == null) save({ shinyRoll: r.total, shiny: r.total === 3 });
    });
    $('toMoves')?.addEventListener('click', () => save({ step: 'moves' }));
    app.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const mv = b.dataset.mv;
      if (movePick.includes(mv)) movePick = movePick.filter(x => x !== mv);
      else if (movePick.length >= 4) return toast('4 moves max. Tap one to remove it first.');
      else movePick = [...movePick, mv];
      draw();
    });
    $('keepMoves')?.addEventListener('click', async () => { await save({ moves: movePick, step: 'done' }); toast(`${mon()?.species ?? 'Pokémon'} is ready!`); });
  };
  once(CAMP(cid)).then(camp => { c = camp; draw(); });
  unwatch = DB.watchDoc(PLAYER(cid, pid), d => { team = d?.team || []; draw(); });
}

// ═══ 8. MISSIONS & BATTLE ══════════════════════════════════════════════
// Rules engine first (pure math, no screens), then the mission/battle screens.

// ---- Type chart (current games): attacking type → defending type → multiplier ----
const TYPE_CHART = {
  Normal: { Rock: .5, Ghost: 0, Steel: .5 },
  Fire: { Fire: .5, Water: .5, Grass: 2, Ice: 2, Bug: 2, Rock: .5, Dragon: .5, Steel: 2 },
  Water: { Fire: 2, Water: .5, Grass: .5, Ground: 2, Rock: 2, Dragon: .5 },
  Electric: { Water: 2, Electric: .5, Grass: .5, Ground: 0, Flying: 2, Dragon: .5 },
  Grass: { Fire: .5, Water: 2, Grass: .5, Poison: .5, Ground: 2, Flying: .5, Bug: .5, Rock: 2, Dragon: .5, Steel: .5 },
  Ice: { Fire: .5, Water: .5, Grass: 2, Ice: .5, Ground: 2, Flying: 2, Dragon: 2, Steel: .5 },
  Fighting: { Normal: 2, Ice: 2, Poison: .5, Flying: .5, Psychic: .5, Bug: .5, Rock: 2, Ghost: 0, Dark: 2, Steel: 2, Fairy: .5 },
  Poison: { Grass: 2, Poison: .5, Ground: .5, Rock: .5, Ghost: .5, Steel: 0, Fairy: 2 },
  Ground: { Fire: 2, Electric: 2, Grass: .5, Poison: 2, Flying: 0, Bug: .5, Rock: 2, Steel: 2 },
  Flying: { Electric: .5, Grass: 2, Fighting: 2, Bug: 2, Rock: .5, Steel: .5 },
  Psychic: { Fighting: 2, Poison: 2, Psychic: .5, Dark: 0, Steel: .5 },
  Bug: { Fire: .5, Grass: 2, Fighting: .5, Poison: .5, Flying: .5, Psychic: 2, Ghost: .5, Dark: 2, Steel: .5, Fairy: .5 },
  Rock: { Fire: 2, Ice: 2, Fighting: .5, Ground: .5, Flying: 2, Bug: 2, Steel: .5 },
  Ghost: { Normal: 0, Psychic: 2, Ghost: 2, Dark: .5 },
  Dragon: { Dragon: 2, Steel: .5, Fairy: 0 },
  Dark: { Fighting: .5, Psychic: 2, Ghost: 2, Dark: .5, Fairy: .5 },
  Steel: { Fire: .5, Water: .5, Electric: .5, Ice: 2, Rock: 2, Steel: .5, Fairy: 2 },
  Fairy: { Fire: .5, Fighting: 2, Poison: .5, Dragon: 2, Dark: 2, Steel: .5 }
};
const typeMults = (moveType, defTypes) => defTypes.map(t => TYPE_CHART[moveType]?.[t] ?? 1);
const effOf = (moveType, defTypes) => typeMults(moveType, defTypes).reduce((a, b) => a * b, 1);
const effLabel = e => e === 0 ? 'No effect' : e >= 4 ? '4× super effective' : e >= 2 ? '2× super effective' : e <= .25 ? '¼× not very effective' : e < 1 ? '½× not very effective' : '1× neutral';

// ---- Speed table: current speed → Order (meter limit) and movement die ----
const SPEED_TIERS = [[14, 14, 4], [30, 13, 4], [54, 12, 4], [87, 11, 6], [128, 10, 6], [180, 9, 8], [241, 8, 8], [315, 7, 10], [400, 6, 10], [434, 5, 12], [Infinity, 4, 20]];

    case 'Soak': if (t.types.join() === 'Water') blog(b, 'But it failed.'); else { t.types = ['Water']; blog(b, `${t.name} became Water type.`); } break;
    case 'Magic Powder': if (t.types.join() === 'Psychic') blog(b, 'But it failed.'); else { t.types = ['Psychic']; blog(b, `${t.name} became Psychic type.`); } break;
    case 'Trick-or-Treat': if (t.types.includes('Ghost')) blog(b, 'But it failed.'); else { t.types = [...t.types.filter(x => x !== 'Grass' || true), 'Ghost'].slice(-3); blog(b, `${t.name} gained the Ghost type.`); } break;
    case "Forest's Curse": if (t.types.includes('Grass')) blog(b, 'But it failed.'); else { t.types = [...t.types, 'Grass'].slice(-3); blog(b, `${t.name} gained the Grass type.`); } break;
    case 'Reflect Type': u.types = [...t.types]; blog(b, `${u.name} became ${t.types.join('/')} type.`); break;
    case 'Worry Seed': case 'Simple Beam': { const nw = name === 'Worry Seed' ? 'Insomnia' : 'Simple'; if (abil(b, t) === nw || NO_COPY.has(abil(b, t)) && !['Trace'].includes(abil(b, t))) blog(b, 'But it failed.'); else { ab(t).now = nw; blog(b, `${t.name}'s ability became ${nw}.`); if (nw === 'Insomnia' && t.status === 'slp') { t.status = null; t.slp = 0; blog(b, `${t.name} woke up.`); } } break; }
    case 'Entrainment': if (NO_COPY.has(abil(b, u)) || abil(b, t) === abil(b, u)) blog(b, 'But it failed.'); else { ab(t).now = abil(b, u); blog(b, `${t.name}'s ability became ${ab(t).now}.`); } break;
    case 'Skill Swap': { const a1 = abil(b, u), a2 = abil(b, t); if (NO_COPY.has(a1) || NO_COPY.has(a2)) blog(b, 'But it failed.'); else { ab(u).now = a2; ab(t).now = a1; blog(b, `${u.name} and ${t.name} swapped abilities.`); } break; }
    case 'Role Play': if (NO_COPY.has(abil(b, t)) || abil(b, t) === abil(b, u)) blog(b, 'But it failed.'); else { ab(u).now = abil(b, t); blog(b, `${u.name} copied ${t.name}'s ${ab(u).now}.`); } break;
    case 'Doodle': if (NO_COPY.has(abil(b, t))) blog(b, 'But it failed.'); else { for (const x of [u, ...allies(b, u)]) ab(x).now = abil(b, t); blog(b, `${u.name} and its allies copied ${t.name}'s ${abil(b, t)}.`); } break;
    case 'Psycho Shift': if (!u.status || t.status || !canGetStatus(t, u.status, base, b, u)) blog(b, 'But it failed.'); else { const st = u.status; giveStatus(b, t, st, u, st === 'slp' ? u.slp : 0); u.status = null; u.slp = 0; blog(b, `${u.name}'s status moved to ${t.name}.`); } break;
    case 'Purify': if (!t.status) blog(b, 'But it failed.'); else { t.status = null; blog(b, `${t.name} was cured.`); if (!healBlocked(u)) blog(b, `${u.name} recovers ${heal(u, u.maxHp / 2)} HP.`); } break;
    case 'Heal Pulse': case 'Floral Healing': { const f = name === 'Heal Pulse' ? (abil(b, u) === 'Mega Launcher' ? .75 : .5) : (terrainNow(b) === 'grassy' ? 2 / 3 : .5); blog(b, healBlocked(t) ? `${t.name} can't heal (Heal Block).` : `${t.name} recovers ${heal(t, t.maxHp * f)} HP.`); break; }
    case 'Pollen Puff': if (!foe) blog(b, healBlocked(t) ? `${t.name} can't heal (Heal Block).` : `The pollen heals ${t.name}: +${heal(t, t.maxHp / 2)} HP.`); break;
    case 'Strength Sap': { if ((t.stages.atk || 0) <= -6) { blog(b, 'But it failed.'); break; } const amt = stat(t, 'atk'); blog(b, `${t.name}: ${applyStages(t, { atk: -1 }, b, u)}.`); blog(b, healBlocked(u) ? `${u.name} can't heal (Heal Block).` : abil(b, t) === 'Liquid Ooze' ? `Liquid Ooze! ${u.name} lost ${hurt(b, u, amt, 'Liquid Ooze')} HP.` : `${u.name} recovers ${heal(u, amt)} HP.`); break; }
    case 'Pain Split': { const avg = Math.floor((u.hp + t.hp) / 2); u.hp = Math.min(u.maxHp, avg); t.hp = Math.min(t.maxHp, avg); blog(b, `${u.name} and ${t.name} shared their pain: both at ${avg} HP.`); break; }
    case 'Sparkling Aria': if (hit && t.status === 'brn') { t.status = null; blog(b, `${t.name}'s burn was healed.`); } break;
    case 'Wake-Up Slap': if (hit && t.status === 'slp') { t.status = null; t.slp = 0; blog(b, `${t.name} woke up!`); } break;
    case 'Smelling Salts': if (hit && t.status === 'par') { t.status = null; blog(b, `${t.name} was cured of paralysis.`); } break;
    case 'Venom Drench': if (['psn', 'tox'].includes(t.status)) blog(b, `${t.name}: ${applyStages(t, { atk: -1, spa: -1, spe: -1 }, b, u)}.`); else blog(b, `${t.name} isn't poisoned — no effect.`); break;
    case 'Transform': doTransform(b, u, t); break;
    case 'Mimic': { const lm = tv.lastMove; if (!lm || FAIL_MIMIC.has(lm) || (u.moves || []).includes(lm)) { blog(b, 'But it failed.'); break; } u.moves = (u.moves || []).map(m => m === 'Mimic' ? lm : m); setPP(u, lm, maxPPOf(lm) ?? 5); blog(b, `${u.name} learned ${lm} for this battle.`); break; }
    case 'Sketch': await sketch(env, u, t); break;
    case 'Conversion 2': { const lm = tv.lastMove && getMove(tv.lastMove); if (!lm) { blog(b, 'But it failed.'); break; } const res = Object.keys(TYPE_CHART).filter(tp => (TYPE_CHART[lm.type]?.[tp] ?? 1) < 1 && !u.types.includes(tp)); if (!res.length) { blog(b, 'But it failed.'); break; } u.types = [res[randInt(res.length)]]; blog(b, `${u.name} became ${u.types[0]} type.`); break; }
    case 'Mind Reader': case 'Lock-On': uv.lockOn = { target: t.id, left: 1 }; blog(b, `${u.name} took aim at ${t.name} — its next move can't miss.`); break;
    case 'Acupressure': { const ks = ['atk', 'def', 'spa', 'spd', 'spe', 'acc', 'eva'].filter(k => (t.stages[k] || 0) < 6); if (!ks.length) { blog(b, 'But it failed.'); break; } const k = ks[randInt(ks.length)]; blog(b, `${t.name}: ${applyStages(t, { [k]: 2 }, b, u)}.`); break; }
    case 'Defog': { const n = clearTilesNear(b, u, 3); for (const k of ['reflect', 'lightscreen', 'auroraveil', 'safeguard', 'mist']) for (const sd of ['p', 'w']) if (timerOn(b, k, sd)) { removeTimer(b, k, sd); blog(b, `${TIMER_NAME[k]} was blown away.`); } if (b.terrain) clearTerrain(b); if (n) blog(b, `Defog cleared ${n} hazard tile${n > 1 ? 's' : ''} within 3 hexes.`); break; }
    case 'Roar': case 'Whirlwind': case 'Dragon Tail': case 'Circle Throw': if (hit || base.category === 'Status') await forceOut(env, u, t, base); break;
    case 'Instruct': {
      const lm = tv.lastMove;
      if (!lm || FAIL_INSTRUCT.has(lm) || !(t.moves || []).includes(lm) || moveBlockedWhy(b, t, lm) || t.v?.charging || t.v?.locked) { blog(b, 'But it failed.'); break; }
      b.instruct = { id: t.id, move: lm }; blog(b, `${t.name} follows ${u.name}'s instructions and uses ${lm} again!`); break;
    }
  }
}

async function sketch(env, u, t) {
  const b = env.b, lm = t.v?.lastMove;
  // Jack's rule: Smeargle gets a Sketch at levels 1, 10, 20 … 100. Each one turns into the copied move for good.
  const allowed = 1 + Math.floor((u.level || 1) / 10), usedUp = (u.sketched || 0) + (b.sketches || []).filter(s => s.by === u.id).length;
  if (!lm || NO_SKETCH.has(lm) || (u.moves || []).includes(lm)) { blog(b, 'But it failed.'); return; }
  if (u.side === 'p' && usedUp >= allowed) { blog(b, `${u.name} has used all ${allowed} of its Sketches for now (one more every 10 levels).`); return; }
  u.moves = (u.moves || []).map(m => m === 'Sketch' ? lm : m); setPP(u, lm, maxPPOf(lm) ?? 5);
  if (u.side === 'p') b.sketches = [...(b.sketches || []), { by: u.id, owner: u.owner, ref: u.ref, move: lm }];
  blog(b, `${u.name} sketched ${lm}! ${u.side === 'p' ? 'It keeps the move for good.' : ''}`);
}

// ---- Self, side and field moves (return 'done' when handled, 'fail' when it failed, or nothing to carry on) ----
async function selfOrFieldMove(env, u, base, targetIds) {
  const b = env.b, mis = env.mis, name = base.name, v = vol(u), aa = abil(b, u);
  const side = u.side, sideTxt = side === 'w' ? 'the wild side' : `${b.names?.[u.owner] || 'the player'}'s side`;

  if (FIELD_EFFECTS[name]) {

    if (timerOn(b, k)) { blog(b, `But ${name} is already active.`); return 'fail'; }
    addTimer(b, k, u, 5);
    blog(b, { trickroom: 'Trick Room twisted the dimensions — the slowest Pokémon now get the fastest turn order and move dice', gravity: 'Gravity intensified — everything is grounded and accuracy rises', magicroom: 'Magic Room has no effect — there are no held items in this game', wonderroom: 'Wonder Room swaps everyone\'s Defense and Sp. Def', mudsport: 'Electric moves are weakened', watersport: 'Fire moves are weakened' }[k] + ` (5 of ${u.name}'s turns).`);
    if (k === 'gravity') for (const x of fieldUnits(b)) { if (x.v?.charging && ['Fly', 'Bounce'].includes(x.v.charging.move)) { delete x.v.charging; blog(b, `${x.name} fell from the sky!`); } delete x.v?.magnetRise; delete x.v?.telekinesis; }
    return 'done';
  }

  switch (name) {

    case 'Perish Song': { let n = 0; for (const x of fieldUnits(b)) if (x.v?.perish == null && abil(b, x) !== 'Soundproof') { vol(x).perish = 3; n++; } blog(b, n ? 'Everyone who heard the song will faint in 3 turns!' : 'But it failed.'); return 'done'; }
    case 'Fairy Lock': v.fairyLock = true; blog(b, `No one can switch out until ${u.name}'s next turn.`); return 'done';
    case 'Court Change': { for (const t of b.timers || []) if (t.side) t.side = t.side === 'p' ? 'w' : 'p'; for (const h of b.hazards || []) h.side = h.side === 'p' ? 'w' : 'p'; blog(b, 'The two sides swapped their effects and hazard tiles.'); return 'done'; }
    case 'Rototiller': case 'Flower Shield': { const xs = fieldUnits(b).filter(x => x.types.includes('Grass') && (name === 'Flower Shield' || grounded(b, x))); if (!xs.length) { blog(b, 'But it failed.'); return 'fail'; } for (const x of xs) blog(b, `${x.name}: ${applyStages(x, name === 'Rototiller' ? { atk: 1, spa: 1 } : { def: 1 }, b, u)}.`); return 'done'; }
    case 'Gear Up': case 'Magnetic Flux': { const xs = [u, ...allies(b, u)].filter(x => ['Plus', 'Minus'].includes(abil(b, x))); if (!xs.length) { blog(b, 'But it failed.'); return 'fail'; } for (const x of xs) blog(b, `${x.name}: ${applyStages(x, name === 'Gear Up' ? { atk: 1, spa: 1 } : { def: 1, spd: 1 }, b, u)}.`); return 'done'; }
    case 'Wish': b.wishes = [...(b.wishes || []).filter(w => w.by !== u.id), { by: u.id, name: u.name, hex: u.pos, side, amt: u.maxHp / 2, left: 2 }]; blog(b, `${u.name} made a wish — it comes true at the end of its next turn.`); return 'done';
    case 'Future Sight': case 'Doom Desire': {

    case 'Growth': blog(b, `${u.name}: ${applyStages(u, sunFor(b, u) ? { atk: 2, spa: 2 } : { atk: 1, spa: 1 }, b, u)}.`); return 'done';
    case 'Belly Drum': u.hp -= Math.floor(u.maxHp / 2); u.stages.atk = 6; blog(b, `${u.name} cut its HP in half and maxed out its Attack!`); return 'done';
    case 'Fillet Away': u.hp -= Math.floor(u.maxHp / 2); blog(b, `${u.name} lost half its HP.`); return null;

    case 'Swallow': { const f = [0, .25, .5, 1][v.stockpile]; blog(b, healBlocked(u) ? `${u.name} can't heal (Heal Block).` : `${u.name} recovered ${heal(u, u.maxHp * f)} HP.`); applyStages(u, { def: -v.stockpile, spd: -v.stockpile }, b, u); v.stockpile = 0; return 'done'; }
    case 'Defense Curl': v.curled = true; return null;
    case 'Minimize': v.minimized = true; return null;
    case 'Focus Energy': if (v.focusEnergy) { blog(b, 'But it failed.'); return 'fail'; } v.focusEnergy = true; blog(b, `${u.name} is getting pumped — critical hits are more likely.`); return 'done';
    case 'Laser Focus': v.laserFocus = 2; blog(b, `${u.name} concentrated — its moves on its next turn are critical hits.`); return 'done';
    case 'Charge': ab(u).charged = true; blog(b, `${u.name} is charged — its next Electric move has double power.`); return null;
    case 'Magnet Rise': if (v.magnetRise || forcedDown(b, u)) { blog(b, 'But it failed.'); return 'fail'; } v.magnetRise = 5; blog(b, `${u.name} floats on magnetism for 5 turns.`); return 'done';
    case 'Ingrain': if (v.ingrain) { blog(b, 'But it failed.'); return 'fail'; } v.ingrain = true; blog(b, `${u.name} planted its roots — it heals each turn but can't switch out.`); return 'done';
    case 'Aqua Ring': if (v.aquaRing) { blog(b, 'But it failed.'); return 'fail'; } v.aquaRing = true; blog(b, `${u.name} surrounded itself with a veil of water.`); return 'done';
    case 'No Retreat': if (v.noRetreat) { blog(b, 'But it failed.'); return 'fail'; } v.noRetreat = true; blog(b, `${u.name} won't retreat — it can't switch out.`); return null;
    case 'Power Trick': [u.stats.atk, u.stats.def] = [u.stats.def, u.stats.atk]; v.powerTrick = !v.powerTrick; blog(b, `${u.name} swapped its Attack and Defense.`); return 'done';
    case 'Autotomize': v.autotomize = (v.autotomize || 0) + 1; blog(b, `${u.name} became lighter.`); return null;
    case 'Roost': if (healBlocked(u)) { blog(b, `${u.name} can't heal (Heal Block).`); return 'fail'; } blog(b, `${u.name} recovered ${heal(u, u.maxHp / 2)} HP.`); if (u.types.includes('Flying')) { v.roost = [...u.types]; u.types = u.types.filter(t => t !== 'Flying'); if (!u.types.length) u.types = ['Normal']; blog(b, `${u.name} landed — it loses its Flying type until its next turn.`); } return 'done';
    case 'Substitute': { const c = Math.floor(u.maxHp / 4); u.hp -= c; v.sub = true; v.subHp = c; blog(b, `${u.name} made a substitute (${c} HP).`); return 'done'; }
    case 'Shed Tail': { const c = Math.ceil(u.maxHp / 2); u.hp -= c; v.passSub = Math.floor(u.maxHp / 4); blog(b, `${u.name} shed its tail to make a substitute.`); v.sub = true; v.subHp = v.passSub; await selfSwitch(env, u, null, base, 'shed'); return 'done'; }

    case 'Tidy Up': { for (const x of fieldUnits(b)) if (x.v?.sub) { delete x.v.sub; delete x.v.subHp; } const n = clearTilesNear(b, u, 3); blog(b, `${u.name} tidied up${n ? ` (${n} hazard tile${n > 1 ? 's' : ''} cleared within 3 hexes)` : ''} and cleared every substitute: ${applyStages(u, { atk: 1, spe: 1 }, b, u)}.`); return 'done'; }

    case 'Curse': {

// Real stats at the Pokémon's current level (IVs, EVs and nature included), and their total.
const monStats = m => m.ivs ? statsFor(m.species, m.ivs, m.evs || {}, m.level, m.nature) : null;
const monTotal = m => { const st = monStats(m); return st ? STAT_KEYS.reduce((a, k) => a + st[k], 0) : 0; };
const byTotal = team => [...team].sort((a, b2) => monTotal(b2) - monTotal(a));
const statLine = m => { const st = monStats(m); return st ? `${STAT_KEYS.map(k => `${STAT_LABEL[k]} <b>${st[k]}</b>`).join(' · ')} · <b>Total ${monTotal(m)}</b>` : ''; };
// Party: this mission's pick, else last mission's party, else the 6 highest totals.
const partyOf = (setup, pid, team, c) => {
  const sorted = byTotal(team.filter(m => !m.boxed)), ids = setup.parties?.[pid] || c?.lastParties?.[pid];   // boxed Pokémon never count
  const p = ids ? sorted.filter(m => ids.includes(m.uid)).slice(0, 6) : [];
  return p.length ? p : sorted.slice(0, 6);
};
const leadsOf = (setup, pid, party) => { const ids = setup.leads?.[pid] || []; return party.filter(m => ids.includes(m.uid)); };   // only the starred ones
const leadsNeeded = (party, per) => Math.min(per, party.length);

// ---- Player: choose a party of 6 and who goes out first ----
function missionSetupPlayer(el, ctx) {
  const { c, mis, cid, misNum, pid, team } = ctx;

  const per = setup.perPlayer || ((c.players || []).length === 1 ? 2 : 1);
  const party = partyOf(setup, pid, ready, c), leads = leadsOf(setup, pid, party), need = leadsNeeded(party, per);
  const order = [...byTotal(party), ...byTotal(ready.filter(m => !party.includes(m) && !m.boxed))];   // party on top, then everyone else by total
  const inBox = byTotal(ready.filter(m => m.boxed));
  el.innerHTML = `<div class="card stack"><h2 style="margin:0">Mission ${misNum}: your party</h2>
    <div class="muted">Tap to bring up to 6 Pokémon (sorted by total stats). Star the ${need === 1 ? 'one' : need} that go${need === 1 ? 'es' : ''} out first.</div>
    ${ready.length && leads.length !== need ? `<div class="banner warn">Star ${need - leads.length > 0 ? need - leads.length + ' more' : 'fewer'} — the DM can't start until you've starred ${need}.</div>` : ''}
    ${ready.length ? `<div class="stack">${order.map(m => { const inP = party.includes(m), lead = leads.includes(m);
      return `<div class="partyrow ${inP ? 'on' : ''}"><button class="row grow" data-party="${m.uid}" style="all:unset;display:flex;gap:10px;align-items:center;flex:1;cursor:pointer">${monImg(m.species, m.shiny, 'spr sm')}<div><b>${esc(m.species)}</b> <span class="muted" style="font-size:.85rem">Lv ${m.level} · ${(getPokemon(m.species)?.types || []).join(' / ')}</span><div class="statline">${statLine(m)}</div></div></button>
        ${inP ? `<button class="icon-btn ${lead ? 'star' : ''}" data-lead="${m.uid}" title="Goes out first">${lead ? '★' : '☆'}</button>` : ''}</div>`; }).join('')}
      ${inBox.length ? `<details class="boxsec" ${BUI.boxOpen ? 'open' : ''} id="pickBox"><summary><b>📦 Box (${inBox.length})</b> <span class="muted" style="font-size:.85rem">tap one to bring it (it leaves the box)</span></summary><div class="stack" style="margin-top:8px">${inBox.map(m => `<div class="partyrow"><button class="row grow" data-frombox="${m.uid}" style="all:unset;display:flex;gap:10px;align-items:center;flex:1;cursor:pointer">${monImg(m.species, m.shiny, 'spr sm')}<div><b>${esc(m.species)}</b> <span class="muted" style="font-size:.85rem">Lv ${m.level} · ${(getPokemon(m.species)?.types || []).join(' / ')}</span><div class="statline">${statLine(m)}</div></div></button></div>`).join('')}</div></details>` : ''}</div>`

    let p = party.map(m => m.uid); const id = b.dataset.party;
    if (p.includes(id)) p = p.filter(x => x !== id); else if (p.length >= 6) return toast('6 Pokémon max'); else p.push(id);
    save(p, leads.map(m => m.uid).filter(x => p.includes(x)));
  });
  const pb = el.querySelector('#pickBox'); if (pb) pb.ontoggle = () => { BUI.boxOpen = pb.open; };
  el.querySelectorAll('[data-frombox]').forEach(b => b.onclick = async () => {   // take it out of the box and into the party
    const id = b.dataset.frombox, p = party.map(m => m.uid);

    save(party.map(m => m.uid), l);

}

// ---- The battle screen (shared by the DM screen and phones) ----
function battleView(el, ctx) {

  const ringOf = u => u.side === 'w' ? 'var(--ink)' : colorOf(c, u.owner);
  if (BUI.place && (b.units[BUI.place]?.pos || b.units[BUI.place]?.fainted)) BUI.place = null;   // done placing

    } else {

      if (plan.stay) { aiPanel = `<div class="aibox">🤖 ${esc(tag)}${fName}: <b>stays put</b> — ${esc(plan.note)}.</div>`; aiDo = () => toAct(clone(b), `${tag}: stays put — ${plan.note}.`); }
      else { aiPanel = `<div class="aibox">🤖 ${esc(tag)}${fName}: <b>rolls to move</b> — ${esc(plan.note)}.</div>`; aiDo = () => el.querySelector('.turnpanel [data-act="rollmove"]')?.click(); }
    } else if (t.step === 'move') {
      if (b.noMap) { aiManual = true; aiPanel = `<div class="aibox">🤖 ${esc(tag)}${fName}: move it up to ${t.roll} toward ${esc(plan.focus?.name || 'the closest enemy')} on the table, then tap Done moving.</div>`; }
      else {
        if (plan.dest && plan.dest !== turnU.pos) aim = new Set([plan.dest]);
        aiPanel = `<div class="aibox">🤖 ${esc(tag)}${fName}: <b>${plan.stay ? 'stays put' : 'moves to the highlighted hex'}</b> — ${esc(plan.note)}.</div>`;
        aiDo = () => { const nb = clone(b), me = nb.units[turnU.id]; nb.turn.from = me.pos; if (plan.dest) walkTo(nb, mis, me, plan.dest, t.roll);
          if (me.fainted || !onField(nb, me)) { blog(nb, `${tag}: moves — ${plan.note}.`); return save(finishTurnSafe(nb)); }

    } else if (t.step === 'act') {
      if (plan.none) { aiPanel = `<div class="aibox">🤖 ${esc(tag)}: nothing in reach, so it ends its turn.</div>`; aiDo = () => { const nb = clone(b); blog(nb, `${tag}: nothing in reach — ends its turn.`); BUI = {}; save(finishTurnSafe(nb)); }; }
      else {
        const who = plan.targets.map(id => b.units[id]?.name).filter(Boolean).join(', ');
        aiPanel = `<div class="aibox">🤖 ${esc(tag)}${fName}: <b>${esc(plan.mv.name)}</b>${who ? ` on <b>${esc(who)}</b>` : ''} — ${esc(plan.note)}.</div>`;
        if (!b.noMap) aim = new Set(plan.targets.map(id => b.units[id]?.pos).filter(Boolean));
        aiDo = () => useMove(ctx, turnU.id, plan.mv.name, plan.targets, { auto: true, note: `${tag}${plan.focus ? ` focuses ${plan.focus.name}` : ''}: ${plan.mv.name}${who ? ` on ${who}` : ''} — ${plan.note}.` });

    }
    if (aiPanel && aiMode === 'suggest' && aiDo) aiPanel = aiPanel.replace(/<\/div>$/, ` <div class="row" style="margin-top:6px"><button class="btn small primary" data-act="aiaccept">Accept</button><span class="muted" style="font-size:.85rem">or play it yourself below</span></div></div>`);

  }

  // Turn panel for whoever controls the acting Pokémon
  let turnHTML = '';
  if (b.over) turnHTML = `<div class="banner ok"><b>${b.over === 'players' ? 'Victory!' : b.over === 'wild' ? 'The wild Pokémon won.' : 'Battle ended by the DM.'}</b> ${isDM ? 'Tap Finish mission when ready.' : 'Waiting for the DM to finish the mission.'}</div>`;
  else if (!b.started) turnHTML = `<div class="banner warn">${isDM ? 'Send out wild Pokémon from the bench and place everyone, then tap <b>Start turns</b>.' : 'Place your Pokémon on a start hex. The DM starts the turns.'}</div>`;
  else if (!turnU) turnHTML = `<div class="muted">Waiting…</div>`;
  else if (!myTurn) turnHTML = `<div class="turnnow"><span class="sw" style="background:${ringOf(turnU)}"></span><b>${esc(turnU.name)}</b>&nbsp;is up (${esc(sideName(b, turnU))}).</div>`;
  else {
    const t = b.turn, tier = tierOf(turnU, b);
    let body = '';
    const trapNow = trappedBy(b, turnU);
    const switchBtn = trapNow ? `<span class="muted">Can't switch: ${esc(trapNow)}</span>` : `<button class="btn" data-act="switch">⇄ Switch</button>`;
    if (BUI.switching && (t.step === 'move' || t.step === 'act')) {   // switching is allowed any time in your turn
      const opts = units.filter(u => u.side === turnU.side && u.owner === turnU.owner && !u.out && !u.fainted);
      body = `<div><b>Switch ${esc(turnU.name)} for:</b> (takes the same hex; uses this turn)</div><div class="row">${opts.map(u => `<button class="chip" data-switch="${u.id}">${monImg(u.name, u.shiny, 'spr xs')}${esc(u.name)} <span class="muted">${u.hp}/${u.maxHp}</span></button>`).join('') || '<span class="muted">No one to switch in.</span>'}</div><button class="btn ghost small" data-act="back">Back</button>`;
    } else if (t.step === 'start') {
      body = turnU.status === 'frz' ? `<div>${esc(turnU.name)} is frozen. Roll a D100: 1–20 thaws it.</div><button class="btn primary" data-act="thaw">🎲 Roll D100</button>`
        : turnU.status === 'par' ? `<div>${esc(turnU.name)} is paralyzed. Roll a D100: 1–25 means it can't move this turn.</div><button class="btn primary" data-act="para">🎲 Roll D100</button>`
        : `<div>${esc(turnU.name)} is asleep (${turnU.slp} turn${turnU.slp === 1 ? '' : 's'} left).</div><button class="btn primary" data-act="sleep">Continue</button>`;
    } else if (t.step === 'confuse') {
      body = turnU.v.confused.left <= 0 ? `<div>${esc(turnU.name)} is snapping out of its confusion.</div><button class="btn primary" data-act="confuse">Continue</button>`
        : `<div>${esc(turnU.name)} is confused (${turnU.v.confused.left} turn${turnU.v.confused.left === 1 ? '' : 's'} left). Roll a D100: 1–33 means it hurts itself and its turn ends.</div><button class="btn primary" data-act="confuse">🎲 Roll D100</button>`;
    } else if (t.step === 'love') {
      body = `<div>${esc(turnU.name)} is in love with ${esc(b.units[turnU.v.love]?.name || 'a foe')}. Roll a D100: 1–50 means it can't act this turn.</div><button class="btn primary" data-act="love">🎲 Roll D100</button>`;
    } else if (t.step === 'tiles') {
      body = `<div>Tap ${t.tiles?.left || 0} open hex${t.tiles?.left === 1 ? '' : 'es'} on the map for ${esc(HAZARD_NAME[t.tiles?.kind] || 'the hazard')}.</div><button class="btn ghost" data-act="tilesdone">Done placing</button>`;
    } else if (t.step === 'move') {
      body = !t.roll && turnU.v?.bound && abil(b, turnU) !== 'Run Away' ? `<div>${esc(turnU.name)} is trapped by ${esc(turnU.v.bound.move)} — it can move only 1 hex.</div><div class="row"><button class="btn primary" data-act="rollmove">Move 1 hex</button><button class="btn ghost" data-act="stay">Don't move</button></div>`
        : !t.roll ? `<div>Speed ${currentSpeed(turnU, b)} → move die D${tier.die}.</div><div class="row"><button class="btn primary" data-act="rollmove">🎲 Roll D${tier.die} to move</button><button class="btn ghost" data-act="stay">Don't move</button><div class="spacer"></div>${switchBtn}</div>`
        : b.noMap ? `<div>Rolled <b class="rollnum">${t.roll}</b>. Move up to ${t.roll} hexes on the table.</div><div class="row"><button class="btn primary" data-act="stay">Done moving</button><div class="spacer"></div>${switchBtn}</div>`
        : `<div>Rolled <b class="rollnum">${t.roll}</b>. Tap a lit hex.</div><div class="row"><button class="btn" data-act="stay">Stay here</button><div class="spacer"></div>${switchBtn}</div>`;
    } else if (t.step === 'act') {
      if (t.called && t.forced && !BUI.move) { BUI.move = t.forced; BUI.targets = []; }
      const mv = BUI.move && getMove(BUI.move);
      if (mv) {
        const R = moveReach(b, mis, turnU, mv);
        const redir = redirectFor(b, mis, turnU, mv);   // Follow Me / Rage Powder / Spotlight
        if (redir) { if (R.kind === 'line') R.dirs.forEach(d => { if (!d.hit.some(x => x.id === redir.id)) d.hit = []; }); else if (R.units) R.units = R.units.filter(x => x.id === redir.id); }
        const isFoe = x => x.side !== turnU.side;
        const card = (x, on, attr) => { const e = effAgainst(b, turnU, viewAs(b, x, isDM), mv);
          return `<button class="target ${on ? 'on' : ''} side-${x.side}" ${attr}>${monImg(x.name, x.shiny, 'spr sm')}<div><b>${esc(x.name)}</b> <span class="muted">${isFoe(x) ? esc(sideName(b, x)) : 'ally'}</span>
            <div class="types">${shownTypes(x, isDM).map(t2 => `<i class="tchip t-${t2}">${t2}</i>`).join('')}</div><div class="abil">${abilityHidden(b, x, isDM) ? '?' : esc(abil(b, x) || '')}</div>${hpBar(x)}${e !== null ? `<div class="eff e${String(e).replace('.', '')}">${effLabel(e)}</div>` : ''}</div></button>`; };
        let pick = '', allyBtn = '';
        const allyToggle = n => n ? `<button class="btn small ghost" data-act="allies">${BUI.allies ? 'Hide allies' : `Show allies (${n})`}</button>` : '';
        if (R.kind === 'self') pick = `<div class="muted">${R.sh.kind === 'field' ? 'Affects the field — no target to pick.' : `Targets ${esc(turnU.name)} itself${mv.target !== 'Self' ? ' / its side' : ''}.`}</div>`;
        else if (R.kind === 'line') {
          const shown = R.dirs.filter(d => d.hit.length && (BUI.allies || d.hit.some(isFoe)));
          const allyOnly = R.dirs.filter(d => d.hit.length && !d.hit.some(isFoe)).length;
          if (BUI.dir != null && !shown.some(d => d.dir === BUI.dir)) BUI.dir = null;
          BUI.targets = BUI.dir == null ? [] : R.dirs[BUI.dir].hit.map(x => x.id);
          pick = `<div><b>Choose a direction</b> <span class="muted">(${esc(R.sh.text)}: hits every Pokémon in the first ${R.sh.n} hex${R.sh.n > 1 ? 'es' : ''}, allies too — or tap a lit hex)</span></div>
            <div class="targets">${shown.map(d => `<button class="target dir ${BUI.dir === d.dir ? 'on' : ''}" data-dir="${d.dir}"><span class="arrow">${DIR_ARROW[d.dir]}</span><div class="stack" style="--gap:4px">${d.hit.map(x => { const e = effAgainst(b, turnU, viewAs(b, x, isDM), mv); return `<div class="row" style="--gap:6px">${monImg(x.name, x.shiny, 'spr xs')}<b>${esc(x.name)}</b>${isFoe(x) ? '' : ' <span class="muted">ally</span>'}${e !== null ? ` <span class="eff e${String(e).replace('.', '')}">${effShort(e)}</span>` : ''}</div>`; }).join('')}</div></button>`).join('') || '<div class="muted">No enemy in reach. Move closer, or end your turn.</div>'}</div>`;
          allyBtn = allyToggle(allyOnly);
        } else if (R.kind === 'aoe') {
          BUI.targets = R.units.map(x => x.id);
          pick = `<div><b>Hits everyone in the area</b> <span class="muted">(${esc(R.sh.text)}${R.sh.foes ? '' : ', allies included'})</span></div>
            <div class="targets">${R.units.map(x => card(x, true, 'disabled')).join('') || '<div class="muted">No one in the area.</div>'}</div>`;
        } else {   // range or free (no map)
          const shown = R.units.filter(x => BUI.allies || isFoe(x));
          BUI.targets = (BUI.targets || []).filter(id => shown.some(x => x.id === id));
          const many = R.max > 1;
          pick = `<div><b>Choose ${many ? (R.max === Infinity ? 'targets' : `up to ${R.max} different targets`) : 'a target'}</b> <span class="muted">(${R.kind === 'free' ? `${esc(R.sh.text)} — the table judges range` : `${esc(R.sh.text)}, in line of sight`})</span></div>
            <div class="targets">${shown.map(x => card(x, BUI.targets.includes(x.id), `data-tgt="${x.id}"`)).join('') || `<div class="muted">No enemy in ${R.kind === 'free' ? 'play' : 'range'}.</div>`}</div>`;
          allyBtn = allyToggle(R.units.filter(x => !isFoe(x)).length);
        }
        const ready = R.kind === 'self' || BUI.targets.length;
        body = `<div class="opt wide on" style="cursor:default">${moveCardHTML(mv.name, ppPill(turnU, mv.name))}</div>
          ${t.called ? `<div class="banner warn">${esc(t.called)} called ${esc(mv.name)} — pick its target.</div>` : ''}${redir ? `<div class="banner warn">${esc(redir.name)} is drawing attention — this move must aim at it.</div>` : ''}
          ${pick}${allyBtn ? `<div class="row">${allyBtn}</div>` : ''}
          <div class="row">${t.called ? `<button class="btn ghost" data-act="skip">Skip it</button>` : `<button class="btn ghost" data-act="back">Back</button>`}<div class="spacer"></div><button class="btn primary" data-act="use" ${ready ? '' : 'disabled'}>Use ${esc(mv.name)}</button></div>`;
        if (!b.noMap) {   // light up the board for this move
          if (R.kind === 'line') { lit = new Set(R.dirs.filter(d => d.hit.length && (BUI.allies || d.hit.some(isFoe))).flatMap(d => d.hexes)); aim = new Set(BUI.dir != null ? R.dirs[BUI.dir].hexes : []);
            tap = key => { const d = R.dirs.find(d2 => d2.hexes.includes(key) && lit.has(key)); if (d) { BUI.dir = d.dir; ctx.redraw(); } }; }
          else if (R.kind === 'aoe') { lit = new Set(R.hexes); aim = new Set(R.units.map(x => x.pos)); }
          else if (R.kind === 'range') { const shown = R.units.filter(x => BUI.allies || isFoe(x)); lit = new Set(shown.map(x => x.pos)); aim = new Set(shown.filter(x => BUI.targets.includes(x.id)).map(x => x.pos));
