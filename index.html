        body = `${locked ? `<div class="muted">Gorilla Tactics: locked into ${esc(locked)} until it switches out.</div>` : ''}${forcedWhy ? `<div class="muted">${esc(forcedWhy)}</div>` : ''}<div class="movegrid">${list.filter(m => !locked || m === locked).map(m => { const why = forced || struggling ? '' : moveBlockedWhy(b, turnU, m); return `<button class="opt ${why ? 'locked' : ''}" data-move="${esc(m)}" ${why ? 'disabled' : ''}>${moveCardHTML(m, ppPill(turnU, m) + (why ? `<span class="pill">🔒 ${esc(why)}</span>` : chips(m)))}</button>`; }).join('')}</div>
          <div class="row">${noSwitch ? '' : trap ? `<span class="muted">Can't switch: ${esc(trap)}</span>` : `<button class="btn" data-act="switch">⇄ Switch</button>`}<div class="spacer"></div><button class="btn ghost" data-act="skip">End turn without a move</button></div>`;
      }
    }
    turnHTML = `<div class="turnpanel"><div class="row">${monImg(turnU.name, turnU.shiny, 'spr sm')}<div><b style="font-size:1.1rem">${esc(turnU.name)}'s turn</b> ${statusChip(turnU)}<div class="muted" style="font-size:.85rem">${esc(sideName(b, turnU))} · Lv ${turnU.level} · ${hpBar(turnU)}</div></div></div>${turnU.status ? `<div class="banner warn st-note">${esc(statusNote(turnU))}</div>` : ''}${aiPanel}${body}</div>`;
  }

  const order = upcoming(b, 7).map(id => b.units[id]).filter(Boolean);
  const unitRow = u => `<div class="unitrow ${u.fainted ? 'fainted' : ''} ${b.turn?.id === u.id ? 'now' : ''}" ${isDM ? `data-edit="${u.id}"` : ''}>
      <span class="ring" style="border-color:${ringOf(u)}">${monImg(u.name, u.shiny, 'spr xs')}</span>
      <div style="flex:1;min-width:0"><div><b>${esc(u.name)}</b> <span class="muted" style="font-size:.85rem">Lv ${u.level}${u.side === 'p' ? ' · ' + esc(b.names?.[u.owner] || '') : ''}${!u.out && !u.fainted ? ' · bench' : ''}${u.kos ? ` · ${u.kos} KO` : ''}</span> ${statusChip(u)} ${stageChips(u)} ${volChips(b, u)}</div>
        <div class="abil">${abilityHidden(b, u, isDM) ? '<span class="muted">Ability: ?</span>' : `${esc(abil(b, u) || u.ability || '')}${(u.ab?.now && u.ab.now !== u.ability) ? ` <span class="muted">(was ${esc(u.ability)})</span>` : ''} ${abilityTag(abil(b, u) || u.ability)}`}${(isDM || (u.side === 'p' && u.owner === viewer)) && u.illusion ? ` <span class="pill warn">Really ${esc(u.realName)} (Illusion)</span>` : ''} <span class="muted" style="font-size:.8rem">${shownTypes(u, isDM).join(' / ')}</span></div>${hpBar(u)}</div></div>`;
  // Turn meters: each Pokémon's meter filling toward its Order number (the one acting shows full)
  const meterOf = u => { const ord = tierOf(u, b).order; return b.turn?.id === u.id ? { ord, val: ord, pct: 100 } : { ord, val: Math.min(u.meter, ord), pct: Math.min(100, 100 * u.meter / ord) }; };
  const meterRows = fieldUnits(b).map(u => ({ u, m: meterOf(u) })).sort((p, q) => (q.m.pct - p.m.pct) || (p.m.ord - q.m.ord)).map(({ u, m }) =>
    `<div class="meter ${b.turn?.id === u.id ? 'now' : ''}"><span class="ring" style="border-color:${ringOf(u)}">${monImg(u.name, u.shiny, 'spr xs')}</span><span class="nm"><b>${esc(u.name)}</b></span>
      <span class="bar"><i data-meter="${u.id}" data-w="${m.pct.toFixed(1)}" style="width:${(METER_PREV[u.id] ?? m.pct).toFixed(1)}%;background:${ringOf(u)}"></i></span><span class="muted">${b.turn?.id === u.id ? 'Now' : `${m.val}/${m.ord}`}${u.waitOne ? ' · waits' : ''}</span></div>`).join('');
  const shownWild = units.filter(u => u.side === 'w' && (isDM || u.revealed || u.out));   // players only see wild Pokémon once they've been sent out
  const last = b.last;
  const ft = [fieldText(b), timersText(b), (b.hazards || []).length ? `Hazard tiles: ${(b.hazards || []).length}` : ''].filter(Boolean).join(' · ');
  el.innerHTML = `<div class="stack">
    ${ft ? `<div class="fieldbar">${ft}</div>` : ''}
    ${turnHTML}
    ${waits.length ? `<div class="card stack">${waits.join('')}</div>` : ''}
    ${bench.length && !b.over ? `<div class="row"><span class="muted">Wild bench:</span>${bench.map(u => `<button class="chip ${BUI.place === u.id ? 'on' : ''}" data-sendout="${u.id}">${monImg(u.name, false, 'spr xs')}Send out ${esc(u.name)}</button>`).join('')}</div>` : ''}
    ${b.noMap ? '' : `${hint ? `<div class="hint">${esc(hint)}</div>` : ''}<svg class="board" id="bboard"></svg>`}
    ${order.length && b.started && !b.over ? `<div class="row orderstrip"><span class="muted">Up next:</span>${order.map((u, i) => `<span class="chip ${i === 0 ? 'on' : ''}"><span class="sw" style="background:${ringOf(u)}"></span>${esc(u.name)}</span>`).join('')}</div>
      <div class="meters card">${meterRows}</div>` : ''}
    ${last ? `<details class="card"><summary><b>${esc(last.who)}</b> used <b>${esc(last.move)}</b> — damage details</summary><div class="muted" style="font-size:.9rem;margin-top:8px">${last.lines.map(esc).join('<br>') || 'No damage roll.'}</div></details>` : ''}
    <div class="grid">
      <div class="card stack" style="--gap:6px"><h2 style="margin:0">Players</h2>${units.filter(u => u.side === 'p').map(unitRow).join('')}</div>
      <div class="card stack" style="--gap:6px"><h2 style="margin:0">Wild</h2>${shownWild.map(unitRow).join('') || '<div class="muted">None revealed yet.</div>'}</div>
    </div>
    <div class="card"><h2>Battle log</h2><div class="log">${(b.log || []).slice(-14).reverse().map(l => `<div>${esc(l)}</div>`).join('')}</div>
      <div class="muted" style="font-size:.8rem;margin-top:8px">Abilities and moves tagged "Not automated" are applied by hand (DM: tap a Pokémon to edit it).</div></div>
    ${isDM ? `<div class="row">${!b.started ? `<button class="btn primary" data-act="startturns">▶ Start turns</button>` : ''}<div class="spacer"></div>
      <button class="btn small ghost" data-act="restart">↺ Restart mission</button>
      ${b.over ? `<button class="btn primary" data-act="finish">Finish mission ▶</button>` : `<button class="btn small ghost" data-act="endbattle">End battle</button>`}</div>` : ''}
  </div>`;

  if (!b.noMap) renderBoard(el.querySelector('#bboard'), {
    cells: mis.cells, blocked: mis.blocked, starts: mis.starts, wilds: mis.wilds, reach: lit, aim,
    selected: turnU?.pos && turnU.pos !== 'table' ? turnU.pos : null,
    units: units.filter(u => onField(b, u)).map(u => ({ key: u.pos, img: spriteUrl(getPokemon(u.name), u.shiny), ring: ringOf(u), hp: u.hp / u.maxHp, mine: u.side === 'p' && u.owner === viewer, status: u.status, hidden: !!(u.v?.charging && SEMI_INVULN[u.v.charging.move]) })),

// Power cap by the Pokémon's level: 1–20 → 60, 21–30 → 70, 31–40 → 80, 41–50 → 100, 51+ → any.

// ---- Router: the part of the address after # decides the screen ----
function route() {
  unwatch?.(); unwatch = null; BUI = {};
  window.scrollTo(0, 0);
  const h = location.hash || '#/';
  let m;
  if (h === '#/' || h === '#') return screenHome();
  if (h === '#/new') return screenNew();
  if ((m = h.match(/^#\/c\/([^/]+)$/))) return screenWho(m[1], false);
  if ((m = h.match(/^#\/c\/([^/]+)\/who$/))) { localStorage.removeItem(myIdKey(m[1])); return screenWho(m[1], true); }
  if ((m = h.match(/^#\/c\/([^/]+)\/dm$/))) return screenDM(m[1]);
  if ((m = h.match(/^#\/c\/([^/]+)\/dm\/map$/))) return screenMapSetup(m[1]);
  if ((m = h.match(/^#\/c\/([^/]+)\/p\/([^/]+)$/))) return screenPlayer(m[1], m[2]);
  if ((m = h.match(/^#\/c\/([^/]+)\/p\/([^/]+)\/setup\/([^/]+)$/))) return screenSetup(m[1], m[2], m[3]);
  screenHome();
}

// ═══ 6. HEX GRID ═══════════════════════════════════════════════════════
// Hexes use "axial" coordinates (q, r) and are saved as text keys like "3,-1".
const hk = ([q, r]) => q + ',' + r;
const hexDist = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r));
const offsetToAxial = (col, row) => [col - (row - (row & 1)) / 2, row];
function hexShape(shape, p) {
  const out = [];
  if (shape === 'rectangle' || shape === 'corridor' || shape === 'custom') {
    for (let row = 0; row < p.h; row++) for (let col = 0; col < p.w; col++) out.push(offsetToAxial(col, row));
  } else if (shape === 'hexagon' || shape === 'ring') {
    const R = p.r, hole = shape === 'ring' ? Math.min(p.hole, R) : 0;
    for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) { const d = hexDist(q, r); if (d <= R && d >= hole) out.push([q, r]); }
  } else if (shape === 'diamond') {
    for (let r = 0; r < p.h; r++) for (let q = 0; q < p.w; q++) out.push([q, r]);
  } else if (shape === 'cross') {
    const n = 2 * p.arm + p.aw;
    for (let row = 0; row < n; row++) for (let col = 0; col < n; col++)
      if ((col >= p.arm && col < p.arm + p.aw) || (row >= p.arm && row < p.arm + p.aw)) out.push(offsetToAxial(col, row));
  }
  return out;
}
// Draws a map into an <svg>. o = { cells, ghosts, blocked, starts, symbols{typeId:key},
// tokens{playerId:key}, players, colorOf, selected, mine, reach (Set of hexes to light up), wilds, units[{key,img,ring,hp,mine}] }. onTap(key) runs when a hex is tapped.
// Board pictures come from a local copy of each image (downloaded once). Phones (iPhone Safari especially) sometimes
// skip painting a remote picture inside a board that was just redrawn; a local copy paints reliably.
const SPRITE_COPIES = new Map();   // url → local object URL, or a Promise while it downloads
function boardPic(url, whenReady) {
  if (!url) return url;
  let v = SPRITE_COPIES.get(url);
  if (typeof v === 'string') return v;
  if (!v) { v = fetch(url).then(r => r.ok ? r.blob() : Promise.reject(new Error(r.status))).then(bl => URL.createObjectURL(bl)).catch(() => url)
    .then(local => { SPRITE_COPIES.set(url, local); return local; }); SPRITE_COPIES.set(url, v); }
  v.then(whenReady);
  return url;   // the remote picture for now; the board redraws once the local copy is ready
}
function renderBoard(svg, o, onTap) {
  const again = () => { if (svg._again !== again || !svg.isConnected || svg._queued) return; svg._queued = true; requestAnimationFrame(() => { svg._queued = false; if (svg._again === again && svg.isConnected) renderBoard(svg, o, onTap); }); };
  svg._again = again;
  const pic = url => boardPic(url, again);
  const S = 10, W = Math.sqrt(3) * S;
  const xy = key => { const [q, r] = key.split(',').map(Number); return [W * (q + r / 2), 1.5 * S * r]; };
  const corner = (s, i) => { const a = Math.PI / 180 * (60 * i - 30); return [s * Math.cos(a), s * Math.sin(a)]; };
  const poly = (x, y, s) => [0, 1, 2, 3, 4, 5].map(i => corner(s, i)).map(([a, b]) => (x + a).toFixed(2) + ',' + (y + b).toFixed(2)).join(' ');
  const all = [...(o.cells || []), ...(o.ghosts || [])];
  if (!all.length) { svg.innerHTML = ''; return; }
  const pts = all.map(xy), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs) - W, minY = Math.min(...ys) - S * 1.3;
  const vw = Math.max(...xs) - minX + W, vh = Math.max(...ys) - minY + S * 1.3;
  svg.setAttribute('viewBox', `${minX} ${minY} ${vw} ${vh}`);
  svg.style.aspectRatio = `${vw} / ${vh}`;   // the box takes the map's own proportions (no empty bands)
  const blocked = new Set(o.blocked || []), starts = new Set(o.starts || []), wilds = new Set(o.wilds || []);
  let h = `<defs><clipPath id="tclip"><circle cx="22" cy="22" r="21"/></clipPath></defs>`;
  for (const k of o.ghosts || []) { const [x, y] = xy(k); h += `<g data-k="${k}"><polygon class="cell ghost" points="${poly(x, y, S * .96)}"/></g>`; }
  for (const k of o.cells || []) { const [x, y] = xy(k); h += `<g data-k="${k}"><polygon class="cell${blocked.has(k) ? ' blocked' : o.aim?.has(k) ? ' aim' : o.reach?.has(k) ? ' reach' : starts.has(k) ? ' start' : wilds.has(k) ? ' wild' : ''}" points="${poly(x, y, S * .96)}"/></g>`; }
  for (const t of o.tiles || []) {   // hazard tiles: a small marker in the setter's color, with layers
    const [x, y] = xy(t.key);
    h += `<g class="tile"><circle cx="${x - 5.2}" cy="${y + 4.6}" r="3" fill="var(--surface)" stroke="${t.color}" stroke-width=".7"/><text x="${x - 5.2}" y="${y + 5.6}" style="font-size:3.4px;text-anchor:middle;fill:${t.color}">${esc(t.text)}</text></g>`;
  }
  for (const [t, k] of Object.entries(o.symbols || {})) {   // type icons: the left (symbol) part of PokeAPI's label art, clipped round
    const [x, y] = xy(k), d = S * 1.35;
    h += `<svg class="sym" x="${x - d / 2}" y="${y - d / 2}" width="${d}" height="${d}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" class="symbg"/><image href="${pic(typeIconUrl(t))}" width="200" height="44" clip-path="url(#tclip)"/></svg>`;
  }
  const inits = initialsOf(o.players || []);
  for (const [pid, k] of Object.entries(o.tokens || {})) {
    if (!k || !(o.players || []).some(p => p.id === pid)) continue;
    const [x, y] = xy(k), two = inits[pid].length > 1;
    h += `<g class="tok${pid === o.mine ? ' mine' : ''}"><polygon points="${poly(x, y, S * .9)}" fill="${o.colorOf(pid)}"/><text x="${x}" y="${y + .3}" style="font-size:${two ? 6.5 : 9}px">${esc(inits[pid])}</text></g>`;
  }
  let badges = '';   // status tags go on top of everything
  for (const u of o.units || []) {   // battle tokens: the Pokémon's picture, a ring in its trainer's color, and an HP bar
    if (!u.key || u.key === 'table') continue;
    const [x, y] = xy(u.key), w = S * 1.5;
    h += `<g class="unit${u.mine ? ' mine' : ''}"${u.hidden ? ' style="opacity:.45"' : ''}><polygon points="${poly(x, y, S * .9)}" class="ubg" style="stroke:${u.ring}"/>${u.img ? `<image href="${pic(u.img)}" x="${x - w / 2}" y="${y - w / 2 - 1}" width="${w}" height="${w}"/>` : ''}
      <rect x="${x - 6}" y="${y + 5.6}" width="12" height="1.8" rx=".9" class="hpbg"/><rect x="${x - 6}" y="${y + 5.6}" width="${(12 * Math.max(0, u.hp)).toFixed(2)}" height="1.8" rx=".9" fill="${u.hp > .5 ? 'var(--ok)' : u.hp > .2 ? '#e0a400' : 'var(--bad)'}"/></g>`;
    if (u.status && STATUS_COLOR[u.status]) badges += `<g class="stbadge"><rect x="${x + 1.2}" y="${y - 9}" width="9" height="4.4" rx="1.4" fill="${STATUS_COLOR[u.status][0]}" stroke="${STATUS_COLOR[u.status][1]}" stroke-width=".35"/><text x="${x + 5.7}" y="${y - 6.75}" fill="${STATUS_COLOR[u.status][1]}">${STATUS_SHORT[u.status]}</text></g>`;
  }
  if (o.selected) { const [x, y] = xy(o.selected); h += `<polygon class="sel" points="${poly(x, y, S * 1.02)}"/>`; }
  h += badges;
  svg.innerHTML = h;
  svg.onclick = onTap ? e => { const g = e.target.closest('[data-k]'); if (g) onTap(g.dataset.k); } : null;
  svg.classList.toggle('tappable', !!onTap);
}

// ═══ 7. START-UP ═══════════════════════════════════════════════════════
applyPrefs();
window.addEventListener('hashchange', route);
(async () => {
  try {
    DB = LOCAL_MODE ? makeLocalDB() : await makeFirebaseDB();
    await DB.check();
    const n = dataOK() ? POKEDEX_DATA.length.toLocaleString() + ' Pokémon' : 'no game data';
    setStatus('ok', DB.kind, ` connected · ${n}`);
  } catch (e) {
    setStatus('bad', 'Not connected');
    app.innerHTML = `<div class="banner bad"><b>Couldn't reach Firebase.</b><br>${esc(e.code || e.message)}<br><span class="muted">Check the internet connection. If it says "permission-denied", the database rules need updating.</span></div>`;
    return;
  }
  route();
})();
</script>
</body>
