<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pokemon Table</title>
<!--
  index.html — the Pokemon Table game.
  Sections (search for the ═══ banners):
    1. LOOK & FEEL (styles)
    2. PAGE SKELETON (the screens)
    3. DATA (the converter's files in /data)
    4. STORAGE (Firebase, plus a local test mode)
    5. SCREENS (what each screen shows and does)
    6. HEX GRID (map shapes and drawing the board)
    7. START-UP
-->
<style>
/* ═══ 1. LOOK & FEEL ═══════════════════════════════════════════════════
   Colors are "tokens" so light and dark mode just swap the values.
   Auto mode follows the device; Settings can force light or dark.     */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #eef1f6; --ink: #151b26; --muted: #5f6b7e;
  --line: #dde2ea; --accent: #e3350d; --accent-ink: #ffffff; --accent-soft: #fde8e2;
  --ok: #1e8e4e; --ok-soft: #e3f4ea; --bad: #c62828; --bad-soft: #fde7e7; --warn-soft: #fff5dd;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.06);
  --radius: 16px; --text: 17px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #171d27; --surface-2: #202835; --ink: #eef2f8; --muted: #9aa6b8;
    --line: #2a3443; --accent: #ff5a36; --accent-soft: #3a1d17; --ok: #45c47c; --ok-soft: #15301f;
    --bad: #ff6b6b; --bad-soft: #3a1b1b; --warn-soft: #34290f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171d27; --surface-2: #202835; --ink: #eef2f8; --muted: #9aa6b8;
  --line: #2a3443; --accent: #ff5a36; --accent-soft: #3a1d17; --ok: #45c47c; --ok-soft: #15301f;
  --bad: #ff6b6b; --bad-soft: #3a1b1b; --warn-soft: #34290f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: var(--text); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; line-height: 1.5; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { padding-top: 12px; padding-bottom: 12px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 1.15rem; letter-spacing: -.01em; cursor: pointer; }
.ball { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(var(--accent) 0 46%, var(--ink) 46% 54%, var(--surface) 54%); border: 2px solid var(--ink); position: relative; flex: none; }
.ball::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.spacer { flex: 1; }
h1 { font-size: 1.7rem; letter-spacing: -.02em; margin: 6px 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 16px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.15rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); font-size: .85rem; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: #e0a400; }
label.field { display: block; }
label.field > span { display: block; font-weight: 650; margin-bottom: 6px; }
input[type=text], input[type=number], select { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.camp { cursor: pointer; transition: transform .08s, border-color .15s; }
.camp:hover { border-color: var(--accent); transform: translateY(-1px); }
.camp h3 { margin: 0 0 4px; font-size: 1.1rem; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.who { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.who button { min-height: 96px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-size: 1.15rem; font-weight: 700; cursor: pointer; }
.who button:hover { border-color: var(--accent); }
.who small { display: block; font-weight: 500; color: var(--muted); font-size: .85rem; }
.banner { padding: 12px 16px; border-radius: 12px; }
.banner.bad { background: var(--bad-soft); } .banner.ok { background: var(--ok-soft); } .banner.warn { background: var(--warn-soft); }
.story { font-size: 1.12rem; line-height: 1.7; max-width: 70ch; }
.story p { margin: 0 0 1em; }
.story .part { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 18px 0 6px; }
.mission-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mission-num { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.hexprev { width: 100%; height: 220px; background: var(--surface-2); border-radius: 12px; }
.hexprev polygon { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.modal { position: fixed; inset: 0; background: rgba(5,10,20,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal.open { display: flex; }
.modal .card { width: 100%; max-width: 460px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; }
.list-row { display: flex; gap: 8px; align-items: center; }
.list-row input { flex: 1; }
/* Map board */
.board { width: 100%; height: auto; max-height: 72vh; background: var(--surface-2); border-radius: 12px; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.board.mini { height: 150px; aspect-ratio: auto !important; pointer-events: none; }
.board.tappable g[data-k] { cursor: pointer; }
.board .cell { fill: var(--surface); stroke: var(--line); stroke-width: .8; }
.board.tappable g[data-k]:hover .cell { stroke: var(--muted); }
.board .cell.blocked { fill: var(--ink); opacity: .72; }
.board .cell.start { fill: var(--ok-soft); stroke: var(--ok); }
.board .cell.ghost { fill: transparent; stroke: var(--muted); stroke-dasharray: 1.5 1.5; opacity: .55; }
.board .sym, .board .tok { pointer-events: none; }
.board .symbg { fill: var(--surface); }
.board .tok polygon { stroke: rgba(0,0,0,.35); stroke-width: .8; }
.board .tok.mine polygon { stroke: var(--ink); stroke-width: 1.6; }
.board .tok text { fill: #fff; font-weight: 800; text-anchor: middle; dominant-baseline: central; font-family: inherit; }
.board .sel { fill: none; stroke: var(--accent); stroke-width: 2.2; pointer-events: none; }
.sw { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; color: #fff; font-weight: 800; font-size: .85rem; flex: none; }
.sw.big { width: 44px; height: 44px; font-size: 1.2rem; border-radius: 12px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.swatch { width: 44px; height: 44px; border-radius: 12px; border: 3px solid transparent; cursor: pointer; }
.swatch.on { border-color: var(--ink); }
.swatch:disabled { opacity: .25; cursor: not-allowed; }
.tbadge { display: inline-block; width: 30px; height: 30px; border-radius: 50%; background-size: auto 100%; background-position: left center; background-repeat: no-repeat; flex: none; vertical-align: middle; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .9rem; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
.legend .start { background: var(--ok-soft); border-color: var(--ok); } .legend .blocked { background: var(--ink); opacity: .72; } .legend .ghost { border-style: dashed; border-color: var(--muted); }
.board .cell.reach { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.turnbar { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.chip.done { opacity: .5; }
.rollnum { font-size: 1.3rem; color: var(--accent); }
.yourturn { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; padding: 14px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent-soft); }
.dice-card { max-width: 520px !important; }
.dice-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; padding: 8px 0; }
.die { width: 92px; height: 92px; border-radius: 18px; background: var(--surface-2); border: 2px solid var(--line); display: grid; place-items: center; align-content: center; gap: 2px; }
.die small { color: var(--muted); font-weight: 700; } .die b { font-size: 2.2rem; line-height: 1; }
.pips { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.pips button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.pips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.total { font-size: 1.1rem; text-align: right; } .total b { font-size: 1.5rem; }
.spr { width: 72px; height: 72px; object-fit: contain; flex: none; }
.spr.sm { width: 48px; height: 48px; } .spr.big { width: 112px; height: 112px; }
.moncard { display: flex; gap: 14px; align-items: center; }
.mini-mon { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: var(--surface-2); }
.picklist { display: grid; gap: 6px; }
.pickrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); }
.pickrow.now { outline: 2px solid var(--accent); background: var(--accent-soft); }
.pickgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.pickcard { display: grid; justify-items: center; gap: 2px; padding: 12px 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: center; }
.pickcard:hover { border-color: var(--accent); }
.pickcard small { color: var(--muted); font-size: .78rem; }
.types { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
.tchip { font-style: normal; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.steps span { padding: 4px 12px; border-radius: 999px; background: var(--surface-2); font-size: .85rem; font-weight: 600; color: var(--muted); }
.steps span.on { background: var(--accent); color: var(--accent-ink); } .steps span.done { color: var(--ok); }
table.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.stats th, table.stats td { padding: 7px 6px; text-align: center; border-bottom: 1px solid var(--line); }
table.stats th:first-child { text-align: left; white-space: nowrap; }
table.stats thead th { font-size: .78rem; color: var(--muted); font-weight: 700; }
table.stats tr.up { background: var(--ok-soft); } table.stats tr.down { background: var(--bad-soft); }
.up { color: var(--ok); font-weight: 700; } .down { color: var(--bad); font-weight: 700; }
.optgrid { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
.opt { display: grid; gap: 2px; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; width: 100%; }
.opt small { color: var(--muted); font-size: .78rem; font-weight: 600; } .opt b { font-size: 1.05rem; } .opt span { font-size: .88rem; }
.opt.on { border: 2px solid var(--accent); background: var(--accent-soft); }
.opt.wide { grid-template-columns: 1fr; }
@media (max-width: 560px) { .optgrid { grid-template-columns: 1fr; } table.stats th, table.stats td { padding: 6px 3px; font-size: .9rem; } }
.board .cell.wild { fill: color-mix(in srgb, #8e24aa 14%, var(--surface)); stroke: #8e24aa; }
.legend .wild { background: color-mix(in srgb, #8e24aa 14%, var(--surface)); border-color: #8e24aa; }
.board .unit { pointer-events: none; } .board .ubg { fill: var(--surface); stroke-width: 1.6; } .board .unit.mine .ubg { stroke-width: 2.4; }
.board .hpbg { fill: rgba(0,0,0,.25); }
.spr.xs { width: 32px; height: 32px; }
.wildgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.wildcard { display: grid; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); opacity: .75; }
.wildcard.on { opacity: 1; border: 2px solid #8e24aa; background: var(--surface); }
.statline { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .82rem; color: var(--muted); } .statline b { color: var(--ink); }
.partyrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); opacity: .6; }
.partyrow.on { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
.icon-btn.star { color: #e0a400; font-size: 1.4rem; }
.turnpanel { display: grid; gap: 12px; padding: 16px; border-radius: var(--radius); border: 2px solid var(--accent); background: var(--surface); box-shadow: var(--shadow); }
.turnnow { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 12px; background: var(--surface-2); }
.movegrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.targets { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.target { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.target.on { border: 2px solid var(--accent); background: var(--accent-soft); }
.target .types { justify-content: flex-start; }
.eff { font-size: .8rem; font-weight: 700; margin-top: 2px; } .eff.e2, .eff.e4 { color: var(--ok); } .eff.e05, .eff.e025 { color: #c77700; } .eff.e0 { color: var(--bad); }
.hpbar { display: inline-block; width: 110px; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; vertical-align: middle; border: 1px solid var(--line); }
.hpbar i { display: block; height: 100%; } .hpnum { font-size: .8rem; margin-left: 6px; font-variant-numeric: tabular-nums; }
.unitrow { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 12px; }
.unitrow[data-edit] { cursor: pointer; } .unitrow[data-edit]:hover { background: var(--surface-2); }
.unitrow.now { background: var(--accent-soft); } .unitrow.fainted { opacity: .45; }
.ring { display: inline-flex; border: 3px solid; border-radius: 12px; padding: 1px; flex: none; }
.log { display: grid; gap: 4px; font-size: .92rem; max-height: 260px; overflow: auto; }
.orderstrip { font-size: .9rem; } .hint { font-weight: 600; color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: #8a5a00; font-weight: 600; white-space: normal; }
.pill.up { background: var(--ok-soft); } .pill.down { background: var(--bad-soft); }
.pill.st-brn { background: #ffd9c7; color: #a33a00; } .pill.st-par { background: #fff1b8; color: #7a6000; } .pill.st-psn, .pill.st-tox { background: #ead7f7; color: #6a1b9a; }
.pill.st-slp { background: #dfe4ea; color: #445; } .pill.st-frz { background: #d4f1fb; color: #01579b; }
.stagegrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.stagegrid > div { display: flex; align-items: center; gap: 6px; } .stagegrid span { width: 56px; font-weight: 650; font-size: .85rem; } .stagegrid b { width: 28px; text-align: center; }
.modal-card { max-width: 640px !important; max-height: 92vh; overflow: auto; }
.tchip.t-Normal{background:#a8a77a;color:#fff}.tchip.t-Fire{background:#ee8130;color:#fff}.tchip.t-Water{background:#6390f0;color:#fff}.tchip.t-Electric{background:#f7d02c;color:#333}.tchip.t-Grass{background:#7ac74c;color:#fff}.tchip.t-Ice{background:#96d9d6;color:#234}.tchip.t-Fighting{background:#c22e28;color:#fff}.tchip.t-Poison{background:#a33ea1;color:#fff}.tchip.t-Ground{background:#e2bf65;color:#333}.tchip.t-Flying{background:#a98ff3;color:#fff}.tchip.t-Psychic{background:#f95587;color:#fff}.tchip.t-Bug{background:#a6b91a;color:#fff}.tchip.t-Rock{background:#b6a136;color:#fff}.tchip.t-Ghost{background:#735797;color:#fff}.tchip.t-Dragon{background:#6f35fc;color:#fff}.tchip.t-Dark{background:#705746;color:#fff}.tchip.t-Steel{background:#b7b7ce;color:#333}.tchip.t-Fairy{background:#d685ad;color:#fff}
.fieldbar { padding: 10px 14px; border-radius: 12px; background: linear-gradient(90deg, var(--warn-soft), var(--surface-2)); font-weight: 700; }
.abil { font-size: .8rem; color: var(--muted); }
details.card > summary { cursor: pointer; list-style: revert; }
#status, .brand { white-space: nowrap; }
#status { min-width: 0; overflow: hidden; }
@media (max-width: 560px) { .wide-only { display: none; } .two { grid-template-columns: 1fr; } h1 { font-size: 1.45rem; } .mission-num { font-size: 2rem; } }
</style>
</head>

<!-- ═══ 2. PAGE SKELETON ═════════════════════════════════════════════ -->
<header class="topbar">
  <div class="wrap">
    <div class="brand" onclick="go('#/')"><div class="ball"></div>Pokemon Table</div>
    <div class="spacer"></div>
    <span class="pill" id="status"><span class="dot wait"></span>Starting…</span>
    <button class="icon-btn" title="Settings" onclick="openSettings()">⚙︎</button>
  </div>
</header>
<main class="wrap" id="app"></main>

<div class="modal" id="settings" onclick="if(event.target===this)closeSettings()">
  <div class="card stack">
    <h2>Settings (this device)</h2>
    <div><div class="muted" style="margin-bottom:6px">Appearance</div>
      <div class="seg" id="themeSeg"></div></div>
    <div><div class="muted" style="margin-bottom:6px">Text size</div>
      <div class="seg" id="sizeSeg"></div></div>
    <div class="row"><div class="spacer"></div><button class="btn primary" onclick="closeSettings()">Done</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- ═══ 3. DATA — files made by converter.html, uploaded to /data ═══════ -->
<script src="data/pokedex.js"></script>
<script src="data/lines.js"></script>
<script src="data/story.js"></script>
<script src="data/starters.js"></script>
<script src="data/looks.js"></script>
<script src="data/moves.js"></script>
<script src="data/abilities.js"></script>
<script src="data/movepool.js"></script>

// Add ?local to the address to use a pretend database stored only on this device —
// handy for testing screens without touching the real data.

const firebaseConfig = {

  authDomain: "pokemon-table-jdh.firebaseapp.com",
  projectId: "pokemon-table-jdh",

// Both storage types offer the same small set of actions on "paths" such as
//   campaigns/abc            (one campaign)
//   campaigns/abc/missions/0 (that campaign's Mission 0: its map copy and token spots)
//   maps/xyz                 (one map in the shared library)
// update() accepts dotted names like "tokens.p1" to change one piece without touching the
// rest — that's what lets two phones move two tokens at the same moment safely.
function makeLocalDB() {
  const KEY = 'pt-local-db';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const listeners = new Set();
  const write = all => { localStorage.setItem(KEY, JSON.stringify(all)); setTimeout(() => listeners.forEach(f => f())); };   // tell screens after the current tap finishes, like Firebase
  window.addEventListener('storage', e => { if (e.key === KEY) listeners.forEach(f => f()); }); // other tabs
  const DEL = { __delete: true };

  const setDotted = (obj, dotted, val) => {
    const ks = dotted.split('.'); let o = obj;
    ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
    if (val === DEL) delete o[ks.at(-1)]; else o[ks.at(-1)] = val;
  };
  const watch = f => { listeners.add(f); f(); return () => listeners.delete(f); };

    kind: 'Test mode', DEL,
    async check() { return true; },
    watchCol(col, cb) { return watch(() => { const all = read(); cb(Object.keys(all).filter(p => isChild(p, col)).map(p => ({ id: p.split('/').pop(), ...all[p] }))); }); },
    watchDoc(path, cb) { return watch(() => { const d = read()[path]; cb(d ? { id: path.split('/').pop(), ...d } : null); }); },
    async add(col, data) { const all = read(); const id = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); all[col + '/' + id] = { ...data, createdAt: Date.now() }; write(all); return id; },
    async set(path, data) { const all = read(); all[path] = { ...data, createdAt: Date.now() }; write(all); },
    async update(path, patch) { const all = read(); if (!all[path]) throw new Error('not-found'); for (const [k, v] of Object.entries(patch)) setDotted(all[path], k, v); write(all); },
    async remove(path) { const all = read(); delete all[path]; write(all); }
  };
}
async function makeFirebaseDB() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const { initializeApp } = await import(base + 'firebase-app.js');
  const fs = await import(base + 'firebase-firestore.js');

  const ref = path => fs.doc(db, path);

    kind: 'Firebase', DEL: fs.deleteField(),
    async check() { await fs.getDocs(fs.query(fs.collection(db, 'campaigns'), fs.limit(1))); return true; },
    watchCol(col, cb) { return fs.onSnapshot(fs.collection(db, col), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), fail); },
    watchDoc(path, cb) { return fs.onSnapshot(ref(path), d => cb(d.exists() ? { id: d.id, ...d.data() } : null), fail); },
    async add(col, data) { return (await fs.addDoc(fs.collection(db, col), { ...data, createdAt: fs.serverTimestamp() })).id; },
    async set(path, data) { await fs.setDoc(ref(path), { ...data, createdAt: fs.serverTimestamp() }); },
    async update(path, patch) { await fs.updateDoc(ref(path), patch); },
    async remove(path) { await fs.deleteDoc(ref(path)); }
  };
}

// ---- Dice: one roll screen for every roll in the game ----
// rollDice({ title, dice: [6, 12, 20], mode: 'app' | 'physical' }) opens the roll screen and
// resolves to { values: [...], total } — or null if closed before rolling.
//   App dice: the app rolls (using the browser's secure random numbers); once rolled it's final.
//   Physical dice: the player taps what each real die shows (D100 gets a number box).
const randInt = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
function rollDice({ title, dice, mode, showTotal = true }) {

    const wrap = document.createElement('div'); wrap.className = 'modal open';
    document.body.appendChild(wrap);
    const close = res => { wrap.remove(); resolve(res); };
    const full = () => vals.every(v => v);
    const total = () => vals.reduce((a, b) => a + (b || 0), 0);
    const draw = () => {
      const app_ = mode === 'app';
      wrap.innerHTML = `<div class="card stack dice-card">
        <div class="row"><h2 style="margin:0">${esc(title)}</h2><div class="spacer"></div>${rolled ? '' : '<button class="icon-btn" data-x title="Close">✕</button>'}</div>
        <div class="muted">${dice.map(d => 'D' + d).join(' + ')} · ${app_ ? 'App dice' : 'Physical dice — tap what each die shows'}</div>
        ${app_ ? `<div class="dice-row">${dice.map((d, i) => `<div class="die"><small>D${d}</small><b data-face="${i}">${vals[i] ?? '?'}</b></div>`).join('')}</div>`
          : dice.map((d, i) => `<div><div style="font-weight:650;margin-bottom:6px">D${d}</div>${d <= 20
              ? `<div class="pips">${Array.from({ length: d }, (_, n) => `<button data-i="${i}" data-n="${n + 1}" aria-pressed="${vals[i] === n + 1}">${n + 1}</button>`).join('')}</div>`
              : `<input type="number" inputmode="numeric" min="1" max="${d}" data-in="${i}" value="${vals[i] ?? ''}" placeholder="1–${d}">`}</div>`).join('')}
        ${dice.length > 1 && showTotal ? `<div class="total">Total <b id="diceTotal">${full() ? total() : '–'}</b></div>` : ''}
        <div class="row"><div class="spacer"></div>${app_
          ? (rolled ? `<button class="btn primary" data-ok>OK</button>` : `<button class="btn primary" data-roll ${rolling ? 'disabled' : ''}>🎲 Roll</button>`)
          : `<button class="btn primary" data-ok ${full() ? '' : 'disabled'}>Use this roll</button>`}</div>
      </div>`;
      wrap.querySelector('[data-x]')?.addEventListener('click', () => close(null));
      wrap.querySelector('[data-ok]')?.addEventListener('click', () => full() && close({ values: [...vals], total: total() }));
      wrap.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { vals[+b.dataset.i] = +b.dataset.n; draw(); });
      wrap.querySelectorAll('[data-in]').forEach(inp => inp.oninput = () => {
        const d = dice[+inp.dataset.in], v = parseInt(inp.value);
        vals[+inp.dataset.in] = v >= 1 && v <= d ? v : null;
        wrap.querySelector('[data-ok]').disabled = !full();
        const t = wrap.querySelector('#diceTotal'); if (t) t.textContent = full() ? total() : '–';
      });
      wrap.querySelector('[data-roll]')?.addEventListener('click', () => {   // short tumble, then the real result
        rolling = true; draw();
        const faces = [...wrap.querySelectorAll('[data-face]')];
        let n = 0; const spin = setInterval(() => {
          faces.forEach((f, i) => f.textContent = 1 + randInt(dice[i]));
          if (++n >= 10) { clearInterval(spin); dice.forEach((d, i) => vals[i] = 1 + randInt(d)); rolled = true; rolling = false; draw(); }
        }, 60);
      });
    };
    draw();
  });
}

// ---- Turns on the map (Mission 0 chase) ----
// mission.chase = { active, round, order: [playerIds], turn: position in order, roll: number|null, last: text }
// Each round the order is shuffled. On your turn you roll a D4 and move up to that many hexes:
// you may pass through other tokens but not blocked hexes, and you can't stop on a token.
const NEIGHBORS = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]];
function reachable(mis, pid, steps) {
  const start = mis.tokens?.[pid]; if (!start) return new Set();
  const cells = new Set(mis.cells), blocked = new Set(mis.blocked || []);
  const seen = new Set([start]); let frontier = [start];
  for (let s = 0; s < steps; s++) {
    const next = [];
    for (const k of frontier) {
      const [q, r] = k.split(',').map(Number);
      for (const [dq, dr] of NEIGHBORS) {
        const n = (q + dq) + ',' + (r + dr);
        if (!seen.has(n) && cells.has(n) && !blocked.has(n)) { seen.add(n); next.push(n); }
      }
    }
    frontier = next;
  }
  seen.delete(start);
  return new Set([...seen].filter(k => canStand(mis, k, pid)));
}
const shuffle = list => { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nameOf = (c, pid) => (c.players || []).find(p => p.id === pid)?.name || '?';
const stillChasing = (mis, found, pid) => !!mis.tokens?.[pid] && Object.values(found).filter(p => p === pid).length < 2;
function advanceTurn(c, mis, found) {   // the changes that hand the turn to the next player
  const ch = mis.chase, ok = pid => stillChasing(mis, found, pid);
  if (!Object.keys(mis.symbols || {}).some(t => !found[t])) return { 'chase.active': false, 'chase.roll': null, 'chase.last': 'Every type symbol has been reached.' };
  let i = ch.turn + 1;
  while (i < ch.order.length && !ok(ch.order[i])) i++;
  if (i < ch.order.length) return { 'chase.turn': i, 'chase.roll': null };
  const pool = shuffle((c.players || []).map(p => p.id).filter(ok));      // end of round: new random order
  if (!pool.length) return { 'chase.active': false, 'chase.roll': null, 'chase.last': 'Everyone has reached 2 types.' };
  return { 'chase.order': pool, 'chase.turn': 0, 'chase.round': ch.round + 1, 'chase.roll': null };
}
function chaseMove(c, mis, pid, key) {   // a turn's move: token, any claimed symbol, and the next turn
  const { patch, claimed } = movePatch(mis, pid, key);
  const found = { ...(mis.found || {}), ...(claimed ? { [claimed]: pid } : {}) };
  patch['chase.last'] = `${nameOf(c, pid)} moved${claimed ? ` and reached ${TYPES[claimed - 1]}` : ''}.`;
  return { patch: { ...patch, ...advanceTurn(c, mis, found) }, claimed };
}
function chaseBar(c, mis, viewer) {     // round, order and whose turn it is (DM and phones)
  const ch = mis.chase; if (!ch) return '';
  if (!ch.active) return ch.last ? `<div class="banner ok"><b>Chase over.</b> ${esc(ch.last)}</div>` : '';
  const now = ch.order[ch.turn], inits = initialsOf(c.players || []);
  return `<div class="turnbar">
    <div class="row"><b>Round ${ch.round}</b><span class="muted">· order is reshuffled every round</span></div>
    <div class="row">${ch.order.map((pid, i) => `<span class="chip ${i === ch.turn ? 'on' : ''} ${i < ch.turn ? 'done' : ''}"><span class="sw" style="background:${colorOf(c, pid)}">${esc(inits[pid])}</span>${esc(nameOf(c, pid))}${pid === viewer ? ' (you)' : ''}</span>`).join('<span class="muted">›</span>')}</div>
    <div>${ch.roll ? `<b>${esc(nameOf(c, now))}</b> rolled <b class="rollnum">${ch.roll}</b> — move up to ${ch.roll} hex${ch.roll > 1 ? 'es' : ''}.` : `Waiting for <b>${esc(nameOf(c, now))}</b> to roll.`}
      ${ch.last ? `<span class="muted"> Last: ${esc(ch.last)}</span>` : ''}</div>
  </div>`;
}

}

// ---- Map setup: pick from the library, edit a copy, or build a new one ----
function screenMapSetup(cid) {
  let c = null, view = 'library', ed = null, libUnwatch = null;
  unwatch = () => libUnwatch?.();
  const m = () => c.mission ?? 0;
  const freshEditor = (src) => {
    const shape = src?.shape || 'rectangle';
    const params = {};
    for (const [k, s] of Object.entries(SHAPES)) params[k] = Object.fromEntries(s.fields.map(f => [f[0], f[2]]));
    if (src?.params) params[shape] = { ...params[shape], ...src.params };
    ed = {
      fromId: src?.id || null, fromName: src?.name || '', name: src?.name || `Mission ${m()} map`, shape, params,
      cells: new Set(src?.cells || hexShape(shape, params[shape]).map(hk)),
      blocked: new Set(src?.blocked || []), starts: new Set(src?.starts || []), wilds: new Set(src?.wilds || []),
      symbols: { ...(src?.symbols || {}) }, useSymbols: src ? Object.keys(src.symbols || {}).length > 0 : m() === 0,
      tool: 'block', pick: null, dirty: !src
    };
    if (!src && ed.useSymbols) scatter();
  };
  const scatter = () => {
    const free = [...ed.cells].filter(k => !ed.blocked.has(k) && !ed.starts.has(k) && !ed.wilds.has(k));
    for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
    ed.symbols = {};
    TYPES.forEach((_, i) => { if (free[i]) ed.symbols[i + 1] = free[i]; });
    if (free.length < TYPES.length) toast(`Only room for ${free.length} of 18 type symbols`);
  };
  const symAt = key => Object.entries(ed.symbols).find(([, k]) => k === key)?.[0];
  const draw = () => {
    if (!c) { app.innerHTML = `<div class="card empty">Campaign not found. <a href="#/">Back</a></div>`; return; }
    app.innerHTML = `
      <div class="row" style="margin-bottom:6px"><div class="muted">${esc(c.name)} · Mission ${m()}</div><div class="spacer"></div>
        <button class="btn small ghost" onclick="go('#/c/${cid}/dm')">Back to DM screen</button></div>
      <h1>Map for Mission ${m()}</h1>
      <div class="seg" style="margin:14px 0 18px" id="viewSeg">
        <button aria-pressed="${view === 'library'}" data-v="library">Saved maps</button>
        <button aria-pressed="${view === 'editor'}" data-v="editor">${ed ? (ed.fromId ? 'Editing: ' + esc(ed.fromName) : 'New map') : '＋ New map'}</button>
      </div>
      <div id="body"></div>`;
    app.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { view = b.dataset.v; if (view === 'editor' && !ed) freshEditor(null); draw(); });
    view === 'library' ? drawLibrary() : drawEditor();
  };
  const drawLibrary = () => {
    const body = document.getElementById('body');
    body.innerHTML = `<div class="muted">Loading…</div>`;
    libUnwatch?.();
    libUnwatch = DB.watchCol('maps', maps => {
      if (view !== 'library' || !document.getElementById('body')) return;
      maps.sort((a, b) => millis(b.createdAt) - millis(a.createdAt));
      body.innerHTML = maps.length ? `<div class="muted" style="margin-bottom:12px">Maps saved from any campaign. Tap one to use or edit it — the mission gets its own copy.</div><div class="grid" id="lib">${maps.map(mp => `
        <div class="card camp" data-id="${mp.id}">
          <svg class="board mini" data-prev="${mp.id}"></svg>
          <div class="row" style="margin-top:10px"><h3 style="margin:0">${esc(mp.name)}</h3><div class="spacer"></div>
            <button class="icon-btn" title="Delete from library" data-del="${mp.id}">🗑</button></div>
          <div class="muted" style="font-size:.9rem">${SHAPES[mp.shape]?.label || ''} · ${(mp.cells || []).length} hexes${(mp.wilds || []).length ? ' · wild zones' : ''}${Object.keys(mp.symbols || {}).length ? ' · type symbols' : ''}</div>
          ${mp.lastUsed ? `<div class="muted" style="font-size:.85rem">Last used: ${esc(mp.lastUsed)}</div>` : ''}
        </div>`).join('')}</div>`
        : `<div class="card empty">No saved maps yet. Tap <b>＋ New map</b> to build the first one.</div>`;
      maps.forEach(mp => { const s = body.querySelector(`[data-prev="${mp.id}"]`); s && renderBoard(s, { cells: mp.cells || [], blocked: mp.blocked, starts: mp.starts, wilds: mp.wilds, symbols: mp.symbols }); });
      body.querySelectorAll('[data-id]').forEach(card => card.onclick = e => {
        const mp = maps.find(x => x.id === card.dataset.id);
        if (e.target.closest('[data-del]')) {
          if (confirm(`Delete "${mp.name}" from the library? Missions already using it keep their copy.`)) DB.remove('maps/' + mp.id).catch(saveErr);
          return;
        }
        libUnwatch?.(); libUnwatch = null;
        freshEditor(mp); view = 'editor'; draw();
      });
    });
  };
  const drawEditor = () => {
    libUnwatch?.(); libUnwatch = null;
    const body = document.getElementById('body');
    const sh = SHAPES[ed.shape], p = ed.params[ed.shape];
    const tools = [['block', 'Blocked'], ['start', 'Start zone'], ['wild', 'Wild zone'], ['hex', 'Add / remove hex'], ...(ed.useSymbols ? [['symbol', 'Move type symbol']] : [])];
    const hints = { block: 'Tap hexes to block or unblock them.', start: 'Tap hexes to mark where players start.', wild: 'Tap hexes to mark where wild Pokémon start (they fill these first; the DM can still place anywhere).', hex: 'Tap a hex to remove it; tap a dashed hex to add it back.', symbol: ed.pick ? 'Now tap an empty hex to move it there.' : 'Tap a type symbol, then tap where it should go.' };
    body.innerHTML = `<div class="stack">
      <div class="card stack">
        <div class="row"><h2 style="margin:0">Shape &amp; size</h2><div class="spacer"></div><span class="muted">${ed.cells.size} hexes</span></div>
        <div class="seg" id="shapeSeg">${Object.entries(SHAPES).map(([k, s]) => `<button aria-pressed="${k === ed.shape}" data-v="${k}">${s.label}</button>`).join('')}</div>
        <div class="two">${sh.fields.map(([k, l]) => `<label class="field"><span>${l}</span><input type="number" min="1" max="40" data-k="${k}" value="${p[k]}"></label>`).join('')}</div>
        <div class="muted" style="font-size:.9rem">Changing the shape or size starts the hexes over.</div>
      </div>
      <div class="card stack">
        <div class="seg" id="toolSeg">${tools.map(([k, l]) => `<button aria-pressed="${k === ed.tool}" data-v="${k}">${l}</button>`).join('')}</div>
        <div class="muted">${hints[ed.tool]}</div>
        <svg class="board" id="edBoard"></svg>
        <div class="row">
          <label class="row" style="cursor:pointer"><input type="checkbox" id="useSym" ${ed.useSymbols ? 'checked' : ''}> Type symbols (starter chase)</label>
          <div class="spacer"></div>
          ${ed.useSymbols ? `<button class="btn small" id="rescatter">🎲 Scatter again</button>` : ''}
        </div>
        <div class="legend muted"><span><i class="lg start"></i>Start zone</span><span><i class="lg wild"></i>Wild zone</span><span><i class="lg blocked"></i>Blocked</span><span><i class="lg ghost"></i>Removed</span></div>
      </div>
      <div class="card stack">
        <label class="field"><span>Map name</span><input type="text" id="mapName" maxlength="40" value="${esc(ed.name)}"></label>
        <div class="row"><button class="btn ghost" onclick="go('#/c/${cid}/dm')">Cancel</button><div class="spacer"></div>
          ${ed.fromId && ed.dirty ? `<button class="btn" id="saveNew">Save as new map &amp; use</button><button class="btn primary" id="saveUpd">Update “${esc(ed.fromName)}” &amp; use</button>`
            : ed.fromId ? `<button class="btn primary" id="useAsIs">Use for Mission ${m()}</button>`
            : `<button class="btn primary" id="saveNew">Save to library &amp; use</button>`}
        </div>
      </div></div>`;
    const changed = () => {   // first edit of a saved map: redraw so the "update / save as new" buttons appear
      ed.dirty = true; drawEditor();
      const i = document.getElementById('mapName'); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
    };
    const ghosts = hexShape(ed.shape, p).map(hk).filter(k => !ed.cells.has(k));
    renderBoard(document.getElementById('edBoard'), {
      cells: [...ed.cells], ghosts, blocked: [...ed.blocked], starts: [...ed.starts], wilds: [...ed.wilds],
      symbols: ed.useSymbols ? ed.symbols : {}, selected: ed.pick ? ed.symbols[ed.pick] : null
    }, key => {
      const sym = symAt(key);
      if (ed.tool === 'hex') {
        if (ed.cells.has(key)) {
          ed.cells.delete(key); ed.blocked.delete(key); ed.starts.delete(key); ed.wilds.delete(key);
          if (sym) {   // the symbol hops to a random open hex so all 18 types stay on the map
            const taken = new Set(Object.values(ed.symbols));
            const open = [...ed.cells].filter(k => !ed.blocked.has(k) && !ed.starts.has(k) && !ed.wilds.has(k) && !taken.has(k));
            if (open.length) ed.symbols[sym] = open[Math.floor(Math.random() * open.length)]; else delete ed.symbols[sym];
          }
        }
        else ed.cells.add(key);
      } else if (ed.tool === 'block' || ed.tool === 'start' || ed.tool === 'wild') {
        if (!ed.cells.has(key)) return;
        if (sym && ed.useSymbols) return toast('Move the type symbol off this hex first');
        const zones = { block: ed.blocked, start: ed.starts, wild: ed.wilds }, set = zones[ed.tool];
        if (set.has(key)) set.delete(key); else { Object.values(zones).forEach(z => z.delete(key)); set.add(key); }   // a hex is one kind of zone at a time
      } else if (ed.tool === 'symbol') {
        if (sym) { ed.pick = ed.pick === sym ? null : sym; }
        else if (ed.pick) {
          if (!ed.cells.has(key) || ed.blocked.has(key) || ed.starts.has(key) || ed.wilds.has(key)) return toast('Pick an open hex');
          ed.symbols[ed.pick] = key; ed.pick = null;
        } else return;
      }
      ed.dirty = true; drawEditor();
    });
    body.querySelectorAll('#shapeSeg button').forEach(b => b.onclick = () => { ed.shape = b.dataset.v; resetHexes(); });
    body.querySelectorAll('[data-k]').forEach(inp => inp.onchange = () => { const v = Math.max(1, Math.min(40, parseInt(inp.value) || 1)); if (v === p[inp.dataset.k]) return; p[inp.dataset.k] = v; resetHexes(); });
    body.querySelectorAll('#toolSeg button').forEach(b => b.onclick = () => { ed.tool = b.dataset.v; ed.pick = null; drawEditor(); });
    document.getElementById('useSym').onchange = e => { ed.useSymbols = e.target.checked; if (ed.useSymbols && !Object.keys(ed.symbols).length) scatter(); if (!ed.useSymbols && ed.tool === 'symbol') ed.tool = 'block'; ed.dirty = true; drawEditor(); };
    document.getElementById('rescatter')?.addEventListener('click', () => { scatter(); ed.dirty = true; drawEditor(); });
    document.getElementById('mapName').oninput = e => { ed.name = e.target.value; if (ed.fromId && !ed.dirty) changed(); };
    document.getElementById('saveNew')?.addEventListener('click', () => save('new'));
    document.getElementById('saveUpd')?.addEventListener('click', () => save('update'));
    document.getElementById('useAsIs')?.addEventListener('click', () => save('asis'));
  };
  const resetHexes = () => {
    ed.cells = new Set(hexShape(ed.shape, ed.params[ed.shape]).map(hk));
    ed.blocked.clear(); ed.starts.clear(); ed.wilds.clear(); ed.pick = null; ed.dirty = true;
    if (ed.useSymbols) scatter();
    drawEditor();
  };
  const save = async how => {
    const name = ed.name.trim();
    if (!name) return toast('Give the map a name');
    if (!ed.cells.size) return toast('The map has no hexes');
    const usedTag = `${c.name} · Mission ${m()}`;
    const map = {
      name, shape: ed.shape, params: ed.params[ed.shape], cells: [...ed.cells], blocked: [...ed.blocked],
      starts: [...ed.starts], wilds: [...ed.wilds], symbols: ed.useSymbols ? ed.symbols : {}, lastUsed: usedTag
    };
    app.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      let id = ed.fromId;
      if (how === 'new') id = await DB.add('maps', map);
      else if (how === 'update') await DB.update('maps/' + id, map);
      else await DB.update('maps/' + id, { lastUsed: usedTag });
      // Players start on the start-zone hexes (top to bottom, left to right) if there are enough.
      const order = [...ed.starts].map(k => k.split(',').map(Number)).sort((a, b) => a[1] - b[1] || (a[0] + a[1] / 2) - (b[0] + b[1] / 2)).map(([q, r]) => q + ',' + r);
      const tokens = {};
      (c.players || []).forEach((pl, i) => { if (order[i]) tokens[pl.id] = order[i]; });
      const prev = await once(MISSION(cid, m()));
      if (prev) await DB.update(MISSION(cid, m()), { mapId: id, ...map, tokens, found: {}, foundAt: {} });   // keep the mission's setup
      else await DB.set(MISSION(cid, m()), { mapId: id, ...map, tokens, found: {} });
      toast('Map ready for Mission ' + m());
      go(`#/c/${cid}/dm`);
    } catch (e) { saveErr(e); app.querySelectorAll('button').forEach(b => b.disabled = false); }
  };
  once(CAMP(cid)).then(async camp => {
    c = camp;
    const ms = c && await once(MISSION(cid, c.mission ?? 0));
    if (ms?.phase === 'battle') { app.innerHTML = `<div class="card empty">This mission's battle is under way. End the battle before changing its map. <a href="#/c/${cid}/dm">Back</a></div>`; return; }
    draw();
  });
}

// ---- Player home (phone) ----
function screenPlayer(cid, pid) {
  let c = null, mis, misNum = null, misUnwatch = null, team = [], picking = false;
  const teamUnwatch = DB.watchDoc(PLAYER(cid, pid), d => {
    team = d?.team || [];
    // Every Pokémon has 10 EVs per level (max 510). Top up any that are short (fixes teams made before this rule was wired in).
    const fixed = team.map(m => { const have = STAT_KEYS.reduce((a, k) => a + (m.evs?.[k] || 0), 0) + (m.evPending || 0), want = Math.min(510, 10 * (m.level || 1)); return have < want ? { ...m, evPending: (m.evPending || 0) + want - have } : m; });
    if (fixed.some((m, i) => m !== team[i])) { DB.set(PLAYER(cid, pid), { team: fixed }).catch(saveErr); return; }
    if (c) draw();
  });
  const saveMon = async (uid, patch) => {
    try { const d = await once(PLAYER(cid, pid)); await DB.set(PLAYER(cid, pid), { team: (d?.team || team).map(m => m.uid === uid ? { ...m, ...patch } : m) }); } catch (e) { saveErr(e); }
  };
  const draftCard = () => {   // Mission 0 starter picks, in claim order
    const d = mis?.draft; if (!d) return '';
    const cur = d.active ? d.order[d.turn] : null;
    let h = `<div class="card stack"><h2 style="margin:0">Starter picks</h2>${pickOrderHTML(c, d)}`;
    if (cur && cur.pid === pid) {
      const list = starterChoices(c, cur.tid);
      h += `<div class="yourturn"><div><b>Your pick!</b> Choose a ${TYPES[cur.tid - 1]} starter. It starts at level 1 and is always shiny.</div></div>
        <div class="pickgrid">${list.map(s => `<button class="pickcard" data-final="${s.final}">${monImg(s.startsAs, true)}<b>${esc(s.startsAs)}</b><small>→ ${esc(s.pick)}</small>
          <span class="types">${(getPokemon(s.startsAs)?.types || []).map(t => `<i class="tchip">${t}</i>`).join('')}</span></button>`).join('')}</div>`;
    } else if (cur) h += `<div class="muted">Waiting for <b>${esc(nameOf(c, cur.pid))}</b> to pick a ${TYPES[cur.tid - 1]} starter.</div>`;
    return h + '</div>';
  };
  const teamCard = () => {
    const draftOn = !!mis?.draft?.active;
    if (!team.length) return `<div class="card"><h2>Your team (0)</h2><div class="muted">${mis?.draft ? 'Your starters will appear here as you pick them.' : 'Claim two types in the chase; then you pick a starter from each.'}</div></div>`;
    const canEdit = !draftOn && mis?.phase !== 'battle' && mis?.phase !== 'after';
    return `<div class="card stack"><h2 style="margin:0">Your team (${team.length})</h2><div class="muted" style="font-size:.85rem">Sorted by total stats.</div>${[...byTotal(team.filter(m => m.step === 'done')), ...team.filter(m => m.step !== 'done')].map(m => {
      const p = getPokemon(m.species);
      return `<div class="moncard">${monImg(m.species, m.shiny)}<div class="stack" style="flex:1;min-width:0">
        <div><b style="font-size:1.1rem">${esc(m.species)}</b> ${m.shiny ? '<span class="pill">★ Shiny</span>' : ''}<div class="muted" style="font-size:.9rem">Lv ${m.level} · ${(p?.types || []).join(' / ')} · becomes ${esc(m.finalName)}</div></div>
        ${m.step === 'done' ? `<div style="font-size:.92rem"><div>${esc(m.nature)} (${natureTag(m.nature)}) · ${esc(m.ability)}${m.abilitySlot === 'H' ? ' <span class="pill">Hidden</span>' : ''}</div>
            <div class="statline">${statLine(m)}</div>
            <div class="muted">IVs ${STAT_KEYS.map(k => m.ivs[k]).join(' / ')}${m.evs && STAT_KEYS.some(k => m.evs[k]) ? ` · EVs ${STAT_KEYS.map(k => m.evs[k]).join(' / ')}` : ''}</div><div>${m.moves.map(esc).join(' · ')}</div>
            ${canEdit ? `<div class="row" style="gap:8px;margin-top:6px">${m.evPending ? `<button class="btn small primary" data-tev="${m.uid}">Place ${m.evPending} EVs</button>` : ''}<button class="btn small" data-tmv="${m.uid}">Moves</button></div>` : ''}</div>`
          : draftOn ? `<div class="muted">Setup opens once everyone has picked.</div>`
          : `<div><button class="btn primary small" onclick="go('#/c/${cid}/p/${pid}/setup/${m.uid}')">Set up · ${STEP_NAMES[m.step]}</button></div>`}
      </div></div>`;
    }).join('')}</div>`;
  };
  const draw = () => {
    if (!c) { app.innerHTML = `<div class="card empty">Campaign not found. <a href="#/">Back</a></div>`; return; }
    const me = (c.players || []).find(p => p.id === pid);
    if (!me) { go(`#/c/${cid}/who`); return; }
    const mine = colorOf(c, pid);
    const takenColors = (c.players || []).filter(p => p.id !== pid).map(p => colorOf(c, p.id));
    const m0 = (c.mission ?? 0) === 0;
    const showMap = m0 && c.settings?.mapMode === 'app';   // Mission 0's chase map (Missions 1+ use the battle screen)
    const myFound = mis ? foundBy(mis, pid) : [];
    const chasing = !!mis?.chase?.active, myTurn = chasing && mis.chase.order[mis.chase.turn] === pid;
    app.innerHTML = `
      <div class="row" style="margin-bottom:6px"><div class="muted">${esc(c.name)}</div><div class="spacer"></div>
        <button class="btn small ghost" onclick="go('#/c/${cid}/who')">Not ${esc(me.name)}?</button></div>
      <div class="row"><span class="sw big" style="background:${mine}">${esc(initialsOf(c.players)[pid])}</span><h1 style="margin:0">Hi, ${esc(me.name)}</h1></div>
      <div class="stack" style="margin-top:14px">
        <div class="card row"><div><div class="muted" style="font-weight:600">Current mission</div><div class="mission-num">${c.mission ?? 0}</div></div></div>
        ${showMap ? `<div class="card stack">${!mis ? `<div class="muted">${mis === undefined ? 'Loading map…' : 'Waiting for the DM to set up the map.'}</div>` : `
          <div class="row"><h2 style="margin:0">Map</h2><div class="spacer"></div>${mis.chase?.active ? '' : '<span class="muted" style="font-size:.9rem">Tap a hex to move</span>'}</div>
          ${chaseBar(c, mis, pid)}
          ${myTurn ? `<div class="yourturn">${mis.chase.roll
              ? `<div><b>You rolled ${mis.chase.roll}.</b> Tap a lit hex to move there.</div><button class="btn" id="stay">Stay here</button>`
              : `<div><b>Your turn!</b> Roll to move.</div><button class="btn primary" id="rollMove">🎲 Roll D4</button>`}</div>` : ''}
          <svg class="board" id="board"></svg>
          ${myFound.length ? `<div class="row">${myFound.map(t => `${typeBadge(t)}<b>${TYPES[t - 1]}</b>`).join(' ')}<span class="muted">reached</span></div>` : ''}`}
        </div>` : ''}
        ${m0 ? '' : '<div id="missionArea"></div>'}
        ${draftCard()}
        ${teamCard()}
        <div class="card stack"><h2 style="margin:0">Your color</h2>
          <div class="row">${PALETTE.map(col => `<button class="swatch ${col === mine ? 'on' : ''}" style="background:${col}" data-col="${col}" ${takenColors.includes(col) ? 'disabled title="Taken"' : ''}></button>`).join('')}</div></div>
      </div>`;
    app.querySelectorAll('[data-final]').forEach(b => b.onclick = async () => {
      const d = mis.draft, cur = d?.active && d.order[d.turn];
      const s = cur && cur.pid === pid && starterChoices(c, cur.tid).find(x => x.final === +b.dataset.final);
      if (!s || picking) return;
      if (!confirm(`Pick ${s.startsAs}? It becomes ${s.pick} at the end of its line.`)) return;
      picking = true;
      const mon = { uid: 'm' + Date.now().toString(36) + randInt(1e6).toString(36), final: s.final, finalName: s.pick, species: s.startsAs, pickType: s.type,
        level: 1, shiny: true, evs: Object.fromEntries(STAT_KEYS.map(k => [k, 0])), evPending: 10, ivs: null, ivRolls: null,
        nature: null, natureRolls: null, ability: null, abilitySlot: null, abilityRolls: null, moves: [], step: 'ivs' };
      try {   // only the current picker can write here, so these steps can't collide
        await DB.set(PLAYER(cid, pid), { team: [...team, mon] });
        await DB.update(CAMP(cid), { takenFinals: [...(c.takenFinals || []), s.final] });
        await DB.update(MISSION(cid, misNum), { 'draft.picks': [...(d.picks || []), { pid, tid: cur.tid, final: s.final, uid: mon.uid, species: s.startsAs }],
          'draft.turn': d.turn + 1, 'draft.active': d.turn + 1 < d.order.length });
        toast(`${s.startsAs} joined your team!`);
      } catch (e) { saveErr(e); }
      picking = false;
    });
    app.querySelectorAll('[data-tev]').forEach(x => x.onclick = () => evModal(team.find(m => m.uid === x.dataset.tev), saveMon));
    app.querySelectorAll('[data-tmv]').forEach(x => x.onclick = () => movesModal(team.find(m => m.uid === x.dataset.tmv), saveMon));
    app.querySelectorAll('[data-col]').forEach(b => b.onclick = () => DB.update(CAMP(cid), { ['colors.' + pid]: b.dataset.col }).catch(saveErr));
    const area = document.getElementById('missionArea');
    if (area) {
      const ctx = { c, mis, cid, misNum, pid, team, viewer: pid, redraw: draw };
      if (mis === undefined) area.innerHTML = '';
      else if (!mis || (c.settings?.mapMode === 'app' && !mis.cells?.length)) area.innerHTML = `<div class="card muted">Waiting for the DM to set up Mission ${c.mission}.</div>`;
      else if ((mis.phase || 'setup') === 'setup') missionSetupPlayer(area, ctx);
      else if (mis.phase === 'battle') battleView(area, ctx);
      else afterMissionPlayer(area, ctx);
    }
    if (showMap && mis) {
      const reach = myTurn && mis.chase.roll ? reachable(mis, pid, mis.chase.roll) : null;
      renderBoard(document.getElementById('board'), boardOpts(c, mis, { mine: pid, reach }), key => {
        if (mis.tokens?.[pid] === key) return;
        if (chasing) {   // during the chase you move only on your turn, within your roll
          if (!myTurn) return toast(`Wait for your turn`);
          if (!mis.chase.roll) return toast('Roll first');
          if (!reach.has(key)) return toast(`Out of reach — up to ${mis.chase.roll} hex${mis.chase.roll > 1 ? 'es' : ''}`);
          const { patch, claimed } = chaseMove(c, mis, pid, key);
          return DB.update(MISSION(cid, misNum), patch).then(() => claimed && toast(`You reached ${TYPES[claimed - 1]}!`)).catch(saveErr);
        }
        if (!canStand(mis, key, pid)) return toast('You can’t move there');
        const { patch, claimed } = movePatch(mis, pid, key);
        DB.update(MISSION(cid, misNum), patch).then(() => claimed && toast(`You reached ${TYPES[claimed - 1]}!`)).catch(saveErr);
      });
      document.getElementById('rollMove')?.addEventListener('click', async () => {
        const res = await rollDice({ title: 'Move roll', dice: [4], mode: c.settings?.dice || 'physical' });
        if (!res || !(mis.chase?.active && mis.chase.order[mis.chase.turn] === pid && !mis.chase.roll)) return;
        DB.update(MISSION(cid, misNum), { 'chase.roll': res.total, 'chase.last': `${nameOf(c, pid)} rolled ${res.total}.` }).catch(saveErr);
      });
      document.getElementById('stay')?.addEventListener('click', () =>
        DB.update(MISSION(cid, misNum), { ...advanceTurn(c, mis, mis.found || {}), 'chase.last': `${nameOf(c, pid)} stayed put.` }).catch(saveErr));
    }
  };
  const campUnwatch = DB.watchDoc(CAMP(cid), camp => {
    c = camp;
    if (c && (c.mission ?? 0) !== misNum) {
      misUnwatch?.(); misNum = c.mission ?? 0; mis = undefined;
      misUnwatch = DB.watchDoc(MISSION(cid, misNum), d => { mis = d; draw(); });
    }
    draw();
  });
  unwatch = () => { campUnwatch?.(); misUnwatch?.(); teamUnwatch?.(); };
}

// ═══ 8. MISSIONS & BATTLE ══════════════════════════════════════════════
// Rules engine first (pure math, no screens), then the mission/battle screens.

// ---- Type chart (current games): attacking type → defending type → multiplier ----
const TYPE_CHART = {
  Normal: { Rock: .5, Ghost: 0, Steel: .5 },
  Fire: { Fire: .5, Water: .5, Grass: 2, Ice: 2, Bug: 2, Rock: .5, Dragon: .5, Steel: 2 },
  Water: { Fire: 2, Water: .5, Grass: .5, Ground: 2, Rock: 2, Dragon: .5 },
  Electric: { Water: 2, Electric: .5, Grass: .5, Ground: 0, Flying: 2, Dragon: .5 },
  Grass: { Fire: .5, Water: 2, Grass: .5, Poison: .5, Ground: 2, Flying: .5, Bug: .5, Rock: 2, Dragon: .5, Steel: .5 },
  Ice: { Fire: .5, Water: .5, Grass: 2, Ice: .5, Ground: 2, Flying: 2, Dragon: 2, Steel: .5 },
  Fighting: { Normal: 2, Ice: 2, Poison: .5, Flying: .5, Psychic: .5, Bug: .5, Rock: 2, Ghost: 0, Dark: 2, Steel: 2, Fairy: .5 },
  Poison: { Grass: 2, Poison: .5, Ground: .5, Rock: .5, Ghost: .5, Steel: 0, Fairy: 2 },
  Ground: { Fire: 2, Electric: 2, Grass: .5, Poison: 2, Flying: 0, Bug: .5, Rock: 2, Steel: 2 },
  Flying: { Electric: .5, Grass: 2, Fighting: 2, Bug: 2, Rock: .5, Steel: .5 },
  Psychic: { Fighting: 2, Poison: 2, Psychic: .5, Dark: 0, Steel: .5 },
  Bug: { Fire: .5, Grass: 2, Fighting: .5, Poison: .5, Flying: .5, Psychic: 2, Ghost: .5, Dark: 2, Steel: .5, Fairy: .5 },
  Rock: { Fire: 2, Ice: 2, Fighting: .5, Ground: .5, Flying: 2, Bug: 2, Steel: .5 },
  Ghost: { Normal: 0, Psychic: 2, Ghost: 2, Dark: .5 },
  Dragon: { Dragon: 2, Steel: .5, Fairy: 0 },
  Dark: { Fighting: .5, Psychic: 2, Ghost: 2, Dark: .5, Fairy: .5 },
  Steel: { Fire: .5, Water: .5, Electric: .5, Ice: 2, Rock: 2, Steel: .5, Fairy: 2 },
  Fairy: { Fire: .5, Fighting: 2, Poison: .5, Dragon: 2, Dark: 2, Steel: .5 }
};
const typeMults = (moveType, defTypes) => defTypes.map(t => TYPE_CHART[moveType]?.[t] ?? 1);
const effOf = (moveType, defTypes) => typeMults(moveType, defTypes).reduce((a, b) => a * b, 1);
const effLabel = e => e === 0 ? 'No effect' : e >= 4 ? '4× super effective' : e >= 2 ? '2× super effective' : e <= .25 ? '¼× not very effective' : e < 1 ? '½× not very effective' : '1× neutral';

// ---- Speed table: current speed → Order (meter limit) and movement die ----
const SPEED_TIERS = [[14, 14, 4], [30, 13, 4], [54, 12, 4], [87, 11, 6], [128, 10, 6], [180, 9, 8], [241, 8, 8], [315, 7, 10], [400, 6, 10], [434, 5, 12], [Infinity, 4, 20]];
const speedTier = spe => { const t = SPEED_TIERS.find(([max]) => spe <= max); return { order: t[1], die: t[2] }; };

// ---- Stat stages, statuses ----
const STAGE_KEYS = ['atk', 'def', 'spa', 'spd', 'spe', 'acc', 'eva', 'crit'];
const STAGE_LABEL = { atk: 'ATK', def: 'DEF', spa: 'SP ATK', spd: 'SP DEF', spe: 'SPD', acc: 'ACC', eva: 'EVADE', crit: 'CRIT' };
const stageMult = s => s >= 0 ? (2 + s) / 2 : 2 / (2 - s);
const STATUS_NAME = { brn: 'Burned', par: 'Paralyzed', psn: 'Poisoned', tox: 'Badly poisoned', slp: 'Asleep', frz: 'Frozen' };
const STATUS_SHORT = { brn: 'BRN', par: 'PAR', psn: 'PSN', tox: 'TOX', slp: 'SLP', frz: 'FRZ' };
const STATUS_IMMUNE = { brn: ['Fire'], par: ['Electric'], psn: ['Poison', 'Steel'], tox: ['Poison', 'Steel'], frz: ['Ice'], slp: [] };
const pokeRound = v => (v % 1 > 0.5 ? Math.ceil(v) : Math.floor(v));   // the games round .5 down here
function currentSpeed(u, b) {   // speed after stages, paralysis, and speed abilities in weather/terrain
  let s = Math.floor(u.stats.spe * stageMult(u.stages.spe));
  const a = b ? abil(b, u) : null; let m = 1;
  if (b) {
    if (a === 'Swift Swim' && rainNow(b)) m *= 2;
    if (a === 'Chlorophyll' && sunFor(b, u)) m *= 2;
    if (a === 'Sand Rush' && weatherNow(b) === 'sand') m *= 2;
    if (a === 'Slush Rush' && snowOrHail(b)) m *= 2;
    if (a === 'Surge Surfer' && terrainNow(b) === 'electric') m *= 2;
    if (a === 'Quick Feet' && u.status) m *= 1.5;
    if (a === 'Slow Start' && (u.ab?.slowStart || 0) < 5) m *= .5;
    if (boosterStat(b, u) === 'spe') m *= 1.5;
  }
  s = Math.floor(s * m);
  if (u.status === 'par' && a !== 'Quick Feet') s = Math.floor(s / 2);
  return Math.max(1, s);
}
const SELF_TARGETS = ['Self', 'Self or ally', 'Your team', 'Your side', 'All allies', 'One ally'];
const SPREAD_TARGETS = ['All adjacent foes', 'All adjacent'];
const parseHits = h => { if (typeof h === 'number') return h; const m = String(h || '1').match(/(\d+)\D+(\d+)/); return m ? [Number(m[1]), Number(m[2])] : Number(h) || 1; };
const multiHitFromD20 = d => d <= 7 ? 2 : d <= 14 ? 3 : d <= 17 ? 4 : 5;   // the games' 35/35/15/15 odds
const critFromD20 = (stage, d20) => stage >= 3 || (stage === 2 && d20 >= 11) || (stage === 1 && d20 >= 19) || d20 === 20;
const sleepTurnsFromD6 = d => d <= 2 ? 1 : d <= 4 ? 2 : 3;

// Wild Pokémon: IVs 31, neutral nature, EVs 252 / 252 / 4 into the three highest base stats
// (ties broken in the order HP, DEF, SP DEF, SPD, ATK, SP ATK).
const WILD_TIE_ORDER = ['hp', 'def', 'spd', 'spe', 'atk', 'spa'];
function wildEVs(base) {
  const order = [...WILD_TIE_ORDER].sort((a, b) => base[b] - base[a] || WILD_TIE_ORDER.indexOf(a) - WILD_TIE_ORDER.indexOf(b));
  const ev = Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
  ev[order[0]] = 252; ev[order[1]] = 252; ev[order[2]] = 4;
  return ev;
}
const statsFor = (species, ivs, evs, level, nature) => {
  const base = getPokemon(species)?.stats || {};
  return Object.fromEntries(STAT_KEYS.map(k => [k, calcStat(k, base[k] || 1, ivs[k], evs[k], level, nature)]));
};
// Wild default moves: the 4 most recently learned level-up moves, like wild Pokémon in the games.
function defaultWildMoves(species, level) {
  const known = getMovepool(species).filter(m => m.method === 'Level-up' && m.level <= level);
  const best = {};
  for (const m of known) best[m.move] = Math.max(best[m.move] ?? -1, m.level ?? 0);
  return Object.entries(best).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 4).map(([n]) => n);
}
const abilityOptions = species => { const p = getPokemon(species) || {}; return [...(p.abilities || []), ...(p.hidden ? [p.hidden] : [])]; };

function newUnit(base) {
  return { status: null, slp: 0, tox: 0, stages: Object.fromEntries(STAGE_KEYS.map(k => [k, 0])), meter: 0, pos: null, out: false, fainted: false, kos: 0, ...base };
}
function unitFromMon(pid, mon) {
  const stats = statsFor(mon.species, mon.ivs, mon.evs || {}, mon.level, mon.nature);
  return newUnit({ id: 'p_' + mon.uid, side: 'p', owner: pid, ref: mon.uid, final: mon.final, name: mon.species, level: mon.level, shiny: !!mon.shiny,
    types: getPokemon(mon.species)?.types || [], stats, maxHp: stats.hp, hp: stats.hp, ability: mon.ability, moves: mon.moves || [] });
}
function unitFromWild(final, level, setup) {
  const species = formAtLevel(final, level);
  const base = getPokemon(species)?.stats || {};
  const stats = statsFor(species, Object.fromEntries(STAT_KEYS.map(k => [k, 31])), wildEVs(base), level, null);
  return newUnit({ id: 'w_' + String(final).replace(/\W/g, '_'), side: 'w', owner: 'dm', ref: final, final, name: species, level, shiny: false,
    types: getPokemon(species)?.types || [], stats, maxHp: stats.hp, hp: stats.hp,
    ability: setup?.ability || abilityOptions(species)[0] || '', moves: setup?.moves?.length ? setup.moves : defaultWildMoves(species, level) });
}

// ---- The turn meter ----
const onField = (b, u) => u.out && !u.fainted && (b.noMap || !!u.pos);
// Advance the meters to the next Pokémon to act (ties: higher speed → player before wild → hidden initiative list).
function pickNext(b) {
  const act = Object.values(b.units).filter(u => onField(b, u));
  if (!act.length) return null;
  const need = u => speedTier(currentSpeed(u, b)).order - u.meter;
  const k = Math.max(0, Math.min(...act.map(need)));
  act.forEach(u => u.meter += k);
  const ready = act.filter(u => need(u) <= 0);
  ready.sort((a, b2) => currentSpeed(b2, b) - currentSpeed(a, b) || (a.side === b2.side ? 0 : a.side === 'p' ? -1 : 1) || b.init.indexOf(a.id) - b.init.indexOf(b2.id));
  const win = ready[0];
  if (ready.length > 1 && currentSpeed(ready[1], b) === currentSpeed(win, b) && ready[1].side === win.side) {
    b.init = [...b.init.filter(id => id !== win.id), win.id];   // won a tie on the hidden list → goes to the bottom
  }
  win.meter = 0;
  return win;
}
function upcoming(b, n) {   // preview of the next n turns (doesn't change the real battle)

      return `<div class="partyrow ${inP ? 'on' : ''}"><button class="row grow" data-party="${m.uid}" style="all:unset;display:flex;gap:10px;align-items:center;flex:1;cursor:pointer">${monImg(m.species, m.shiny, 'spr sm')}<div><b>${esc(m.species)}</b> <span class="muted" style="font-size:.85rem">Lv ${m.level} · ${(getPokemon(m.species)?.types || []).join(' / ')}</span><div class="statline">${statLine(m)}</div></div></button>
        ${inP ? `<button class="icon-btn ${lead ? 'star' : ''}" data-lead="${m.uid}" title="Goes out first">${lead ? '★' : '☆'}</button>` : ''}</div>`; }).join('')}</div>`
      : '<div class="muted">Finish setting up your Pokémon first.</div>'}
    <div class="muted" style="font-size:.9rem">The DM starts the battle when everyone's ready.</div></div>`;
  const save = (p, l) => DB.update(MISSION(cid, misNum), { ['setup.parties.' + pid]: p, ['setup.leads.' + pid]: l }).catch(saveErr);
  el.querySelectorAll('[data-party]').forEach(b => b.onclick = () => {
    let p = party.map(m => m.uid); const id = b.dataset.party;
    if (p.includes(id)) p = p.filter(x => x !== id); else if (p.length >= 6) return toast('6 Pokémon max'); else p.push(id);
    save(p, leads.map(m => m.uid).filter(x => p.includes(x)));
  });
  el.querySelectorAll('[data-lead]').forEach(b => b.onclick = () => {
    let l = leads.map(m => m.uid); const id = b.dataset.lead;
    if (l.includes(id)) l = l.filter(x => x !== id); else { if (l.length >= need) return toast(`Only ${need} can go out first — unstar one`); l.push(id); }
    save(party.map(m => m.uid), l);
  });
}

// ---- The battle screen (shared by the DM screen and phones) ----
function battleView(el, ctx) {
  const { c, mis, cid, misNum, viewer } = ctx;
  const b = mis.battle, isDM = viewer === 'dm';
  const mode = c.settings?.dice || 'physical';
  const save = nb => DB.update(MISSION(cid, misNum), { battle: nb }).catch(saveErr);
  const settle = nb => { if (!nb.turn && !blocked(nb)) startTurn(nb); return nb; };
  const controls = u => u && (isDM || (u.side === 'p' && u.owner === viewer));
  const units = Object.values(b.units);
  const turnU = b.turn ? b.units[b.turn.id] : null;
  const myTurn = controls(turnU) && !b.over;
  const ringOf = u => u.side === 'w' ? 'var(--ink)' : colorOf(c, u.owner);
  if (BUI.place && (b.units[BUI.place]?.pos || b.units[BUI.place]?.fainted)) BUI.place = null;   // done placing

  // Which hexes light up, and what a tap does
  let lit = null, tap = null, hint = '';
  const placing = BUI.place && b.units[BUI.place] && !b.units[BUI.place].pos ? b.units[BUI.place] : null;
  if (!b.noMap && placing) {
    const u = placing;
    if (u.side === 'p') {
      const open = new Set(openHexes(b, mis)), starts = (mis.starts || []).filter(k => open.has(k));
      lit = b.started ? legalPlayerHexes(b, mis) : new Set(starts.length ? starts : open);
      hint = b.started ? `Place ${u.name}: a start hex, or 3+ hexes from every enemy and no farther up than the closest enemy.` : `Place ${u.name} on a start hex.`;
    } else {
      const open = new Set(openHexes(b, mis)), zones = (mis.wilds || []).filter(k => open.has(k));
      lit = new Set(zones.length ? zones : open);
      hint = `Place ${u.name}${zones.length ? ' (wild zones are lit; any open hex works)' : ''}.`;
    }
    tap = key => {
      const ok = u.side === 'w' ? openHexes(b, mis).includes(key) : lit.has(key);
      if (!ok) return toast('Not an allowed hex');
      const nb = clone(b); nb.units[u.id].pos = key; blog(nb, `${u.name} was sent out.`); if (nb.started) enterField(nb, nb.units[u.id]); BUI.place = null; save(settle(nb));
    };
  } else if (!b.noMap && myTurn && b.turn.step === 'move' && b.turn.roll) {
    lit = reachableInBattle(b, mis, turnU, b.turn.roll);
    hint = `Move ${turnU.name} up to ${b.turn.roll} hex${b.turn.roll > 1 ? 'es' : ''}: tap a lit hex, or Stay.`;
    tap = key => {
      if (!lit.has(key)) return toast(`Out of reach — up to ${b.turn.roll}`);
      const nb = clone(b); nb.units[turnU.id].pos = key; nb.turn.step = 'act'; save(nb);
    };

    const u = b.units[BUI.dmMove]; lit = new Set(openHexes(b, mis)); hint = `DM move: tap where ${u.name} goes.`;

  }

  // What's waiting (placements, replacements)
  const waits = [];
  for (const u of needsPlacement(b)) if (controls(u)) waits.push(`<button class="chip ${BUI.place === u.id ? 'on' : ''}" data-place="${u.id}">${monImg(u.name, u.shiny, 'spr xs')}Place ${esc(u.name)}</button>`);
  (b.needs || []).forEach((n, i) => {
    const mine = isDM || (n.side === 'p' && n.owner === viewer);

    if (!mine) { waits.push(`<span class="muted">Waiting for ${who} to send out a Pokémon…</span>`); return; }

    waits.push(`<div class="stack" style="--gap:6px"><b>${n.side === 'w' ? 'Send out the next wild Pokémon' : (n.owner === viewer ? 'Choose your next Pokémon' : `${who}: choose the next Pokémon`)}</b>

        const cands = units.filter(u => onField(b, u) && u.id !== turnU.id);
        BUI.targets = (BUI.targets || []).filter(id => cands.some(u => u.id === id));
        body = `<div class="opt wide on" style="cursor:default">${moveCardHTML(mv.name)}</div>
          ${selfMv ? `<div class="muted">Targets ${esc(turnU.name)} itself${mv.target !== 'Self' ? ' / its side' : ''}.</div>` : `<div><b>Choose ${spreadMv ? 'targets' : 'a target'}</b> <span class="muted">(${esc(mv.target)} — the table judges range)</span></div>
          <div class="targets">${cands.map(u => { const e = mv.category === 'Status' ? null : effOf(moveFor(b, turnU, mv).type, u.types), on = BUI.targets.includes(u.id);
            return `<button class="target ${on ? 'on' : ''} side-${u.side}" data-tgt="${u.id}">${monImg(u.name, u.shiny, 'spr sm')}<div><b>${esc(u.name)}</b> <span class="muted">${esc(sideName(b, u))}</span>
              <div class="types">${u.types.map(t2 => `<i class="tchip t-${t2}">${t2}</i>`).join('')}</div><div class="abil">${esc(abil(b, u) || '')}</div>${hpBar(u)}${e !== null ? `<div class="eff e${String(e).replace('.', '')}">${effLabel(e)}</div>` : ''}</div></button>`; }).join('')}</div>`}
          <div class="row"><button class="btn ghost" data-act="back">Back</button><div class="spacer"></div><button class="btn primary" data-act="use" ${selfMv || BUI.targets.length ? '' : 'disabled'}>Use ${esc(mv.name)}</button></div>`;
      } else {
        const locked = abil(b, turnU) === 'Gorilla Tactics' && turnU.ab?.locked, trap = trappedBy(b, turnU);
        body = `${locked ? `<div class="muted">Gorilla Tactics: locked into ${esc(locked)} until it switches out.</div>` : ''}<div class="movegrid">${turnU.moves.filter(m => !locked || m === locked).map(m => `<button class="opt" data-move="${esc(m)}">${moveCardHTML(m)}</button>`).join('')}</div>
          <div class="row">${trap ? `<span class="muted">Can't switch: ${esc(trap)}</span>` : `<button class="btn" data-act="switch">⇄ Switch</button>`}<div class="spacer"></div><button class="btn ghost" data-act="skip">End turn without a move</button></div>`;
      }
    }
    turnHTML = `<div class="turnpanel"><div class="row">${monImg(turnU.name, turnU.shiny, 'spr sm')}<div><b style="font-size:1.1rem">${esc(turnU.name)}'s turn</b> ${statusChip(turnU)}<div class="muted" style="font-size:.85rem">${esc(sideName(b, turnU))} · Lv ${turnU.level} · ${hpBar(turnU)}</div></div></div>${body}</div>`;
  }

  const order = upcoming(b, 7).map(id => b.units[id]).filter(Boolean);
  const unitRow = u => `<div class="unitrow ${u.fainted ? 'fainted' : ''} ${b.turn?.id === u.id ? 'now' : ''}" ${isDM ? `data-edit="${u.id}"` : ''}>
      <span class="ring" style="border-color:${ringOf(u)}">${monImg(u.name, u.shiny, 'spr xs')}</span>
      <div style="flex:1;min-width:0"><div><b>${esc(u.name)}</b> <span class="muted" style="font-size:.85rem">Lv ${u.level}${u.side === 'p' ? ' · ' + esc(b.names?.[u.owner] || '') : ''}${!u.out && !u.fainted ? ' · bench' : ''}${u.kos ? ` · ${u.kos} KO` : ''}</span> ${statusChip(u)} ${stageChips(u)}</div>
        <div class="abil">${esc(abil(b, u) || u.ability || '')}${(u.ab?.now && u.ab.now !== u.ability) ? ` <span class="muted">(was ${esc(u.ability)})</span>` : ''} ${abilityTag(abil(b, u) || u.ability)}</div>${hpBar(u)}</div></div>`;
  const shownWild = units.filter(u => u.side === 'w' && (isDM || u.revealed || u.out));   // players only see wild Pokémon once they've been sent out
  const last = b.last;
  const ft = fieldText(b);
  el.innerHTML = `<div class="stack">
    ${ft ? `<div class="fieldbar">${ft}</div>` : ''}
    ${turnHTML}
    ${waits.length ? `<div class="card stack">${waits.join('')}</div>` : ''}
    ${bench.length && !b.over ? `<div class="row"><span class="muted">Wild bench:</span>${bench.map(u => `<button class="chip ${BUI.place === u.id ? 'on' : ''}" data-sendout="${u.id}">${monImg(u.name, false, 'spr xs')}Send out ${esc(u.name)}</button>`).join('')}</div>` : ''}
    ${b.noMap ? '' : `${hint ? `<div class="hint">${esc(hint)}</div>` : ''}<svg class="board" id="bboard"></svg>`}
    ${order.length && b.started && !b.over ? `<div class="row orderstrip"><span class="muted">Up next:</span>${order.map((u, i) => `<span class="chip ${i === 0 ? 'on' : ''}"><span class="sw" style="background:${ringOf(u)}"></span>${esc(u.name)}</span>`).join('')}</div>` : ''}
    ${last ? `<details class="card"><summary><b>${esc(last.who)}</b> used <b>${esc(last.move)}</b> — damage details</summary><div class="muted" style="font-size:.9rem;margin-top:8px">${last.lines.map(esc).join('<br>') || 'No damage roll.'}</div></details>` : ''}
    <div class="grid">
